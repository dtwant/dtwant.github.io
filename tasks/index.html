    return { label: `期限: ${dueStr}`, className: '' };
  }

  
  
  
  function App() {
    
    const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('tl_unlocked') === 'true');
    const [pinCode, setPinCode] = useState('');
    const [pinError, setPinError] = useState(false);
    const [pinStatus, setPinStatus] = useState('idle'); 

    
    const [tasks, setTasks] = useState([]);
    const [blobId, setBlobId] = useState(() => localStorage.getItem(BLOB_KEY) || null);
    
    
    const [syncStatus, setSyncStatus] = useState('local'); 
    const [localSaveStatus, setLocalSaveStatus] = useState('ok'); 
    
    
    const [statusFilter, setStatusFilter] = useState('active'); 
    const [priorityFilter, setPriorityFilter] = useState('all'); 
    const [searchQuery, setSearchQuery] = useState('');
    const [sortKey, setSortKey] = useState('priority'); 
    
    
    const [isConfigOpen, setIsConfigOpen] = useState(false);
    const [isAddOpen, setIsAddOpen] = useState(false);
    const [editTask, setEditTask] = useState(null); 
    const [pendingDeleteTask, setPendingDeleteTask] = useState(null);
    
    
    const [newObj, setNewObj] = useState('');
    const [newPri, setNewPri] = useState('B');
    const [newDue, setNewDue] = useState('');
    const [newNote, setNewNote] = useState('');

    
    const [configBlobInput, setConfigBlobInput] = useState('');

    
    const [toasts, setToasts] = useState([]);

    
    const searchInputRef = useRef(null);
    const pinInputRef = useRef(null);
    const pinVerifyTimerRef = useRef(null);
    const deleteCancelRef = useRef(null);
    const deleteOriginRef = useRef(null);

    
    const addToast = (msg, type = 'info') => {
      const id = Date.now();
      setToasts(prev => [...prev, { id, msg, type, show: true }]);
      setTimeout(() => {
        setToasts(prev => prev.map(t => t.id === id ? { ...t, show: false } : t));
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 300);
      }, 2500);
    };

    
    useEffect(() => {
      let localTasks = null;
      try {
        localTasks = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch(e) {}

      if (localTasks && Array.isArray(localTasks)) {
        
        const sanitized = localTasks.map((t, i) => ({
          id: t.id || (Date.now() + i),
          task: String(t.task || ''),
          priority: t.priority || 'B',
          due: String(t.due || ''),
          done: !!t.done,
          note: String(t.note || ''),
          createdAt: t.createdAt || (Date.now() - i * 1000)
        }));
        setTasks(sanitized);
      } else if (INITIAL_YAML && Array.isArray(INITIAL_YAML) && INITIAL_YAML.length > 0) {
        const mapped = INITIAL_YAML.map((t, i) => ({
          id: Date.now() + i,
          task: String(t.task || ''),
          priority: t.priority || 'B',
          due: String(t.due || ''),
          done: !!t.done,
          note: String(t.note || ''),
          createdAt: Date.now() - (INITIAL_YAML.length - i) * 1000
        }));
        setTasks(mapped);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mapped));
      }
    }, []);

    
    useEffect(() => {
      async function checkSyncAndSync() {
        if (unlocked) {
          let currentBlobId = blobId;
          if (window.PWAConfigSync) {
            currentBlobId = await window.PWAConfigSync.syncAppBinId('tasklist', blobId);
            if (currentBlobId !== blobId) {
              setBlobId(currentBlobId);
              if (currentBlobId) {
                localStorage.setItem(BLOB_KEY, currentBlobId);
              } else {
                localStorage.removeItem(BLOB_KEY);
              }
            }
          }
          if (currentBlobId) {
            syncCloud(true, currentBlobId);
          }
        }
      }
      checkSyncAndSync();
    }, [unlocked]);

    
    useEffect(() => {
      const handleKeyDown = (e) => {
        if (unlocked && e.key === '/' && document.activeElement !== searchInputRef.current && !isConfigOpen && !isAddOpen && !editTask) {
          e.preventDefault();
          searchInputRef.current?.focus();
        }
      };
      window.addEventListener('keydown', handleKeyDown);
      return () => window.removeEventListener('keydown', handleKeyDown);
    }, [unlocked, isConfigOpen, isAddOpen, editTask]);

    
    const verifyPin = (code) => {
      if (code === PASS_CODE) {
        setPinStatus('success');
        setPinError(false);
        setUnlocked(true);
        sessionStorage.setItem('tl_unlocked', 'true');
        addToast('ロックを解除しました', 'success');
      } else {
        setPinError(true);
        setPinStatus('error');
        addToast('PINが正しくありません', 'error');
        setTimeout(() => {
          setPinCode('');
          setPinError(false);
          setPinStatus('idle');
          pinInputRef.current?.focus();
        }, 800);
      }
    };

    const schedulePinVerification = (code) => {
      if (pinVerifyTimerRef.current) clearTimeout(pinVerifyTimerRef.current);
      pinVerifyTimerRef.current = setTimeout(() => {
        pinVerifyTimerRef.current = null;
        verifyPin(code);
      }, 150);
    };

    
    const handlePinPress = (val) => {
      if (pinError) return;
      if (val === 'clear') {
        if (pinVerifyTimerRef.current) clearTimeout(pinVerifyTimerRef.current);
        setPinCode('');
        setPinStatus('idle');
      } else if (val === 'back') {
        if (pinVerifyTimerRef.current) clearTimeout(pinVerifyTimerRef.current);
        setPinCode(prev => prev.slice(0, -1));
      } else {
        if (pinCode.length < 4) {
          const newCode = pinCode + val;
          setPinCode(newCode);
          if (newCode.length === 4) {
            schedulePinVerification(newCode);
          }
        }
      }
    };

    
    useEffect(() => {
      if (unlocked) return undefined;
      const frame = window.requestAnimationFrame(() => pinInputRef.current?.focus());
      return () => window.cancelAnimationFrame(frame);
    }, [unlocked]);

    useEffect(() => () => {
      if (pinVerifyTimerRef.current) clearTimeout(pinVerifyTimerRef.current);
    }, []);

    const handlePinInput = (event) => {
      if (pinError) return;
      const rawValue = event.currentTarget?.value || '';
      const nextCode = rawValue.replace(/\D/g, '').slice(0, 4);
      setPinCode(nextCode);
      if (nextCode.length === 4) {
        schedulePinVerification(nextCode);
      } else {
        setPinStatus('idle');
      }
    };

    const handlePinKeyDown = (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        handlePinPress('clear');
      }
    };

    
    const saveLocal = (updatedTasks) => {
      setTasks(updatedTasks);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedTasks));
        setLocalSaveStatus('ok');
      } catch(e) {
        setLocalSaveStatus('error');
      }
    };

    
    const syncCloud = async (silent = false, customBlobId = null) => {
      setSyncStatus('busy');
      let currentBlobId = customBlobId !== null ? customBlobId : blobId;
      try {
        if (!currentBlobId) {
          
          const res = await fetch(JB_CREATE, {
            method: 'POST',
            headers: { ...JB_HDR(), 'X-Bin-Name': 'tasks_log' },
            body: JSON.stringify({ tasks })
          });
          if (!res.ok) throw new Error(`create: ${res.status}`);
          const json = await res.json();
          currentBlobId = json.metadata.id;
          setBlobId(currentBlobId);
          localStorage.setItem(BLOB_KEY, currentBlobId);
          if (window.PWAConfigSync) {
            await window.PWAConfigSync.syncAppBinId('tasklist', currentBlobId);
          }
          setSyncStatus('ok');
          if (!silent) addToast('クラウドに保存しました', 'success');
        } else {
          
          const r = await fetch(binUrl(currentBlobId), { headers: { 'X-Master-Key': getJbKey() }, cache: 'no-store' });
          if (!r.ok) {
            if ([400, 401, 403, 404, 422].includes(r.status)) {
              setBlobId(null);
              localStorage.removeItem(BLOB_KEY);
              if (!silent) addToast('同期IDが無効です。再接続します', 'error');
              return syncCloud(silent);
            }
            throw new Error(`get: ${r.status}`);
          }
          const json = await r.json();
          const rec = json.record || json;
          const remoteTasks = Array.isArray(rec.tasks) ? rec.tasks : Array.isArray(rec) ? rec : [];
          
          
          const merged = mergeTasks(tasks, remoteTasks);
          saveLocal(merged);
          
          
          const p = await fetch(binPut(currentBlobId), {
            method: 'PUT',
            headers: JB_HDR(),
            body: JSON.stringify({ tasks: merged })
          });
          if (!p.ok) throw new Error(`put: ${p.status}`);
          setSyncStatus('ok');
          if (!silent) addToast('同期しました', 'success');
        }
      } catch(e) {
        setSyncStatus('err');
        if (!silent) addToast('同期できませんでした。端末の保存は継続しています', 'error');
        console.error(e);
      }
    };

    const pushToCloud = async (currentTasks) => {
      if (!blobId) return;
      try {
        const p = await fetch(binPut(blobId), {
          method: 'PUT',
          headers: JB_HDR(),
          body: JSON.stringify({ tasks: currentTasks })
        });
        if (p.ok) setSyncStatus('ok');
        else setSyncStatus('err');
      } catch(e) {
        setSyncStatus('err');
      }
    };

    const mergeTasks = (local, remote) => {
      const byId = {};
      const allTasks = [...(Array.isArray(remote) ? remote : []), ...(Array.isArray(local) ? local : [])];
      allTasks.forEach((t, idx) => {
        const id = t.id || (Date.now() + idx);
        byId[id] = {
          ...t,
          id: id,
          task: String(t.task || ''),
          priority: t.priority || 'B',
          due: String(t.due || ''),
          done: !!t.done,
          note: String(t.note || ''),
          createdAt: t.createdAt || (Date.now() - idx * 1000)
        };
      });
      return Object.values(byId);
    };

    const clearListFilters = () => {
      setStatusFilter('all');
      setPriorityFilter('all');
      setSearchQuery('');
    };

    const loadInitialTasks = () => {
      if (!Array.isArray(INITIAL_YAML) || INITIAL_YAML.length === 0) {
        addToast('初期データがありません', 'error');
        return;
      }
      const initialTasks = INITIAL_YAML.map((t, i) => ({
        id: Date.now() + i,
        task: String(t.task || ''),
        priority: t.priority || 'B',
        due: String(t.due || ''),
        done: !!t.done,
        note: String(t.note || ''),
        createdAt: Date.now() - (INITIAL_YAML.length - i) * 1000
      }));
      const merged = mergeTasks(tasks, initialTasks);
      saveLocal(merged);
      pushToCloud(merged);
      clearListFilters();
      addToast('初期データを読み込みました', 'success');
    };

    
    const toggleTask = (id) => {
      const updated = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      saveLocal(updated);
      pushToCloud(updated);
      addToast(updated.find(t => t.id === id).done ? 'タスクを完了にしました' : '未完了に戻しました');
    };

    
    const deleteTask = (id) => {
      const updated = tasks.filter(t => t.id !== id);
      saveLocal(updated);
      pushToCloud(updated);
      addToast('タスクを削除しました', 'info');
    };

    const restoreDeleteFocus = () => {
      window.requestAnimationFrame(() => {
        if (deleteOriginRef.current?.isConnected) {
          deleteOriginRef.current.focus();
        } else {
          document.querySelector('.tl-tabs-trigger')?.focus();
        }
      });
    };

    const requestDeleteTask = (task) => {
      deleteOriginRef.current = document.activeElement;
      setPendingDeleteTask({ id: task.id, task: task.task });
    };

    const cancelDeleteTask = () => {
      setPendingDeleteTask(null);
      restoreDeleteFocus();
    };

    const confirmDeleteTask = () => {
      if (!pendingDeleteTask) return;
      deleteTask(pendingDeleteTask.id);
      setPendingDeleteTask(null);
      restoreDeleteFocus();
    };

    useEffect(() => {
      if (!pendingDeleteTask) return undefined;
      const frame = window.requestAnimationFrame(() => deleteCancelRef.current?.focus());
      const handleDeleteKeyDown = (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          cancelDeleteTask();
        }
      };
      document.addEventListener('keydown', handleDeleteKeyDown);
      return () => {
        window.cancelAnimationFrame(frame);
        document.removeEventListener('keydown', handleDeleteKeyDown);
      };
    }, [pendingDeleteTask]);

    
    const handleCreateTask = (e) => {
      if (e) e.preventDefault();
      if (!newObj.trim()) {
        addToast('タスク名を入力してください', 'error');
        return;
      }
      const newTask = {
        id: Date.now(),
        task: newObj.trim(),
        priority: newPri,
        due: newDue.trim(),
        done: false,
        note: newNote.trim(),
        createdAt: Date.now()
      };
      const updated = [...tasks, newTask];
      saveLocal(updated);
      pushToCloud(updated);
      
      
      setNewObj('');
      setNewPri('B');
      setNewDue('');
      setNewNote('');
      setIsAddOpen(false);
      
      addToast('タスクを追加しました', 'success');
    };

    
    const handleSaveEdit = (e) => {
      if (e) e.preventDefault();
      if (!editTask.task.trim()) {
        addToast('タスク名を入力してください', 'error');
        return;
      }
      const updated = tasks.map(t => t.id === editTask.id ? editTask : t);
      saveLocal(updated);
      pushToCloud(updated);
      setEditTask(null);
      addToast('タスクを更新しました', 'success');
    };

    
    const handleApplyConfig = async () => {
      const cleanedInput = configBlobInput.trim();
      if (cleanedInput !== (blobId || '')) {
        const nextBlobId = cleanedInput || null;
        setBlobId(nextBlobId);
        if (nextBlobId) {
          localStorage.setItem(BLOB_KEY, nextBlobId);
        } else {
          localStorage.removeItem(BLOB_KEY);
        }
        if (window.PWAConfigSync) {
          await window.PWAConfigSync.syncAppBinId('tasklist', nextBlobId);
        }
        setIsConfigOpen(false);
        addToast('設定を保存しました', 'success');
        
        
        setTimeout(() => {
          syncCloud(false, nextBlobId);
        }, 100);
      } else {
        setIsConfigOpen(false);
      }
    };

    
    const handleWipeAll = () => {
      if (confirm('WIPE ALL TASK DATA FROM THIS DEVICE? THIS CANNOT BE UNDONE.')) {
        saveLocal([]);
        pushToCloud([]);
        setIsConfigOpen(false);
        addToast('すべてのタスクを削除しました', 'error');
      }
    };

    
    const handleExport = () => {
      const blob = new Blob([JSON.stringify({ tasks }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tasks_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      addToast('バックアップを書き出しました', 'success');
    };

    
    const handleImport = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          const imported = Array.isArray(data.tasks) ? data.tasks : Array.isArray(data) ? data : [];
          
          if (imported.length === 0) {
            addToast('読み込めるタスクがありません', 'error');
            return;
          }
          
          const sanitized = imported.map((t, idx) => ({
            id: t.id || (Date.now() + idx),
            task: String(t.task || 'Unnamed Objective'),
            priority: t.priority || 'B',
            due: String(t.due || ''),
            done: !!t.done,
            note: String(t.note || ''),
            createdAt: t.createdAt || Date.now()
          }));
          
          const merged = mergeTasks(tasks, sanitized);
          saveLocal(merged);
          pushToCloud(merged);
          addToast(`${sanitized.length}件のタスクを読み込みました`, 'success');
        } catch(err) {
          addToast('ファイル形式を確認してください', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = ''; 
    };

    
    const stats = useMemo(() => {
      const total = tasks.length;
      const completed = tasks.filter(t => t.done).length;
      const pending = total - completed;
      const prioritySCount = tasks.filter(t => !t.done && ((t.priority || 'B') === 'S' || (t.priority || 'B') === 'SS')).length;
      
      
      const soonCount = tasks.filter(t => {
        if (t.done || !t.due) return false;
        const status = getDueStatus(t.due);
        return status.className === 'tl-due-soon' || status.className === 'tl-due-overdue';
      }).length;

      return { total, completed, pending, priorityS: prioritySCount, soon: soonCount };
    }, [tasks]);

    
    const processedTasks = useMemo(() => {
      let result = [...tasks];

      
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        result = result.filter(t => {
          const taskStr = String(t.task || '').toLowerCase();
          const noteStr = String(t.note || '').toLowerCase();
          const dueStr = String(t.due || '').toLowerCase();
          return taskStr.includes(q) || noteStr.includes(q) || dueStr.includes(q);
        });
      }

      
      if (statusFilter === 'active') {
        result = result.filter(t => !t.done);
      } else if (statusFilter === 'completed') {
        result = result.filter(t => t.done);
      }

      
      if (priorityFilter !== 'all') {
        result = result.filter(t => t.priority === priorityFilter);
      }

      
      const priorityMap = { 'S': 0, 'SS': 0, 'A': 1, 'B': 2, 'C': 3 };
      result.sort((a, b) => {
        
        if (a.done !== b.done) return a.done ? 1 : -1;

        if (sortKey === 'priority') {
          const pa = priorityMap[a.priority || 'B'] ?? 4;
          const pb = priorityMap[b.priority || 'B'] ?? 4;
          if (pa !== pb) return pa - pb;
        } else if (sortKey === 'due') {
          
          if (!a.due && b.due) return 1;
          if (a.due && !b.due) return -1;
          if (a.due && b.due) {
            return a.due.localeCompare(b.due);
          }
        }
        
        
        const ca = a.createdAt || a.id;
        const cb = b.createdAt || b.id;
        return cb - ca;
      });

      return result;
    }, [tasks, statusFilter, priorityFilter, searchQuery, sortKey]);

    
    const renderLockDots = () => {
      const items = [];
      for (let i = 0; i < 4; i++) {
        const isFilled = i < pinCode.length;
        const isErr = pinError;
        items.push(html`
          <div key=${i} class="tl-lock-dot ${isFilled ? 'filled' : ''} ${isErr ? 'error' : ''}"></div>
        `);
      }
      return items;
    };

    const hasTaskFilters = statusFilter !== 'all' || priorityFilter !== 'all';
    const localStatusText = localSaveStatus === 'error'
      ? 'Local save failed'
      : 'Saved locally';

    if (!unlocked) {
      
      const pinStatusText = pinStatus === 'error'
        ? 'PINが正しくありません。もう一度入力してください。'
        : pinStatus === 'success'
          ? 'PINを確認しました。タスク管理を開きます。'
          : `4桁のPINを入力してください。${pinCode.length}/4桁入力済み。`;

      return html`
        <div class="tl-lock-wrap" role="dialog" aria-modal="true" aria-labelledby="tl-lock-title" aria-describedby="tl-lock-description">
          <div class="tl-lock-box">
            <div id="tl-lock-title" class="tl-lock-title">タスク管理</div>
            <p id="tl-lock-description" class="tl-lock-description">タスク管理を開くには、4桁のPINを入力してください。</p>
            <label class="tl-lock-input-label" for="tl-pin-input">4桁のPIN</label>
            <input
              ref=${pinInputRef}
              id="tl-pin-input"
              class="tl-lock-input"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              autocomplete="off"
              aria-label="4桁のPIN"
              aria-describedby="tl-pin-status"
              aria-invalid=${pinError ? 'true' : 'false'}
              value=${pinCode}
              placeholder="••••"
              onInput=${handlePinInput}
              onKeyDown=${handlePinKeyDown}
            />
            <div class="tl-lock-status ${pinStatus}" id="tl-pin-status" data-tl-pin-status role="status" aria-live="polite">${pinStatusText}</div>
            <div class="tl-lock-dots" role="group" aria-label=${`PIN入力状況 ${pinCode.length}/4桁`}>
              ${renderLockDots()}
            </div>
            <div class="tl-lock-grid">
              ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => html`
                <button type="button" key=${num} class="tl-lock-key" aria-label=${`${num}を入力`} onClick=${() => handlePinPress(String(num))}>${num}</button>
              `)}
              <button type="button" class="tl-lock-key fn" data-pin-action="clear" aria-label="PINをすべて消去" onClick=${() => handlePinPress('clear')}>消去</button>
              <button type="button" class="tl-lock-key" aria-label="0を入力" onClick=${() => handlePinPress('0')}>0</button>
              <button type="button" class="tl-lock-key fn" data-pin-action="back" aria-label="最後の数字を削除" onClick=${() => handlePinPress('back')}>⌫</button>
            </div>
          </div>
          \x3C!-- Toast notification layer inside lock screen -->
          <div class="tl-toast-container">
            ${toasts.map(t => html`
              <div key=${t.id} class="tl-toast tl-toast-${t.type} ${t.show ? 'show' : ''}">
                ${t.msg}
              </div>
            `)}
          </div>
        </div>
      `;
    }

    
    return html`
      <div class="tl-container">
        \x3C!-- Header -->
        <header class="tl-header tl-nav tl-glass" data-tl-nav>
          <div class="tl-nav-leading">
            <button type="button" class="tl-btn tl-btn-ghost tl-btn-icon tl-nav-icon" data-tl-action="back" aria-label="前の画面に戻る" title="Back" onClick=${() => window.history.back()}>${Icon({ name: 'back' })}</button>
          </div>
          <div class="tl-logo">
            <h1 class="tl-title" data-tl-nav-title>Tasks</h1>
          </div>
          <div class="tl-header-actions">
            <span class="tl-sync-indicator tl-sync-${syncStatus === 'busy' ? 'busy' : syncStatus === 'err' ? 'err' : blobId ? 'ok' : 'local'}" data-tl-sync-state role="status" aria-live="polite">
              <span class="tl-sync-dot" aria-hidden="true"></span>
              <span>${syncStatus === 'busy' ? 'Syncing' : syncStatus === 'err' ? 'Sync error' : blobId ? 'Cloud' : 'Local'}</span>
            </span>
            <button type="button" class="tl-btn tl-btn-ghost tl-btn-icon tl-nav-icon" data-tl-action="sync" aria-label="今すぐ同期" title="Sync" onClick=${() => syncCloud(false)}>${Icon({ name: 'sync' })}</button>
            <button type="button" class="tl-btn tl-btn-ghost tl-btn-icon tl-nav-icon" data-tl-action="settings" aria-label="設定を開く" title="Settings" onClick=${() => { setConfigBlobInput(blobId || ''); setIsConfigOpen(true); }}>${Icon({ name: 'settings' })}</button>
            <button type="button" class="tl-btn tl-btn-default tl-btn-icon tl-add-button" data-tl-action="add" aria-label="タスクを追加" title="Add task" onClick=${() => setIsAddOpen(true)}>${Icon({ name: 'add' })}</button>
          </div>
          <div class="tl-storage-status" role="status" aria-live="polite">
            <span class="tl-storage-local"><span class="tl-status-dot" aria-hidden="true"></span><strong>${localStatusText}</strong></span>
            ${localSaveStatus === 'error' && html`<span class="tl-storage-cloud-error">Device storage is unavailable.</span>`}
            ${syncStatus === 'err'
              ? html`<span class="tl-storage-cloud-error">Cloud sync is unavailable. Local tasks are safe.</span>`
              : syncStatus === 'busy'
                ? html`<span>Syncing cloud. Local edits stay available.</span>`
                : blobId
                  ? html`<span class="tl-storage-cloud-ok">Cloud connected.</span>`
                  : html`<span>Local only. You can keep editing.</span>`}
          </div>
        </header>

        \x3C!-- Stats Dashboard -->
        <div class="tl-stats-grid">
          <div class="tl-stat-card">
            <span class="tl-stat-label">Open</span>
            <span class="tl-stat-value tl-text-foreground">${stats.pending}</span>
          </div>
          <div class="tl-stat-card">
            <span class="tl-stat-label">Priority</span>
            <span class="tl-stat-value tl-text-primary">${stats.priorityS}</span>
          </div>
          <div class="tl-stat-card">
            <span class="tl-stat-label">Due soon</span>
            <span class="tl-stat-value tl-text-warning">${stats.soon}</span>
          </div>
          <div class="tl-stat-card">
            <span class="tl-stat-label">Done</span>
            <span class="tl-stat-value tl-text-success">${stats.completed}</span>
          </div>
        </div>

        \x3C!-- Toolbar controls -->
        <div class="tl-toolbar">
          <div class="tl-tabs-list tl-glass" role="tablist" aria-label="Task status">
            <button type="button" class="tl-tabs-trigger ${statusFilter === 'active' ? 'active' : ''}" role="tab" aria-selected=${statusFilter === 'active' ? 'true' : 'false'} onClick=${() => setStatusFilter('active')}>Open</button>
            <button type="button" class="tl-tabs-trigger ${statusFilter === 'completed' ? 'active' : ''}" role="tab" aria-selected=${statusFilter === 'completed' ? 'true' : 'false'} onClick=${() => setStatusFilter('completed')}>Done</button>
            <button type="button" class="tl-tabs-trigger ${statusFilter === 'all' ? 'active' : ''}" role="tab" aria-selected=${statusFilter === 'all' ? 'true' : 'false'} onClick=${() => setStatusFilter('all')}>All</button>
          </div>

          <div class="tl-toolbar-right tl-glass">
            \x3C!-- Search -->
            <div class="tl-search-wrap">
              <span class="tl-search-icon" aria-hidden="true">${Icon({ name: 'search' })}</span>
              <input 
                ref=${searchInputRef}
                type="text" 
                class="tl-input tl-search-input" 
                aria-label="タスクを検索"
                placeholder="Search tasks · /"
                value=${searchQuery} 
                onChange=${e => setSearchQuery(e.target.value)}
              />
            </div>

            \x3C!-- Priority filter -->
            <select class="tl-select tl-w-100" aria-label="Priority filter" value=${priorityFilter} onChange=${e => setPriorityFilter(e.target.value)}>
              <option value="all">All</option>
              <option value="S">S</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
            </select>

            \x3C!-- Sorting -->
            <select class="tl-select tl-w-110" aria-label="Sort tasks" value=${sortKey} onChange=${e => setSortKey(e.target.value)}>
              <option value="priority">Priority</option>
              <option value="due">Due</option>
              <option value="created">Created</option>
            </select>
          </div>
        </div>

        \x3C!-- Task List Items -->
        <div class="tl-list-container tl-mt-4">
          ${processedTasks.length === 0 ? html`
            <div class="tl-empty">
              <div class="tl-empty-icon" aria-hidden="true">○</div>
              <div class="tl-text-sm">No tasks found</div>
              <div class="tl-text-xs tl-text-muted tl-empty-description">
                ${tasks.length === 0
                  ? 'Start with a new task or load your starter list.'
                  : 'Try clearing a filter or search term.'}
              </div>
              <div class="tl-empty-actions">
                <button type="button" class="tl-btn tl-btn-default" aria-label="タスクを追加" onClick=${() => setIsAddOpen(true)}>${Icon({ name: 'add' })}<span>Add task</span></button>
                ${tasks.length > 0 && hasTaskFilters && html`
                  <button type="button" class="tl-btn tl-btn-outline" onClick=${clearListFilters}>Clear filters</button>
                `}
                ${searchQuery && html`
                  <button type="button" class="tl-btn tl-btn-outline" onClick=${() => setSearchQuery('')}>Clear search</button>
                `}
                ${tasks.length === 0 && Array.isArray(INITIAL_YAML) && INITIAL_YAML.length > 0 && html`
                  <button type="button" class="tl-btn tl-btn-outline" onClick=${loadInitialTasks}>Load starter tasks</button>
                `}
              </div>
            </div>
          ` : processedTasks.map(t => {
            const dueStatus = getDueStatus(t.due);
            return html`
              <div key=${t.id} class="tl-item tl-card-content tl-item-${(t.priority || 'B').toLowerCase()} ${t.done ? 'completed' : ''} tl-mb-2">
                \x3C!-- Checked toggle -->
                <button
                  type="button"
                  class="tl-check ${t.done ? 'checked' : ''}"
                  role="checkbox"
                  aria-checked=${t.done ? 'true' : 'false'}
                  aria-label=${`タスク「${t.task}」を${t.done ? '未完了に戻す' : '完了にする'}`}
                  onClick=${() => toggleTask(t.id)}
                >
                  ${Icon({ name: 'check' })}
                </button>
                
                <div class="tl-item-info">
                  <div class="tl-item-header">
                    <span class="tl-item-name">${t.task}</span>
                    <span class="tl-badge tl-badge-${(t.priority || 'B').toLowerCase()}">Priority ${t.priority || 'B'}</span>
                  </div>

                  ${t.due && html`
                    <div class="tl-item-due ${dueStatus.className}">
                      ${dueStatus.label}
                    </div>
                  `}

                  ${t.note && html`
                    <div class="tl-item-memo">${t.note}</div>
                  `}
                </div>

                <div class="tl-item-actions">
                  <button type="button" class="tl-btn tl-btn-ghost tl-btn-icon sm" aria-label=${`タスク「${t.task}」を編集`} onClick=${() => setEditTask({ ...t })} title="Edit task">${Icon({ name: 'edit' })}</button>
                  <button type="button" class="tl-btn tl-btn-ghost tl-btn-icon sm tl-delete-action" aria-label=${`タスク「${t.task}」を削除`} onClick=${() => requestDeleteTask(t)} title="Delete Task">${Icon({ name: 'trash' })}</button>
                </div>
              </div>
            `;
          })}
        </div>

        \x3C!-- ADD TASK DIALOG (DEPLOY OVERLAY) -->
        <div class="tl-overlay ${isAddOpen ? 'open' : ''}">
          <div class="tl-dialog">
            <button type="button" class="tl-dialog-close" aria-label="タスク追加ダイアログを閉じる" onClick=${() => setIsAddOpen(false)}>${Icon({ name: 'close' })}</button>
            <div class="tl-dialog-header">
              <h2 class="tl-dialog-title">Add task</h2>
              <p class="tl-dialog-description">Capture something you want to do later.</p>
            </div>
            
            <form onSubmit=${handleCreateTask}>
              <div class="tl-dialog-body">
                <div class="cn-field tl-mb-4">
                  <label class="tl-label">Title</label>
                  <input 
                    type="text" 
                    className="tl-input" 
                    placeholder="e.g. Submit the report"
                    required 
                    value=${newObj} 
                    onChange=${e => setNewObj(e.target.value)}
                  />
                </div>

                <div class="tl-field-row tl-mb-4">
                  <div>
                    <label class="tl-label">Due (optional)</label>
                    <input 
                      type="text" 
                      className="tl-input" 
                      placeholder="e.g. 12月31日" 
                      value=${newDue} 
                      onChange=${e => setNewDue(e.target.value)}
                    />
                  </div>
                  <div>
                    <label class="tl-label">Priority</label>
                    <select className="tl-select" value=${newPri} onChange=${e => setNewPri(e.target.value)}>
                      <option value="S">S · Highest</option>
                      <option value="A">A · High</option>
                      <option value="B">B · Normal</option>
                      <option value="C">C · Low</option>
                    </select>
                  </div>
                </div>

                <div class="cn-field">
                  <label class="tl-label">Note (optional)</label>
                  <textarea 
                    className="tl-textarea" 
                    placeholder="Add context or steps"
                    value=${newNote} 
                    onChange=${e => setNewNote(e.target.value)}
                  />
                </div>
              </div>
              
              <div class="tl-dialog-footer">
                <button type="button" class="tl-btn tl-btn-outline" onClick=${() => setIsAddOpen(false)}>Cancel</button>
                <button type="submit" class="tl-btn tl-btn-default">Add task</button>
              </div>
            </form>
          </div>
        </div>

        \x3C!-- EDIT TASK DIALOG -->
        <div class="tl-overlay ${editTask ? 'open' : ''}">
          ${editTask && html`
            <div class="tl-dialog">
              <button type="button" class="tl-dialog-close" aria-label="タスク編集ダイアログを閉じる" onClick=${() => setEditTask(null)}>${Icon({ name: 'close' })}</button>
              <div class="tl-dialog-header">
                <h2 class="tl-dialog-title">Edit task</h2>
                <p class="tl-dialog-description">Update the task details.</p>
              </div>
              
              <form onSubmit=${handleSaveEdit}>
                <div class="tl-dialog-body">
                  <div class="cn-field tl-mb-4">
                    <label class="tl-label">Title</label>
                    <input 
                      type="text" 
                      className="tl-input" 
                      required 
                      value=${editTask.task} 
                      onChange=${e => setEditTask({ ...editTask, task: e.target.value })}
                    />
                  </div>

                  <div class="tl-field-row tl-mb-4">
                    <div>
                    <label class="tl-label">Due (optional)</label>
                      <input 
                        type="text" 
                        className="tl-input" 
                        value=${editTask.due} 
                        onChange=${e => setEditTask({ ...editTask, due: e.target.value })}
                      />
                    </div>
                    <div>
                    <label class="tl-label">Priority</label>
                      <select className="tl-select" value=${editTask.priority} onChange=${e => setEditTask({ ...editTask, priority: e.target.value })}>
                        <option value="S">S · Highest</option>
                        <option value="A">A · High</option>
                        <option value="B">B · Normal</option>
                        <option value="C">C · Low</option>
                      </select>
                    </div>
                  </div>

                  <div class="cn-field">
                    <label class="tl-label">Note (optional)</label>
                    <textarea 
                      className="tl-textarea" 
                      value=${editTask.note} 
                      onChange=${e => setEditTask({ ...editTask, note: e.target.value })}
                    />
                  </div>
                </div>
                
                <div class="tl-dialog-footer">
                  <button type="button" class="tl-btn tl-btn-outline" onClick=${() => setEditTask(null)}>Cancel</button>
                  <button type="submit" class="tl-btn tl-btn-default">Save</button>
                </div>
              </form>
            </div>
          `}
        </div>

        \x3C!-- CONFIG / SETTINGS DIALOG -->
        <div class="tl-overlay ${isConfigOpen ? 'open' : ''}">
          <div class="tl-dialog">
            <button type="button" class="tl-dialog-close" aria-label="設定ダイアログを閉じる" onClick=${() => setIsConfigOpen(false)}>${Icon({ name: 'close' })}</button>
            <div class="tl-dialog-header">
              <h2 class="tl-dialog-title">Settings</h2>
              <p class="tl-dialog-description">Sync and backups.</p>
            </div>

            <div class="tl-dialog-body">
              \x3C!-- Sync Segment -->
              <h3 class="tl-font-semibold tl-text-sm tl-mb-1">Cloud sync</h3>
              <p class="tl-text-xs tl-text-muted tl-mb-3">
                Share tasks across devices. Local tasks remain available if cloud sync is offline.
              </p>
              
              <div class="tl-label tl-fs-sm">Current sync ID</div>
              <div class="tl-mono tl-text-xs tl-config-blob">
                ${blobId || 'Local only · cloud not connected'}
              </div>

              <div class="cn-field tl-mb-6">
                <label class="tl-label">Paste an existing sync ID</label>
                <input 
                  type="text" 
                  className="tl-input" 
                  placeholder="Paste sync ID"
                  value=${configBlobInput}
                  onChange=${e => setConfigBlobInput(e.target.value)}
                />
              </div>

              <div class="tl-separator"></div>

              \x3C!-- Data Management -->
              <h3 class="tl-font-semibold tl-text-sm tl-mb-3">Backup</h3>
              <div class="tl-flex-wrap-gap">
                <button class="tl-btn tl-btn-outline" onClick=${handleExport}>Export</button>
                <label class="tl-btn tl-btn-outline" style=${ { cursor: 'pointer' } }>
                  Import
                  <input type="file" accept=".json" style=${ { display: 'none' } } onChange=${handleImport} />
                </label>
              </div>

              <div class="tl-separator"></div>

              \x3C!-- Destructive wipe -->
              <h3 class="tl-font-semibold tl-text-sm tl-danger-title">Delete all tasks</h3>
              <p class="tl-text-xs tl-text-muted tl-mb-3">
                Remove every task saved on this device.
              </p>
              <button class="tl-btn tl-btn-danger" onClick=${handleWipeAll}>Delete all</button>
            </div>

            <div class="tl-dialog-footer">
              <button class="tl-btn tl-btn-outline" onClick=${() => setIsConfigOpen(false)}>Cancel</button>
              <button class="tl-btn tl-btn-default" onClick=${handleApplyConfig}>Save</button>
            </div>
          </div>
        </div>

        \x3C!-- DELETE CONFIRMATION -->
        ${pendingDeleteTask && html`
          <div class="tl-overlay open tl-delete-overlay" onClick=${event => event.target === event.currentTarget && cancelDeleteTask()}>
            <div class="tl-dialog tl-confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="tl-delete-title" aria-describedby="tl-delete-description">
              <div class="tl-dialog-header">
                <span class="tl-dialog-symbol" aria-hidden="true">!</span>
                <h2 class="tl-dialog-title" id="tl-delete-title">Delete task?</h2>
                <p class="tl-dialog-description" id="tl-delete-description">Remove “${pendingDeleteTask.task}” from this device. This can’t be undone.</p>
              </div>
              <div class="tl-dialog-footer">
                <button type="button" class="tl-btn tl-btn-outline" data-tl-delete-cancel ref=${deleteCancelRef} onClick=${cancelDeleteTask}>Cancel</button>
                <button type="button" class="tl-btn tl-btn-danger" data-tl-delete-confirm onClick=${confirmDeleteTask}>Delete</button>
              </div>
            </div>
          </div>
        `}

        \x3C!-- Toast Notification Layer -->
        <div class="tl-toast-container">
          ${toasts.map(t => html`
            <div key=${t.id} class="tl-toast tl-toast-${t.type} ${t.show ? 'show' : ''}">
              ${t.type === 'success' ? '◉' : t.type === 'error' ? '✕' : 'ℹ'} ${t.msg}
            </div>
          `)}
        </div>
      </div>
    `;
  }

  
  const container = document.getElementById('tl-app-mount');
  const root = ReactDOM.createRoot(container);
  root.render(React.createElement(App));
})();
</script>


    </section>
