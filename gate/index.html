<!DOCTYPE html>
<html lang="ja-JP">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060A08">
  <title>GATE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600&display=swap">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #060A08; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body>
  <style>
  :root {
    --gate-bg: #060A08;
    --gate-panel: #0A110D;
    --gate-panel-deep: #050907;
    --gate-input-bg: #030604;
    --gate-key-bg: #0D1712;
    --gate-fg: #E4F2E9;
    --gate-sub: #88A394;
    --gate-muted: #5C7366;
    --gate-accent: #00FF66;
    --gate-accent-core: #E4FFF0;
    --gate-error: #FF5A67;
    --gate-error-core: #FFE6E8;

    --gate-border: rgba(136, 163, 148, 0.22);
    --gate-border-strong: rgba(136, 163, 148, 0.36);
    --gate-grid: rgba(0, 255, 102, 0.032);
    --gate-scanline: rgba(0, 0, 0, 0.18);
    --gate-accent-soft: rgba(0, 255, 102, 0.14);
    --gate-accent-dim: rgba(0, 255, 102, 0.44);
    --gate-accent-halo: rgba(0, 255, 102, 0.26);
    --gate-error-soft: rgba(255, 90, 103, 0.14);
    --gate-error-halo: rgba(255, 90, 103, 0.28);

    --font-display: "Orbitron", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
    --font-mono: "JetBrains Mono", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", monospace;

    --ease-snap: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-sweep: cubic-bezier(0.42, 0, 0.58, 1);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    color-scheme: dark;
    background-color: var(--gate-bg);
    overflow-x: clip;
  }

  body {
    margin: 0;
    min-height: 100svh;
    min-height: 100dvh;
    background-color: var(--gate-bg);
    color: var(--gate-fg);
    font-family: var(--font-mono);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }

   
  .gate-shell {
    position: relative;
    min-height: 100svh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    background-color: var(--gate-bg);
    background-image:
      repeating-linear-gradient(
        180deg,
        transparent 0 2px,
        var(--gate-scanline) 2px 3px
      ),
      linear-gradient(to right, var(--gate-grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--gate-grid) 1px, transparent 1px);
    background-size: auto, 32px 32px, 32px 32px;
    background-position: 0 0, center center, center center;
    isolation: isolate;
  }

   
  .gate-vf {
    pointer-events: none;
    position: fixed;
    width: 14px;
    height: 14px;
    border-color: var(--gate-border-strong);
    border-style: solid;
    border-width: 0;
    z-index: 1;
  }
  .gate-vf--tl {
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    border-top-width: 1px;
    border-left-width: 1px;
  }
  .gate-vf--tr {
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    border-top-width: 1px;
    border-right-width: 1px;
  }
  .gate-vf--bl {
    bottom: max(10px, env(safe-area-inset-bottom));
    left: max(10px, env(safe-area-inset-left));
    border-bottom-width: 1px;
    border-left-width: 1px;
  }
  .gate-vf--br {
    bottom: max(10px, env(safe-area-inset-bottom));
    right: max(10px, env(safe-area-inset-right));
    border-bottom-width: 1px;
    border-right-width: 1px;
  }

   
  .gate-topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 960px;
    margin-inline: auto;
  }

  .gate-return {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 14px 0 12px;
    color: var(--gate-sub);
    background-color: var(--gate-panel-deep);
    border: 1px solid var(--gate-border);
    border-left: 2px solid var(--gate-accent-dim);
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-decoration: none;
    touch-action: manipulation;
    transition:
      color 140ms var(--ease-snap),
      border-color 140ms var(--ease-snap),
      background-color 140ms var(--ease-snap),
      transform 120ms var(--ease-snap);
  }

  .gate-return-arrow {
    color: var(--gate-accent);
    font-size: 14px;
    line-height: 1;
    transition: transform 140ms var(--ease-snap);
  }

  @media (hover: hover) {
    .gate-return:hover {
      color: var(--gate-fg);
      border-color: var(--gate-accent);
      background-color: var(--gate-accent-soft);
    }
    .gate-return:hover .gate-return-arrow {
      transform: translateX(-2px);
    }
  }

  .gate-return:active {
    transform: scale(0.96);
  }

  .gate-return:focus-visible {
    outline: 2px solid var(--gate-accent);
    outline-offset: 2px;
    color: var(--gate-fg);
    border-color: var(--gate-accent);
  }

  .gate-top-meta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--gate-muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  .gate-top-divider {
    width: 1px;
    height: 10px;
    background-color: var(--gate-border-strong);
  }

  .gate-top-state {
    color: var(--gate-sub);
  }

   
  .gate-stage {
    position: relative;
    z-index: 2;
    display: grid;
    place-items: center;
    padding-block: 24px;
  }

  .gate-terminal {
    position: relative;
    width: 100%;
    max-width: 472px;
    background-color: var(--gate-panel);
    border: 1px solid var(--gate-border);
    border-radius: 2px;
    box-shadow:
      inset 0 1px 0 rgba(228, 242, 233, 0.06),
      0 20px 44px rgba(0, 0, 0, 0.62);
    transition: border-color 160ms var(--ease-snap);
  }

   
  .gate-filament {
    pointer-events: none;
    position: absolute;
    top: -1px;
    left: 16px;
    width: 104px;
    height: 2px;
    background-color: var(--gate-accent-core);
    box-shadow:
      0 0 4px var(--gate-accent),
      0 0 12px var(--gate-accent-halo);
    opacity: 0.82;
    transition:
      opacity 160ms var(--ease-snap),
      background-color 160ms var(--ease-snap),
      box-shadow 160ms var(--ease-snap);
  }

   
  .gate-lock {
    pointer-events: none;
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--gate-accent-dim);
    border-style: solid;
    border-width: 0;
    transition: border-color 160ms var(--ease-snap);
  }
  .gate-lock--tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .gate-lock--tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
  .gate-lock--bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
  .gate-lock--br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

   
  .gate-head {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 20px 16px 22px;
    border-bottom: 1px solid var(--gate-border);
  }

   
  .gate-head::before {
    content: "";
    position: absolute;
    top: 18px;
    bottom: 16px;
    left: 0;
    width: 3px;
    background-color: var(--gate-accent);
    box-shadow:
      inset 0 0 1px var(--gate-accent-core),
      0 0 8px var(--gate-accent-halo);
    transition: background-color 160ms var(--ease-snap), box-shadow 160ms var(--ease-snap);
  }

  .gate-eyebrow {
    margin: 0 0 4px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.16em;
    color: var(--gate-sub);
  }

  .gate-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.2rem, 4.4vw, 1.45rem);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.14em;
    color: var(--gate-fg);
    text-shadow: 0 0 10px rgba(0, 255, 102, 0.16);
    overflow-wrap: break-word;
  }

  .gate-led-cluster {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    background-color: var(--gate-panel-deep);
    border: 1px solid var(--gate-border);
    border-radius: 2px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--gate-sub);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
    user-select: none;
  }

  .gate-led {
    width: 6px;
    height: 6px;
    border-radius: 1px;
    background-color: var(--gate-accent);
    box-shadow:
      inset 0 0 2px var(--gate-accent-core),
      0 0 6px var(--gate-accent);
    transition: background-color 160ms var(--ease-snap), box-shadow 160ms var(--ease-snap);
  }

   
  .gate-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 20px;
    background-color: var(--gate-panel-deep);
    border-bottom: 1px solid var(--gate-border);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--gate-muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  .gate-strip-val {
    color: var(--gate-sub);
  }

   
  .gate-ticks {
    width: 48px;
    height: 8px;
    background-image: repeating-linear-gradient(
      to right,
      var(--gate-border-strong) 0 1px,
      transparent 1px 6px
    );
    opacity: 0.7;
    flex-shrink: 0;
  }

   
  #gate-form {
    padding: 24px 20px 20px;
  }

  .gate-label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .gate-label {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--gate-sub);
    transition: color 140ms var(--ease-snap);
  }

  .gate-label-hint {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--gate-muted);
    user-select: none;
  }

   
  #gate-row {
    position: relative;
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) 44px 52px;
    align-items: stretch;
    height: 52px;
    background-color: var(--gate-input-bg);
    border: 1px solid var(--gate-border-strong);
    border-radius: 2px;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
    transition:
      border-color 140ms var(--ease-snap),
      box-shadow 140ms var(--ease-snap);
  }

   
  #gate-row:focus-within {
    border-color: var(--gate-accent);
    box-shadow:
      inset 0 0 0 1px rgba(228, 255, 240, 0.35),
      inset 0 2px 8px rgba(0, 0, 0, 0.78),
      0 0 12px var(--gate-accent-halo);
  }

  #gate-form:has(#gate-row:focus-within) .gate-label {
    color: var(--gate-accent);
  }

  .gate-prompt {
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 600;
    color: var(--gate-accent);
    user-select: none;
    text-shadow: 0 0 6px var(--gate-accent-halo);
    transition: color 140ms var(--ease-snap), opacity 140ms var(--ease-snap);
  }

  @media (prefers-reduced-motion: no-preference) {
    #gate-row:not(:focus-within):not(.is-error):not(.is-ok) .gate-prompt {
      animation: gate-prompt-idle 1.8s var(--ease-sweep) infinite;
    }
  }

  #gate-row:focus-within .gate-prompt {
    color: var(--gate-accent-core);
    opacity: 1;
  }

  #gate-input {
    min-width: 0;
    width: 100%;
    height: 100%;
    padding: 0 8px 0 0;
    margin: 0;
    border: 0;
    background: transparent;
    color: var(--gate-fg);
    font-family: var(--font-mono);
    font-size: max(1rem, 16px);
    font-weight: 400;
    letter-spacing: 0.04em;
    caret-color: var(--gate-accent);
    appearance: none;
    outline: none;
  }

  #gate-input::placeholder {
    color: var(--gate-muted);
    letter-spacing: 0.06em;
    opacity: 1;
  }

  #gate-input::selection {
    background-color: var(--gate-accent-soft);
    color: var(--gate-fg);
  }

  #gate-row.is-error #gate-input::selection {
    background-color: var(--gate-error-soft);
    color: var(--gate-error-core);
  }

  #gate-input:-webkit-autofill,
  #gate-input:-webkit-autofill:hover,
  #gate-input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--gate-fg);
    box-shadow: 0 0 0 1000px var(--gate-input-bg) inset;
    transition: background-color 9999s ease-out;
  }

  #gate-row:has(#gate-input:focus-visible) {
    outline: 2px solid var(--gate-accent);
    outline-offset: 2px;
  }

   
  #gate-toggle {
    display: grid;
    place-items: center;
    width: 44px;
    height: 100%;
    padding: 0;
    margin: 0;
    border: 0;
    background: transparent;
    color: var(--gate-sub);
    cursor: pointer;
    touch-action: manipulation;
    transition:
      color 140ms var(--ease-snap),
      background-color 140ms var(--ease-snap),
      transform 100ms var(--ease-snap);
  }

  #gate-toggle svg {
    width: 18px;
    height: 18px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #gate-toggle .icon-eye-off {
    display: none;
  }

  #gate-toggle[aria-pressed="true"] {
    color: var(--gate-accent);
  }

  #gate-toggle[aria-pressed="true"] .icon-eye {
    display: none;
  }

  #gate-toggle[aria-pressed="true"] .icon-eye-off {
    display: block;
  }

  @media (hover: hover) {
    #gate-toggle:hover {
      color: var(--gate-fg);
      background-color: rgba(228, 242, 233, 0.05);
    }
  }

  #gate-toggle:active {
    transform: scale(0.96);
  }

  #gate-toggle:focus-visible {
    outline: 2px solid var(--gate-accent);
    outline-offset: -3px;
    border-radius: 1px;
  }

   
  .gate-enter {
    display: grid;
    place-items: center;
    width: 52px;
    height: 100%;
    padding: 0;
    margin: 0;
    border: 0;
    border-left: 1px solid var(--gate-border);
    border-radius: 0 1px 1px 0;
    background-color: var(--gate-key-bg);
    color: var(--gate-accent);
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: inset 0 1px 0 rgba(228, 242, 233, 0.08);
    transition:
      color 140ms var(--ease-snap),
      background-color 140ms var(--ease-snap),
      border-color 140ms var(--ease-snap),
      transform 100ms var(--ease-snap);
  }

  @media (hover: hover) {
    .gate-enter:hover:not(:disabled) {
      background-color: var(--gate-accent-soft);
      color: var(--gate-accent-core);
      text-shadow: 0 0 8px var(--gate-accent);
    }
  }

  .gate-enter:active:not(:disabled) {
    transform: scale(0.96);
  }

  .gate-enter:focus-visible {
    outline: 2px solid var(--gate-accent);
    outline-offset: -3px;
  }

  .gate-enter:disabled,
  #gate-toggle:disabled {
    cursor: default;
    opacity: 0.6;
  }

   
  .gate-sweep {
    position: relative;
    height: 3px;
    margin-top: 6px;
    background-color: rgba(136, 163, 148, 0.14);
    border-radius: 1px;
    overflow: hidden;
  }

  .gate-sweep-beam {
    position: absolute;
    inset-block: 0;
    left: 0;
    width: 42%;
    background-image: linear-gradient(
      90deg,
      transparent 0%,
      var(--gate-accent) 32%,
      var(--gate-accent-core) 50%,
      var(--gate-accent) 68%,
      transparent 100%
    );
    opacity: 0;
    transform: translateX(-100%);
    transition: opacity 140ms var(--ease-snap);
  }

   
  #gate-status {
    min-height: 22px;
    margin: 12px 0 0;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--gate-sub);
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }

  #gate-status:not(:empty):not(.is-error) {
    color: var(--gate-accent);
    text-shadow: 0 0 8px var(--gate-accent-halo);
  }

  #gate-status:not(:empty):not(.is-error)::before {
    content: "// ";
    color: var(--gate-sub);
    text-shadow: none;
  }

  #gate-status.is-error {
    color: var(--gate-error);
    text-shadow: 0 0 8px var(--gate-error-halo);
  }

  #gate-status.is-error::before {
    content: "[!] ";
    color: var(--gate-error);
  }

   
  #gate-form:is([aria-busy="true"], .is-busy, .is-verifying, .is-loading) .gate-sweep-beam,
  #gate-form:has(#gate-input:disabled, .gate-enter:disabled) .gate-sweep-beam,
  #gate-form:has(#gate-row:is(.is-busy, .is-verifying, .is-loading)) .gate-sweep-beam,
  #gate-form:has(#gate-status:not(:empty):not(.is-error)):not(:has(#gate-row.is-ok, #gate-row.is-error)) .gate-sweep-beam {
    opacity: 1;
    animation: gate-sweep-scan 1.05s var(--ease-sweep) infinite alternate;
  }

  @media (prefers-reduced-motion: reduce) {
    #gate-form:is([aria-busy="true"], .is-busy, .is-verifying, .is-loading) .gate-sweep-beam,
    #gate-form:has(#gate-input:disabled, .gate-enter:disabled) .gate-sweep-beam,
    #gate-form:has(#gate-row:is(.is-busy, .is-verifying, .is-loading)) .gate-sweep-beam,
    #gate-form:has(#gate-status:not(:empty):not(.is-error)):not(:has(#gate-row.is-ok, #gate-row.is-error)) .gate-sweep-beam {
      animation-duration: 3.6s;
    }
  }

  #gate-form:has(#gate-status:not(:empty):not(.is-error)):not(:has(#gate-row.is-ok, #gate-row.is-error)) #gate-row,
  #gate-form:has(#gate-input:disabled, .gate-enter:disabled) #gate-row {
    border-color: var(--gate-accent);
    box-shadow:
      inset 0 0 0 1px rgba(0, 255, 102, 0.24),
      inset 0 2px 6px rgba(0, 0, 0, 0.78),
      0 0 10px var(--gate-accent-halo);
  }

   
  #gate-row.is-error {
    border-color: var(--gate-error);
    box-shadow:
      inset 0 0 0 1px rgba(255, 230, 232, 0.3),
      inset 0 2px 8px rgba(0, 0, 0, 0.8),
      0 0 12px var(--gate-error-halo);
  }

  #gate-row.is-error:has(#gate-input:focus-visible) {
    outline-color: var(--gate-error);
  }

  #gate-row.is-error .gate-prompt {
    color: var(--gate-error);
    text-shadow: 0 0 6px var(--gate-error-halo);
    opacity: 1;
  }

  #gate-row.is-error .gate-enter {
    color: var(--gate-error);
    border-left-color: rgba(255, 90, 103, 0.4);
  }

  #gate-form:has(#gate-row.is-error) .gate-sweep {
    background-color: rgba(255, 90, 103, 0.42);
  }

  .gate-terminal:has(#gate-row.is-error) {
    border-color: rgba(255, 90, 103, 0.45);
  }

  .gate-terminal:has(#gate-row.is-error) .gate-lock {
    border-color: var(--gate-error);
  }

  .gate-terminal:has(#gate-row.is-error) .gate-filament,
  .gate-terminal:has(#gate-row.is-error) .gate-head::before,
  .gate-terminal:has(#gate-row.is-error) .gate-led {
    background-color: var(--gate-error);
    box-shadow:
      inset 0 0 2px var(--gate-error-core),
      0 0 10px var(--gate-error-halo);
  }

  .gate-shell:has(#gate-row.is-error) .gate-top-state {
    color: var(--gate-error);
  }

  @media (prefers-reduced-motion: no-preference) {
    #gate-row.shake {
      animation: gate-reject-shake 320ms var(--ease-snap) 1;
    }
  }

   
  #gate-row.is-ok {
    border-color: var(--gate-accent);
    box-shadow:
      inset 0 0 0 1px var(--gate-accent-core),
      0 0 14px var(--gate-accent-halo);
  }

  #gate-row.is-ok .gate-prompt {
    color: var(--gate-accent-core);
    opacity: 1;
  }

  #gate-row.is-ok .gate-enter {
    background-color: var(--gate-accent);
    border-left-color: var(--gate-accent);
    color: var(--gate-input-bg);
    text-shadow: none;
  }

  #gate-form:has(#gate-row.is-ok) .gate-sweep {
    background-color: var(--gate-accent);
    box-shadow: 0 0 8px var(--gate-accent-halo);
  }

  #gate-form:has(#gate-row.is-ok) #gate-status:not(:empty)::before {
    content: "[OK] ";
    color: var(--gate-accent);
  }

  .gate-terminal:has(#gate-row.is-ok) {
    border-color: var(--gate-accent);
  }

  .gate-terminal:has(#gate-row.is-ok) .gate-lock {
    border-color: var(--gate-accent);
  }

  .gate-terminal:has(#gate-row.is-ok) .gate-filament {
    opacity: 1;
    box-shadow:
      0 0 6px var(--gate-accent),
      0 0 14px var(--gate-accent-halo);
  }

  .gate-shell:has(#gate-row.is-ok) .gate-top-state {
    color: var(--gate-accent);
  }

   
  .gate-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 20px;
    background-color: var(--gate-panel-deep);
    border-top: 1px solid var(--gate-border);
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--gate-muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

   
  .gate-bottombar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 960px;
    margin-inline: auto;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--gate-muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

   
  @keyframes gate-prompt-idle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.42; }
  }

  @keyframes gate-sweep-scan {
    from { transform: translateX(-20%); }
    to { transform: translateX(160%); }
  }

  @keyframes gate-reject-shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    45% { transform: translateX(5px); }
    70% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }

   
  @media (max-width: 480px) {
    .gate-vf {
      display: none;
    }
    .gate-head {
      padding: 18px 16px 14px 18px;
    }
    .gate-strip,
    .gate-foot {
      padding-inline: 16px;
    }
    #gate-form {
      padding: 20px 16px 18px;
    }
    .gate-ticks {
      display: none;
    }
    .gate-top-meta {
      font-size: 10px;
      gap: 8px;
    }
  }

  @media (max-height: 540px) {
    .gate-bottombar {
      display: none;
    }
    .gate-stage {
      padding-block: 12px;
    }
  }

   
  @media (forced-colors: active) {
    .gate-shell {
      background-image: none;
    }
    .gate-terminal,
    #gate-row,
    .gate-return,
    .gate-led-cluster {
      border-color: CanvasText;
      box-shadow: none;
    }
    .gate-filament,
    .gate-head::before,
    .gate-led {
      background-color: Highlight;
      box-shadow: none;
    }
    .gate-sweep {
      border: 1px solid CanvasText;
    }
    .gate-sweep-beam {
      forced-color-adjust: none;
      background-image: none;
      background-color: Highlight;
    }
    #gate-row:focus-within,
    .gate-return:focus-visible,
    #gate-toggle:focus-visible,
    .gate-enter:focus-visible {
      outline: 2px solid Highlight;
    }
  }
</style>

<div class="gate-shell">
  <span class="gate-vf gate-vf--tl" aria-hidden="true"></span>
  <span class="gate-vf gate-vf--tr" aria-hidden="true"></span>
  <span class="gate-vf gate-vf--bl" aria-hidden="true"></span>
  <span class="gate-vf gate-vf--br" aria-hidden="true"></span>

  <header class="gate-topbar">
    <a class="gate-return" href="/">
      <span class="gate-return-arrow" aria-hidden="true">←</span>
      <span>RETURN</span>
    </a>
    <div class="gate-top-meta" aria-hidden="true" translate="no">
      <span>GATE // AUTH</span>
      <span class="gate-top-divider"></span>
      <span class="gate-top-state">LOCKED</span>
    </div>
  </header>

  <main class="gate-stage">
    <section class="gate-terminal" aria-labelledby="gate-heading">
      <span class="gate-filament" aria-hidden="true"></span>
      <span class="gate-lock gate-lock--tl" aria-hidden="true"></span>
      <span class="gate-lock gate-lock--tr" aria-hidden="true"></span>
      <span class="gate-lock gate-lock--bl" aria-hidden="true"></span>
      <span class="gate-lock gate-lock--br" aria-hidden="true"></span>

      <div class="gate-head">
        <div>
          <p class="gate-eyebrow" aria-hidden="true" translate="no">CHECKPOINT // TERMINAL</p>
          <h1 id="gate-heading" class="gate-title" translate="no">ACCESS GATE</h1>
        </div>
        <div class="gate-led-cluster" aria-hidden="true" translate="no">
          <span class="gate-led"></span>
          <span>SEC-00</span>
        </div>
      </div>

      <div class="gate-strip" aria-hidden="true" translate="no">
        <span>KDF <strong class="gate-strip-val">PBKDF2</strong></span>
        <span class="gate-ticks"></span>
        <span>REG <strong class="gate-strip-val">0x7F:0A</strong></span>
      </div>

      <form id="gate-form" novalidate>
        <div class="gate-label-row">
          <label for="gate-input" class="gate-label" translate="no">PASSPHRASE</label>
          <span class="gate-label-hint" aria-hidden="true" translate="no">KEY_VERIFY</span>
        </div>

        <div id="gate-row">
          <span class="gate-prompt" aria-hidden="true">&gt;</span>
          <input
            id="gate-input"
            name="passphrase"
            type="password"
            autocomplete="current-password"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            placeholder="enter passphrase…"
            aria-describedby="gate-status"
          >
          <button
            id="gate-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Show passphrase"
          >
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.2 12s3.6-6.5 9.8-6.5S21.8 12 21.8 12s-3.6 6.5-9.8 6.5S2.2 12 2.2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.6 5.7A10.6 10.6 0 0 1 12 5.5c6.2 0 9.8 6.5 9.8 6.5a17.8 17.8 0 0 1-3.1 4" />
              <path d="M14.1 14.1a3 3 0 0 1-4.2-4.2" />
              <path d="M6.4 6.4A17.7 17.7 0 0 0 2.2 12s3.6 6.5 9.8 6.5c1.5 0 2.9-.3 4.2-.9" />
              <path d="M3 3l18 18" />
            </svg>
          </button>
          <button class="gate-enter" type="submit" aria-label="Submit passphrase">↵</button>
        </div>

        <div class="gate-sweep" aria-hidden="true">
          <span class="gate-sweep-beam"></span>
        </div>

        <p id="gate-status" aria-live="polite" role="status"></p>
      </form>

      <div class="gate-foot" aria-hidden="true" translate="no">
        <span>AUTH_LOCK // ACTIVE</span>
        <span>CHASSIS REV.04</span>
      </div>
    </section>
  </main>

  <footer class="gate-bottombar" aria-hidden="true" translate="no">
    <span>TERM // STANDALONE</span>
    <span>MEM_GUARD: ON</span>
  </footer>
</div>

<script>
(() => {
  const AREAS = {
    A: { sessionKey: 'dtw-private-passphrase-v2-a', target: '/0723/' },
    B: { sessionKey: 'dtw-private-passphrase-v2-b', target: '/project-x/' },
    C: { sessionKey: 'dtw-private-passphrase-v2-c', target: '/0723/private-shelf/' },
    D: { sessionKey: 'dtw-private-passphrase-v2-d', target: '/0723/diary/' },
    DECOY: { sessionKey: null, target: '/tools/local-indexer/' },
  };
  const ORDER = ['A', 'B', 'C', 'D', 'DECOY'];
  const SESSION_TTL_MS = 30 * 60 * 1000;
  const form = document.getElementById('gate-form');
  const row = document.getElementById('gate-row');
  const input = document.getElementById('gate-input');
  const status = document.getElementById('gate-status');
  const toggle = document.getElementById('gate-toggle');
  let canaries = null;
  let busy = false;

  const b64 = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));

  async function loadCanaries() {
    if (canaries) return canaries;
    const response = await fetch('canaries.json', { cache: 'no-store' });
    if (!response.ok) throw new Error('canary unavailable');
    canaries = await response.json();
    return canaries;
  }

  async function tryCanary(passphrase, canary, areaId) {
    try {
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: b64(canary.salt), iterations: canary.iterations },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt'],
      );
      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64(canary.iv), additionalData: b64(canary.aad) },
        key,
        b64(canary.data),
      );
      return new TextDecoder().decode(plain) === `dt-gate-canary:v1:${areaId}`;
    } catch (_) {
      return false;
    }
  }

  function setStatus(text, isError) {
    status.textContent = text;
    status.classList.toggle('is-error', Boolean(isError));
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      toggle.setAttribute('aria-pressed', String(!visible));
      input.focus({ preventScroll: true });
    });
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (busy) return;
    const value = input.value;
    if (!value) return;
    busy = true;
    input.readOnly = true;
    row.classList.remove('is-error', 'is-ok');
    setStatus('VERIFYING\u2026', false);
    let matched = null;
    try {
      const data = await loadCanaries();
      for (const areaId of ORDER) {
        const canary = data.canaries?.[areaId];
        if (!canary) continue;
        if (await tryCanary(value, canary, areaId)) matched = matched || areaId;
      }
    } catch (_) {
      matched = null;
    }
    if (matched) {
      const area = AREAS[matched];
      if (area.sessionKey) {
        try {
          localStorage.setItem(area.sessionKey, JSON.stringify({ value, expiresAt: Date.now() + SESSION_TTL_MS }));
        } catch (_) {   }
      }
      input.value = '';
      row.classList.add('is-ok');
      setStatus('', false);
      setTimeout(() => location.assign(area.target), 150);
      return;
    }
    input.readOnly = false;
    busy = false;
    row.classList.add('is-error');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      row.classList.add('shake');
      setTimeout(() => row.classList.remove('shake'), 220);
    }
    setStatus('ACCESS DENIED', true);
    input.focus({ preventScroll: true });
    input.select();
  });

  input.addEventListener('input', () => {
    if (row.classList.contains('is-error')) {
      row.classList.remove('is-error');
      setStatus('', false);
    }
  });

  if (window.matchMedia('(pointer: fine)').matches) input.focus({ preventScroll: true });
})();
</script>


</body>
