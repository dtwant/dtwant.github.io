<!doctype html>
<html lang="ja" data-dt-private-shell="v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>SYSTEM ROOT · dt's world</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
  :root {
    color-scheme: dark;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background-color: #030308;
    color: #eef6ff;
    overflow-wrap: break-word;
  }

  .pvx-shell {
    --pvx-bg: #030308;
    --pvx-surface-top: #0d111a;
    --pvx-surface: #090c13;
    --pvx-surface-deep: #06080e;
    --pvx-well: #05070c;
    --pvx-key-top: #151b28;
    --pvx-key-bot: #0d111b;
    --pvx-fn-top: #10141e;
    --pvx-fn-bot: #090c13;

    --pvx-cyan: #00f3ff;
    --pvx-cyan-dim: rgba(0, 243, 255, 0.28);
    --pvx-pink: #ff0055;
    --pvx-pink-text: #ff5c93;
    --pvx-green: #00ff66;

    --pvx-text-1: #eef6ff;
    --pvx-text-2: #c4d2e0;
    --pvx-text-3: #88a4ba;
    --pvx-text-muted: #7a90a6;

    --pvx-rim-width: 1.5px;
    --pvx-radius: 18px;
    --pvx-font-display: 'Orbitron', 'Arial Black', sans-serif;
    --pvx-font-key: 'Black Ops One', 'Orbitron', sans-serif;
    --pvx-font-mono: 'Share Tech Mono', ui-monospace, 'SF Mono', monospace;
    --pvx-font-jp: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    --pvx-check-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='square' stroke-linejoin='miter'><polyline points='20 6 9 17 4 12'></polyline></svg>");

    box-sizing: border-box;
    position: relative;
    width: 100%;
    max-width: 100%;
    min-height: 100svh;
    min-height: 100dvh;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: clip;
    background-color: var(--pvx-bg);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.08) 0%, transparent 56%),
      linear-gradient(rgba(0, 243, 255, 0.032) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.032) 1px, transparent 1px);
    background-size: 100% 100%, 32px 32px, 32px 32px;
    background-position: center top, center center, center center;
    font-family: var(--pvx-font-mono);
    color: var(--pvx-text-1);
    -webkit-font-smoothing: antialiased;
  }

  .pvx-shell *,
  .pvx-shell *::before,
  .pvx-shell *::after {
    box-sizing: border-box;
  }

  /* ── Main Tactical Card + Multi-Layer Machined Bezel ── */
  .pvx-card {
    position: relative;
    isolation: isolate;
    width: 100%;
    max-width: 430px;
    border-radius: var(--pvx-radius);
    padding: 22px 20px 18px;
    background: var(--pvx-surface);
    /* Outer stepped machined flange (zero large blur) */
    box-shadow:
      0 0 0 1px #020306,
      0 0 0 4px #0a0d16,
      0 0 0 5px rgba(192, 212, 232, 0.14),
      0 10px 12px rgba(0, 0, 0, 0.72);
  }

  /* Layer 1: Liquid-metal ring (exposed ONLY at the 1.5px perimeter) */
  .pvx-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background-image: linear-gradient(
      118deg,
      #161c26 0%,
      #3b4759 10%,
      #e6eef5 18%,
      rgba(255, 220, 176, 0.96) 25%,
      #222a36 35%,
      #12161f 46%,
      rgba(130, 229, 216, 0.94) 56%,
      #f2f7fc 63%,
      #2b3443 74%,
      rgba(255, 220, 176, 0.92) 84%,
      #d0dce7 91%,
      #161c26 100%
    );
    background-size: 260% 260%;
    background-position: 0% 0%;
    pointer-events: none;
    z-index: 0;
  }

  /* Layer 2: Matte near-black machined chassis plate + 4 corner torx rivets */
  .pvx-card::after {
    content: "";
    position: absolute;
    inset: var(--pvx-rim-width);
    border-radius: calc(var(--pvx-radius) - var(--pvx-rim-width));
    background-color: var(--pvx-surface);
    background-image:
      radial-gradient(circle 3px at 11px 11px, #05070c 0 1.4px, #354152 1.6px 2.6px, transparent 3px),
      radial-gradient(circle 3px at calc(100% - 11px) 11px, #05070c 0 1.4px, #354152 1.6px 2.6px, transparent 3px),
      radial-gradient(circle 3px at 11px calc(100% - 11px), #05070c 0 1.4px, #354152 1.6px 2.6px, transparent 3px),
      radial-gradient(circle 3px at calc(100% - 11px) calc(100% - 11px), #05070c 0 1.4px, #354152 1.6px 2.6px, transparent 3px),
      linear-gradient(180deg, var(--pvx-surface-top) 0%, var(--pvx-surface) 28%, var(--pvx-surface-deep) 100%);
    border: 1px solid rgba(208, 224, 240, 0.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.09),
      inset 0 -1px 0 rgba(0, 0, 0, 0.88);
    pointer-events: none;
    z-index: 0;
  }

  .pvx-card > * {
    position: relative;
    z-index: 1;
  }

  @media (prefers-reduced-motion: no-preference) {
    .pvx-card::before {
      animation: pvx-liquid-rim 14s ease-in-out infinite alternate;
    }
  }

  @keyframes pvx-liquid-rim {
    0% {
      background-position: 0% 0%;
    }
    100% {
      background-position: 100% 100%;
    }
  }

  /* ── 1. Top Telemetry Badge Row ── */
  .pvx-badge-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(168, 194, 218, 0.14);
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .pvx-gate-id {
    color: var(--pvx-text-3);
    font-weight: 600;
  }

  .pvx-armed {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border: 1px solid rgba(0, 255, 102, 0.34);
    border-radius: 3px;
    background: rgba(0, 255, 102, 0.07);
    color: var(--pvx-green);
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .pvx-armed-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--pvx-green);
    box-shadow: 0 0 0 2px rgba(0, 255, 102, 0.2), 0 0 6px rgba(0, 255, 102, 0.7);
    flex-shrink: 0;
  }

  /* ── 2. Identity Lockup ── */
  .pvx-identity {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    grid-template-rows: auto auto;
    column-gap: 12px;
    row-gap: 4px;
    align-items: center;
    margin-bottom: 14px;
  }

  .pvx-sigil {
    grid-row: 1 / 3;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: linear-gradient(180deg, #101622 0%, #070a11 100%);
    border: 1px solid rgba(0, 243, 255, 0.34);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.1),
      inset 0 -2px 3px rgba(0, 0, 0, 0.8);
    color: var(--pvx-cyan);
  }

  .pvx-sigil svg {
    width: 30px;
    height: 30px;
    display: block;
  }

  .pvx-title {
    margin: 0;
    min-width: 0;
    font-family: var(--pvx-font-display);
    font-size: clamp(1.125rem, 5vw, 1.375rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 0.08em;
    color: var(--pvx-text-1);
    text-transform: uppercase;
    text-wrap: balance;
  }

  .pvx-node {
    min-width: 0;
    font-size: 0.65rem;
    line-height: 1.3;
    letter-spacing: 0.12em;
    color: var(--pvx-text-3);
    text-transform: uppercase;
  }

  /* ── 3. Classification Strip ── */
  .pvx-classification {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 6px 10px 6px 12px;
    border-radius: 4px;
    background: var(--pvx-well);
    border: 1px solid rgba(255, 0, 85, 0.28);
    border-left: 3px solid var(--pvx-pink);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.85);
    font-size: 0.65rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .pvx-class-level {
    color: var(--pvx-pink-text);
    font-weight: 700;
  }

  .pvx-class-cipher {
    color: var(--pvx-cyan);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ── 4. Command Prompt ── */
  .pvx-prompt {
    margin-bottom: 10px;
    text-align: center;
  }

  .pvx-prompt-main {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--pvx-text-1);
    text-transform: uppercase;
  }

  .pvx-prompt-cursor {
    color: var(--pvx-cyan);
  }

  .pvx-prompt-sub {
    margin-top: 3px;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    color: var(--pvx-text-muted);
    text-transform: uppercase;
  }

  /* ── 5. 6-Digit PIN Display Bay ── */
  .pvx-display {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
    padding: 7px;
    margin-bottom: 16px;
    border-radius: 10px;
    background: var(--pvx-well);
    border: 1px solid rgba(176, 200, 224, 0.14);
    box-shadow:
      inset 0 2px 5px rgba(0, 0, 0, 0.9),
      0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .pvx-digit {
    position: relative;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    background: linear-gradient(180deg, #0b0f18 0%, #070910 100%);
    border: 1px solid rgba(164, 190, 214, 0.2);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.85);
    font-family: var(--pvx-font-display);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--pvx-cyan);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  /* Renders pip only when JS leaves .pvx-digit empty (no double-dot if JS writes text) */
  .pvx-digit:empty::after {
    content: "";
    width: 10px;
    height: 2px;
    border-radius: 1px;
    background: rgba(136, 164, 186, 0.36);
    transform: scale(1);
    opacity: 1;
  }

  @media (prefers-reduced-motion: no-preference) {
    .pvx-digit:empty::after {
      transition: transform 90ms cubic-bezier(0.2, 0, 0, 1), opacity 90ms ease;
    }
  }

  .pvx-digit.filled {
    border-color: var(--pvx-cyan);
    background: linear-gradient(180deg, #09202c 0%, #06131c 100%);
    box-shadow:
      inset 0 2px 0 var(--pvx-cyan),
      0 0 8px rgba(0, 243, 255, 0.22);
  }

  .pvx-digit.filled:empty::after {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--pvx-cyan);
    box-shadow: 0 0 6px rgba(0, 243, 255, 0.75);
    transform: rotate(45deg) scale(1);
  }

  .pvx-digit.error {
    border-color: var(--pvx-pink);
    background: linear-gradient(180deg, #270815 0%, #16050c 100%);
    color: var(--pvx-pink-text);
    box-shadow:
      inset 0 2px 0 var(--pvx-pink),
      0 0 8px rgba(255, 0, 85, 0.28);
  }

  .pvx-digit.error:empty::after {
    width: 14px;
    height: 3px;
    border-radius: 1px;
    background: var(--pvx-pink);
    box-shadow: 0 0 6px rgba(255, 0, 85, 0.75);
    transform: rotate(0deg) scale(1);
  }

  .pvx-digit.success {
    border-color: var(--pvx-green);
    background: linear-gradient(180deg, #072415 0%, #05160d 100%);
    color: var(--pvx-green);
    box-shadow:
      inset 0 2px 0 var(--pvx-green),
      0 0 8px rgba(0, 255, 102, 0.28);
  }

  .pvx-digit.success:empty::after {
    width: 11px;
    height: 11px;
    border-radius: 2px;
    background: var(--pvx-green);
    box-shadow: 0 0 6px rgba(0, 255, 102, 0.8);
    transform: rotate(0deg) scale(1);
  }

  /* Automatic state reaction via :has() without extra JS hooks */
  .pvx-card:has(.pvx-digit.error) .pvx-display {
    border-color: rgba(255, 0, 85, 0.55);
  }

  .pvx-card:has(.pvx-digit.error) .pvx-sigil {
    border-color: rgba(255, 0, 85, 0.65);
    color: var(--pvx-pink);
  }

  .pvx-card:has(.pvx-digit.success) .pvx-display {
    border-color: rgba(0, 255, 102, 0.6);
  }

  .pvx-card:has(.pvx-digit.success) .pvx-sigil {
    border-color: rgba(0, 255, 102, 0.7);
    color: var(--pvx-green);
  }

  @media (prefers-reduced-motion: no-preference) {
    .pvx-card:has(.pvx-digit.error) .pvx-display {
      animation: pvx-shake 240ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
  }

  @keyframes pvx-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    45% { transform: translateX(6px); }
    70% { transform: translateX(-3px); }
    88% { transform: translateX(3px); }
  }

  /* ── 6. Tactical Hardware Keypad ── */
  .pvx-keypad {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
    max-width: 318px;
    margin-inline: auto;
    margin-bottom: 10px;
  }

  .pvx-key {
    position: relative;
    appearance: none;
    min-height: 52px;
    margin: 0;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: 1px solid rgba(182, 206, 228, 0.18);
    border-top-color: rgba(218, 234, 248, 0.3);
    border-bottom-color: rgba(0, 0, 0, 0.9);
    background: linear-gradient(180deg, var(--pvx-key-top) 0%, var(--pvx-key-bot) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.09),
      inset 0 -2px 0 rgba(0, 0, 0, 0.7),
      0 2px 0 #04060b;
    color: var(--pvx-text-1);
    font-family: var(--pvx-font-key);
    font-size: 1.28rem;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 60ms cubic-bezier(0.2, 0, 0, 1);
  }

  /* Machined corner index notch */
  .pvx-key::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 6px;
    width: 6px;
    height: 2px;
    background: var(--pvx-cyan);
    opacity: 0.4;
    pointer-events: none;
  }

  @media (hover: hover) {
    .pvx-key:hover {
      border-color: rgba(0, 243, 255, 0.58);
      background: linear-gradient(180deg, #192434 0%, #101724 100%);
      color: #ffffff;
    }
    .pvx-key:hover::before {
      opacity: 1;
    }
  }

  .pvx-key:active,
  .pvx-key.is-pressed {
    transform: scale(0.94);
    border-color: var(--pvx-cyan);
    background: linear-gradient(180deg, #0b2230 0%, #07151f 100%);
    color: var(--pvx-cyan);
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, 0.85),
      0 0 8px rgba(0, 243, 255, 0.26);
  }

  .pvx-key:active::before,
  .pvx-key.is-pressed::before {
    opacity: 1;
  }

  .pvx-key:focus-visible {
    outline: 2px solid var(--pvx-cyan);
    outline-offset: 2px;
  }

  .pvx-key:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  /* Function keys: CLEAR / DELETE */
  .pvx-key.pvx-fn {
    background: linear-gradient(180deg, var(--pvx-fn-top) 0%, var(--pvx-fn-bot) 100%);
    border-color: rgba(164, 188, 212, 0.15);
    border-top-color: rgba(196, 216, 236, 0.22);
    font-family: var(--pvx-font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #a8c0d4;
  }

  .pvx-key.pvx-fn[data-v="clear"] {
    color: var(--pvx-pink-text);
    border-color: rgba(255, 0, 85, 0.28);
  }

  .pvx-key.pvx-fn[data-v="clear"]::before {
    background: var(--pvx-pink);
    opacity: 0.65;
  }

  @media (hover: hover) {
    .pvx-key.pvx-fn[data-v="clear"]:hover {
      border-color: rgba(255, 0, 85, 0.72);
      background: linear-gradient(180deg, #240c18 0%, #15070e 100%);
      color: #ff7ba7;
    }
  }

  .pvx-key.pvx-fn[data-v="clear"]:active,
  .pvx-key.pvx-fn[data-v="clear"].is-pressed {
    border-color: var(--pvx-pink);
    background: linear-gradient(180deg, #2a0a19 0%, #17050e 100%);
    color: #ff7ba7;
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, 0.85),
      0 0 8px rgba(255, 0, 85, 0.28);
  }

  /* ── 7. Fixed-Height Status Line (Zero CLS) ── */
  .pvx-status {
    height: 28px;
    min-height: 28px;
    margin-bottom: 4px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.25;
    text-align: center;
    color: var(--pvx-cyan);
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .pvx-status.error,
  .pvx-status.is-error {
    color: var(--pvx-pink-text);
  }

  .pvx-status.success,
  .pvx-status.is-success {
    color: var(--pvx-green);
  }

  /* ── 8. Remember Checkbox Row (44px Touch Target) ── */
  .pvx-remember-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }

  .pvx-remember-row label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-block-size: 44px;
    padding: 4px 8px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--pvx-font-jp);
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--pvx-text-2);
  }

  .pvx-remember-row input[type="checkbox"] {
    --pvx-cb-size: 1.15em;
    --pvx-cb-icon: 0.72em;
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
    display: inline-grid;
    place-content: center;
    inline-size: var(--pvx-cb-size);
    aspect-ratio: 1;
    margin: 0;
    border-radius: 4px;
    border: 1.5px solid rgba(176, 200, 224, 0.42);
    background: var(--pvx-well);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.85);
    cursor: pointer;
  }

  .pvx-remember-row input[type="checkbox"]::before {
    content: "";
    inline-size: var(--pvx-cb-icon);
    aspect-ratio: 1;
    background-color: #030308;
    -webkit-mask: var(--pvx-check-mask) no-repeat center / contain;
    mask: var(--pvx-check-mask) no-repeat center / contain;
    transform: scale(0);
  }

  @media (prefers-reduced-motion: no-preference) {
    .pvx-remember-row input[type="checkbox"]::before {
      transition: transform 120ms cubic-bezier(0.2, 0, 0, 1);
    }
  }

  @media (forced-colors: active) {
    .pvx-remember-row input[type="checkbox"]::before {
      background-color: CanvasText;
    }
  }

  .pvx-remember-row input[type="checkbox"]:checked {
    border-color: var(--pvx-cyan);
    background-color: var(--pvx-cyan);
    box-shadow: 0 0 6px rgba(0, 243, 255, 0.32);
  }

  .pvx-remember-row input[type="checkbox"]:checked::before {
    transform: scale(1);
  }

  .pvx-remember-row input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--pvx-cyan);
    outline-offset: 2px;
  }

  .pvx-remember-row input[type="checkbox"]:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ── 9. Tactical Footer ── */
  .pvx-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 10px;
    border-top: 1px solid rgba(168, 194, 218, 0.12);
    font-size: 0.625rem;
    letter-spacing: 0.11em;
    color: var(--pvx-text-muted);
    text-transform: uppercase;
  }

  /* ── Mobile Bottom-Sheet Layout (<= 500px) ── */
  @media (max-width: 500px) {
    .pvx-shell {
      align-items: flex-end;
      justify-content: center;
      padding: 12px 0 0;
    }

    .pvx-card {
      --pvx-radius: 26px;
      max-width: none;
      width: 100%;
      border-radius: 26px 26px 0 0;
      padding:
        18px
        max(14px, env(safe-area-inset-right, 0px))
        calc(14px + env(safe-area-inset-bottom, 0px))
        max(14px, env(safe-area-inset-left, 0px));
      box-shadow: 0 -8px 12px rgba(0, 0, 0, 0.72);
    }

    .pvx-card::after {
      inset: var(--pvx-rim-width) var(--pvx-rim-width) 0 var(--pvx-rim-width);
      border-radius: calc(26px - var(--pvx-rim-width)) calc(26px - var(--pvx-rim-width)) 0 0;
      border-bottom: none;
      background-image:
        radial-gradient(circle 3px at 14px 14px, #05070c 0 1.4px, #354152 1.6px 2.6px, transparent 3px),
        radial-gradient(circle 3px at calc(100% - 14px) 14px, #05070c 0 1.4px, #354152 1.6px 2.6px, transparent 3px),
        linear-gradient(180deg, var(--pvx-surface-top) 0%, var(--pvx-surface) 28%, var(--pvx-surface-deep) 100%);
    }

    .pvx-badge-row {
      margin-bottom: 12px;
      padding-bottom: 8px;
    }

    .pvx-identity {
      margin-bottom: 12px;
    }

    .pvx-classification {
      margin-bottom: 12px;
    }

    .pvx-display {
      gap: 6px;
      padding: 6px;
      margin-bottom: 12px;
    }

    .pvx-digit {
      height: 46px;
    }

    .pvx-keypad {
      gap: 8px;
      margin-bottom: 8px;
    }

    .pvx-key {
      min-height: 52px;
    }

    .pvx-status {
      height: 26px;
      min-height: 26px;
    }

    .pvx-remember-row {
      margin-bottom: 8px;
    }
  }
  </style>
</head>

      <div class="pvx-classification" translate="no">

  <script>
    (() => {
      'use strict';
      const SESSION_KEY = "dtw-private-passphrase-project-x-v1";
      const SESSION_TTL = 1800000;
      const card = document.getElementById('pvx-card');
      const displayEl = document.getElementById('pvx-display');
      const digits = [...displayEl.querySelectorAll('.pvx-digit')];
      const keypad = document.getElementById('pvx-keypad');
      const status = document.getElementById('pvx-status');
      const remember = document.getElementById('pvx-remember');
      const payload = JSON.parse(document.getElementById('pv-payload').textContent);
      const encoder = new TextEncoder();
      const decoder = new TextDecoder('utf-8', { fatal: true });
      let code = '';
      let busy = false;
      let attempts = 0;

      const fromBase64 = (value) => {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return bytes;
      };
      const setStatus = (message, state = '') => {
        status.textContent = message;
        status.className = 'pvx-status' + (state ? ' ' + state : '');
      };
      const render = () => {
        digits.forEach((digit, index) => {
          digit.classList.toggle('filled', index < code.length);
        });
        displayEl.setAttribute('aria-label', code.length + ' / 6桁入力済み');
      };
      const clearRemembered = () => { try { localStorage.removeItem(SESSION_KEY); } catch (_) { /* fail closed */ } };
      const readRemembered = () => {
        try {
          const stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
          if (!stored || typeof stored.value !== 'string' || stored.expiresAt <= Date.now()) { clearRemembered(); return null; }
          return stored.value;
        } catch (_) { clearRemembered(); return null; }
      };
      const storeRemembered = (value) => {
        try { localStorage.setItem(SESSION_KEY, JSON.stringify({ value, expiresAt: Date.now() + SESSION_TTL })); } catch (_) { /* storage disabled */ }
      };

      const unlock = async (pin, auto = false) => {
        if (busy) return;
        if (!window.crypto?.subtle) { setStatus('このブラウザーは安全な復号機能に対応していません。', 'error'); return; }
        busy = true;
        card.dataset.state = 'busy';
        setStatus(auto ? 'SESSION確認中 — 復号しています…' : 'VERIFYING — 復号しています…', 'busy');
        try {
          const expectedPath = payload.path.endsWith('/') ? payload.path : payload.path + '/';
          const currentPath = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
          if (expectedPath !== currentPath) throw new Error('path mismatch');
          const material = await crypto.subtle.importKey('raw', encoder.encode(pin), 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', hash: 'SHA-256', salt: fromBase64(payload.salt), iterations: payload.iterations },
            material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
          );
          const plaintextBuffer = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: fromBase64(payload.iv), additionalData: fromBase64(payload.aad), tagLength: 128 },
            key, fromBase64(payload.data)
          );
          const plaintext = decoder.decode(plaintextBuffer);
          if (!/^<!doctype html>/i.test(plaintext)) throw new Error('invalid document');
          if (remember.checked) storeRemembered(pin); else clearRemembered();
          digits.forEach((digit) => digit.classList.add('success'));
          setStatus('ACCESS GRANTED', 'success');
          const authenticatedPlaintext = plaintext.replace(/<html\b/i, '<html data-dt-private-unlocked="true"');
          document.open();
          document.write(authenticatedPlaintext);
          document.close();
        } catch (_) {
          attempts += 1;
          clearRemembered();
          const delay = Math.min(2600, 280 * (2 ** Math.min(attempts - 1, 4)));
          await new Promise((resolve) => setTimeout(resolve, delay));
          busy = false;
          code = '';
          card.dataset.state = 'error';
          digits.forEach((digit) => digit.classList.add('error'));
          render();
          setStatus('ACCESS DENIED — コードを確認してください', 'error');
          setTimeout(() => { digits.forEach((digit) => digit.classList.remove('error')); card.dataset.state = ''; }, 380);
        }
      };

      // 高速入力対策: pointerdown で同期的に1桁登録する。click の到着を待たず、
      // フォーカス移動も挟まないため、iPhoneのロック画面並みに連打へ追随する。
      const press = (value) => {
        if (busy) return;
        if (card.dataset.state === 'error') {
          card.dataset.state = '';
          digits.forEach((digit) => digit.classList.remove('error'));
          setStatus('', '');
        }
        if (value === 'clear') { code = ''; render(); return; }
        if (value === 'back') { code = code.slice(0, -1); render(); return; }
        if (!/^\d$/.test(value) || code.length >= 6) return;
        code += value;
        render();
        if (code.length === 6) unlock(code);
      };
      keypad.addEventListener('pointerdown', (event) => {
        const button = event.target.closest('.pvx-key');
        if (!button || (event.pointerType === 'mouse' && event.button !== 0)) return;
        event.preventDefault();
        button.classList.add('is-pressed');
        setTimeout(() => button.classList.remove('is-pressed'), 110);
        press(button.dataset.v);
      });
      keypad.addEventListener('click', (event) => {
        // pointerdown で処理済み。detail===0 はキーボード/支援技術の合成クリック。
        if (event.detail !== 0) return;
        const button = event.target.closest('.pvx-key');
        if (button) press(button.dataset.v);
      });
      document.addEventListener('keydown', (event) => {
        if (/^\d$/.test(event.key)) { event.preventDefault(); press(event.key); }
        else if (event.key === 'Backspace') { event.preventDefault(); press('back'); }
        else if (event.key === 'Escape') { event.preventDefault(); press('clear'); }
      });

      render();
      const remembered = readRemembered();
      if (remembered) unlock(remembered, true);
    })();
  </script>
</body>
</html>
