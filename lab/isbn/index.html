<script>
var isbnApp = (function() {
  "use strict";

  let html5QrcodeScanner = null;
  let isScanning = false;
  let recentBooks = [];

  function loadRecentBooks() {
    try {
      recentBooks = JSON.parse(localStorage.getItem('isbn_recent_books') || '[]');
      renderBookshelf();
    } catch(e) {}
  }

  function saveRecentBook(book) {
    recentBooks = recentBooks.filter(b => b.isbn !== book.isbn);
    recentBooks.unshift(book);
    if (recentBooks.length > 8) recentBooks.pop();
    try { localStorage.setItem('isbn_recent_books', JSON.stringify(recentBooks)); } catch(e) {}
    renderBookshelf();
  }

  function renderBookshelf() {
    const sec = document.getElementById('shelf-section');
    const scroll = document.getElementById('shelf-scroll');
    if (!sec || !scroll) return;

    if (recentBooks.length === 0) {
      sec.style.display = 'none';
      return;
    }

    sec.style.display = 'flex';
    scroll.innerHTML = recentBooks.map(b => `
      <div class="isbn-shelf-item" onclick="isbnApp.fillAndSearch('${b.isbn}')">
        ${b.cover ? `<img src="${b.cover}" class="isbn-shelf-thumb" alt="cover"/>` : `<div class="isbn-shelf-thumb-empty">NO IMAGE</div>`}
        <div class="isbn-shelf-name">${b.title}</div>
      </div>
    `).join('');
  }

  function formatPubDate(dateStr) {
    if (dateStr && dateStr.length === 8) {
      return `${dateStr.substring(0,4)}/${dateStr.substring(4,6)}/${dateStr.substring(6,8)}`;
    }
    return dateStr || '不明';
  }

  function fillAndSearch(code) {
    document.getElementById('isbn-input').value = code;
    searchISBN();
  }

  function toggleCamera() {
    if (isScanning) {
      stopCamera();
    } else {
      startCamera();
    }
  }

  function startCamera() {
    const placeholder = document.getElementById('scanner-placeholder');
    const laser = document.getElementById('scan-laser');
    const btn = document.getElementById('btn-cam-toggle');

    placeholder.style.display = 'none';
    laser.style.display = 'block';
    btn.textContent = '⏹ カメラを停止';
    btn.className = 'isbn-btn isbn-btn-danger';
    isScanning = true;

    try {
      html5QrcodeScanner = new Html5Qrcode("reader-camera");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: { width: 260, height: 160 } },
        (decodedText) => {
          document.getElementById('isbn-input').value = decodedText;
          stopCamera();
          searchISBN();
        },
        () => {}
      ).catch(() => {
        stopCamera();
      });
    } catch(e) {
      stopCamera();
    }
  }

  function stopCamera() {
    const placeholder = document.getElementById('scanner-placeholder');
    const laser = document.getElementById('scan-laser');
    const btn = document.getElementById('btn-cam-toggle');

    placeholder.style.display = 'flex';
    laser.style.display = 'none';
    btn.textContent = '📷 カメラ起動';
    btn.className = 'isbn-btn isbn-btn-green';

    if (html5QrcodeScanner && isScanning) {
      html5QrcodeScanner.stop().then(() => {
        html5QrcodeScanner.clear();
        isScanning = false;
      }).catch(() => { isScanning = false; });
    }
    isScanning = false;
  }

  async function searchISBN() {
    const inputEl = document.getElementById('isbn-input');
    let isbn = inputEl ? inputEl.value.replace(/[-\s]/g, '') : '';

    if (!isbn) return;
    if (inputEl) inputEl.blur();

    const spinner = document.getElementById('isbn-spinner');
    const bookCard = document.getElementById('isbn-book-card');
    const btnSearch = document.getElementById('btn-search');

    spinner.style.display = 'block';
    bookCard.classList.remove('show');
    btnSearch.disabled = true;

    try {
      const openbdRes = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
      const openbdData = await openbdRes.json();

      if (openbdData && openbdData.length > 0 && openbdData[0] != null) {
        const summary = openbdData[0].summary;
        const onix = openbdData[0].onix;
        let desc = '';
        if (onix && onix.CollateralDetail && onix.CollateralDetail.TextContent) {
          desc = onix.CollateralDetail.TextContent.map(t => t.Text).join('\n');
        }

        const bookObj = {
          title: summary.title || 'タイトル不明',
          author: summary.author || '著者不明',
          publisher: summary.publisher || '出版社不明',
          date: formatPubDate(summary.pubdate),
          cover: summary.cover || '',
          isbn: isbn,
          source: 'OpenBD (JAPAN)',
          synopsis: desc
        };

        saveRecentBook(bookObj);
        renderBookCard(bookObj);
      } else {
        const gbRes = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
        const gbData = await gbRes.json();

        if (gbData.items && gbData.items.length > 0) {
          const info = gbData.items[0].volumeInfo;
          let coverUrl = '';
          if (info.imageLinks) {
            coverUrl = (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '').replace('http:', 'https:');
          }

          const bookObj = {
            title: info.title || 'タイトル不明',
            author: info.authors ? info.authors.join(', ') : '著者不明',
            publisher: info.publisher || '出版社不明',
            date: info.publishedDate || '不明',
            cover: coverUrl,
            isbn: isbn,
            source: 'Google Books API',
            synopsis: info.description || ''
          };

          saveRecentBook(bookObj);
          renderBookCard(bookObj);
        } else {
          alert('該当するISBNコードの書籍情報が見つかりませんでした。');
        }
      }
    } catch(err) {
      console.error(err);
    } finally {
      spinner.style.display = 'none';
      btnSearch.disabled = false;
    }
  }

  function renderBookCard(data) {
    document.getElementById('book-title').textContent = data.title;
    document.getElementById('book-author').textContent = data.author;
    document.getElementById('book-publisher').textContent = data.publisher;
    document.getElementById('book-date').textContent = data.date;
    document.getElementById('book-isbn13').textContent = data.isbn;
    document.getElementById('book-source').textContent = data.source;

    
    const synEl = document.getElementById('book-synopsis');
    if (data.synopsis) {
      synEl.textContent = data.synopsis;
      synEl.style.display = 'block';
    } else {
      synEl.style.display = 'none';
    }

    
    document.getElementById('btn-amazon').href = `https://www.amazon.co.jp/s?k=${data.isbn}`;
    document.getElementById('btn-google').href = `https://www.google.com/search?tbm=bks&q=isbn:${data.isbn}`;

    const coverImg = document.getElementById('book-cover');
    const placeholder = document.getElementById('cover-placeholder');

    if (data.cover) {
      coverImg.src = data.cover;
      coverImg.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      coverImg.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    document.getElementById('isbn-book-card').classList.add('show');
  }

  function init() {
    loadRecentBooks();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else setTimeout(init, 50);

  return { searchISBN, fillAndSearch, toggleCamera, stopCamera };
})();
</script>
