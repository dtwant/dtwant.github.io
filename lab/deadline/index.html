:root {

.dm-app, .dm-app * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

.dm-app {
  font-family: var(--px-body);
  color: var(--px-ink);
  min-height: 100vh;
  width: 100%;
  padding: 5.5rem 1rem 7rem;

.dm-container { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }

 
.dm-header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .8rem; padding: .2rem 0 .9rem; border-bottom: 3px solid var(--px-frame); box-shadow: 0 3px 0 #000; }
.dm-title { font-family: var(--px-font); font-size: 1.85rem; font-weight: 400; letter-spacing: .02em; line-height: 1.15; color: var(--px-ink); text-shadow: 3px 3px 0 #000, 6px 6px 0 rgba(127,168,184,.25); }

.dm-head-actions { display: flex; gap: .5rem; align-items: center; }
.dm-pill { display: inline-flex; align-items: center; min-height: 38px; padding: .35rem .8rem; border: 2px solid var(--px-frame); border-radius: 4px; background: #171a20; color: var(--px-dim); font-family: var(--px-font); font-size: .78rem; cursor: pointer; box-shadow: 3px 3px 0 #000; }
.dm-pill.ok { color: var(--px-green); border-color: var(--px-green); }
.dm-pill.busy, .dm-pill.error { color: var(--px-orange); border-color: var(--px-orange); }
.dm-pill:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
.dm-icon-btn, .dm-exit-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; border: 2px solid #000; border-radius: 4px; font-family: var(--px-font); cursor: pointer; box-shadow: 3px 3px 0 #000; transition: transform .08s steps(2), box-shadow .08s steps(2); }
.dm-icon-btn { width: 38px; background: var(--px-panel2); color: var(--px-ink); font-size: 1rem; }
.dm-exit-btn { padding: 0 .8rem; background: rgba(255,64,64,.14); color: var(--px-red); border-color: var(--px-red); font-size: .8rem; }
.dm-icon-btn:active, .dm-exit-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }

 
.dm-widget-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
.dm-widget-card { background: var(--px-panel); border: 3px solid #000; outline: 2px solid var(--px-frame); border-radius: 6px; box-shadow: 5px 5px 0 #000; padding: 0 0 .8rem; text-align: center; cursor: pointer; overflow: hidden; transition: transform .08s steps(2), box-shadow .08s steps(2); }
.dm-widget-card:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #000; }
.dm-widget-strip { font-family: var(--px-font); font-size: .68rem; letter-spacing: .14em; color: #0c0c16; padding: .28rem 0; margin-bottom: .55rem; }
.dm-widget-card.urgent .dm-widget-strip { background: var(--px-red); }
.dm-widget-card.all .dm-widget-strip { background: var(--px-cyan); }
.dm-widget-card.done .dm-widget-strip { background: var(--px-green); }
.dm-widget-val { font-family: var(--px-font); font-size: 2rem; line-height: 1; color: var(--px-ink); }
.dm-widget-card.urgent .dm-widget-val { color: var(--px-red); }
.dm-widget-card.all .dm-widget-val { color: var(--px-cyan); }
.dm-widget-card.done .dm-widget-val { color: var(--px-green); }
.dm-widget-label { font-size: .7rem; color: var(--px-dim); margin-top: .4rem; font-weight: 500; }

 
.dm-segmented-control { display: flex; background: var(--px-panel); border: 3px solid #000; outline: 2px solid var(--px-frame); border-radius: 6px; box-shadow: 5px 5px 0 #000; padding: 5px; gap: 5px; }
.dm-segment-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: .35rem; min-height: 42px; padding: .5rem .2rem; font-family: var(--px-font); font-size: .85rem; color: var(--px-faint); border-radius: 3px; cursor: pointer; user-select: none; }
.dm-segment-btn .dm-cursor { color: var(--px-yellow); visibility: hidden; }
.dm-segment-btn.active { background: #2b2f38; color: #fff; box-shadow: inset 0 0 0 2px var(--px-frame); }
.dm-segment-btn.active .dm-cursor { visibility: visible; }
.dm-segment-btn:active { transform: scale(.97); }

 
.dm-list { display: flex; flex-direction: column; gap: .8rem; }
.dm-empty { text-align: center; padding: 3rem 1rem; color: var(--px-faint); font-family: var(--px-font); font-size: .9rem; border: 3px dashed var(--px-frame); border-radius: 6px; }
.dm-task-card { background: var(--px-panel); border: 3px solid #000; outline: 2px solid var(--px-frame); border-radius: 6px; box-shadow: 5px 5px 0 #000; padding: .85rem .95rem .9rem; display: flex; flex-direction: column; gap: .55rem; cursor: pointer; position: relative; transition: transform .08s steps(2), box-shadow .08s steps(2); }
.dm-task-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--px-green); }
.dm-task-card.warn::before { background: var(--px-orange); }
.dm-task-card.danger { background: linear-gradient(0deg, rgba(210,118,109,.08), rgba(210,118,109,.08)), var(--px-panel); }
.dm-task-card.danger::before { background: var(--px-red); }
.dm-task-card.done { opacity: .55; }
.dm-task-card.done::before { background: var(--px-faint); }
.dm-task-card:active { transform: translate(2px,2px); box-shadow: 3px 3px 0 #000; }
.dm-task-top { display: flex; align-items: flex-start; gap: .7rem; }
.dm-check { flex: 0 0 auto; width: 30px; height: 30px; border: 3px solid var(--px-frame); border-radius: 4px; background: #121419; color: #0c0c16; font-family: var(--px-font); font-size: 1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 2px 2px 0 #000; }
.dm-check.checked { background: var(--px-green); border-color: #000; }
.dm-check:active { transform: scale(.88); }
.dm-task-title { flex: 1; min-width: 0; font-family: var(--px-font); font-size: 1.02rem; line-height: 1.45; color: var(--px-ink); word-break: break-word; }
.dm-task-title.done { text-decoration: line-through !important; color: var(--px-dim); }
.dm-pri { display: flex; gap: 3px; padding-top: 5px; }
.dm-pri-sq { width: 9px; height: 9px; background: #33363d; }
.dm-pri-sq.on-high { background: var(--px-red); }
.dm-pri-sq.on-mid { background: var(--px-orange); }
.dm-pri-sq.on-low { background: var(--px-cyan); }
.dm-task-meta { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; font-size: .76rem; color: var(--px-dim); padding-left: calc(30px + .7rem); }
.dm-course { font-family: var(--px-font); font-size: .72rem; color: #0c0c16; background: var(--px-cyan); padding: .14rem .5rem; border-radius: 2px; }
.dm-date { font-family: var(--px-font); letter-spacing: .03em; }
.dm-alert { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: var(--px-red); color: #fff; font-family: var(--px-font); font-size: .8rem; border-radius: 2px; animation: dm-blink 1s steps(2) infinite; }
.dm-task-bottom { display: flex; align-items: center; gap: .8rem; padding-left: calc(30px + .7rem); }
.dm-gauge { flex: 1; display: flex; gap: 2px; min-width: 0; }
.dm-gauge i { flex: 1; height: 10px; background: #2a2d34; box-shadow: inset 0 2px 0 rgba(255,255,255,.06); }
.dm-gauge.safe i.on { background: var(--px-green); }
.dm-gauge.warn i.on { background: var(--px-orange); }
.dm-gauge.danger i.on { background: var(--px-red); }
.dm-count { font-family: var(--px-font); font-size: .95rem; white-space: nowrap; }
.dm-count.safe { color: var(--px-green); }
.dm-count.warn { color: var(--px-orange); }
.dm-count.danger { color: var(--px-red); }
.dm-count.done { color: var(--px-dim); }
@keyframes dm-blink { 50% { opacity: .25; } }

 
.dm-btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 46px; border: 3px solid #000; border-radius: 5px; font-family: var(--px-font); font-size: .9rem; padding: .6rem 1.1rem; cursor: pointer; background: var(--px-panel2); color: var(--px-ink); box-shadow: 4px 4px 0 #000; transition: transform .08s steps(2), box-shadow .08s steps(2); user-select: none; }
.dm-btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 #000; }
.dm-btn-primary { background: var(--px-yellow); color: #0c0c16; }
.dm-fab { position: fixed; bottom: 26px; right: 22px; width: 58px; height: 58px; border-radius: 8px; background: var(--px-yellow); color: #0c0c16; display: flex; align-items: center; justify-content: center; font-family: var(--px-font); font-size: 1.9rem; box-shadow: 5px 5px 0 #000; border: 3px solid #000; cursor: pointer; z-index: 9999; transition: transform .08s steps(2), box-shadow .08s steps(2); }
.dm-fab:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #000; }

 
.dm-sheet-overlay { position: fixed; inset: 0; background: rgba(4,4,10,.82); z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
.dm-sheet-overlay.show { opacity: 1; pointer-events: auto; }
.dm-sheet { width: 100%; max-width: 500px; background: var(--px-panel); border: 3px solid #000; outline: 2px solid var(--px-frame); border-radius: 8px 8px 0 0; box-shadow: 0 -6px 0 rgba(0,0,0,.5); padding: 0 1.2rem 2rem; transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1); }
.dm-sheet-overlay.show .dm-sheet { transform: translateY(0); }
.dm-sheet-bar { display: flex; align-items: center; gap: .5rem; margin: 0 -1.2rem 1.1rem; padding: .55rem 1.2rem; background: #262a33; border-bottom: 3px solid #000; font-family: var(--px-font); font-size: .8rem; color: var(--px-cyan); letter-spacing: .08em; }
.dm-sheet-bar i { width: 10px; height: 10px; background: var(--px-magenta); box-shadow: 14px 0 0 var(--px-yellow), 28px 0 0 var(--px-green); margin-right: 32px; }
.dm-sheet h3 { font-family: var(--px-font); font-weight: 400; }
.dm-form-group { display: flex; flex-direction: column; gap: .4rem; text-align: left; }
.dm-form-label { font-family: var(--px-font); font-size: .75rem; color: var(--px-dim); }
.dm-input-box { width: 100%; min-height: 48px; padding: .7rem .9rem; border-radius: 4px; background: #121419; border: 2px solid var(--px-frame); color: #fff; font-size: .95rem; outline: none; font-family: inherit; }
.dm-input-box:focus { border-color: var(--px-cyan); box-shadow: 3px 3px 0 #000; }
select option, .dm-input-box option { background-color: #17172b !important; color: #fff !important; }

 
.dm-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(90px); background: #101020; border: 2px solid var(--px-cyan); border-radius: 4px; padding: .7rem 1.2rem; font-family: var(--px-font); font-size: .85rem; color: #fff; box-shadow: 5px 5px 0 #000; opacity: 0; transition: transform .25s steps(4), opacity .2s ease; z-index: 10000000; pointer-events: none; white-space: nowrap; }
.dm-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.dm-app :focus-visible, .dm-sheet :focus-visible, .dm-fab:focus-visible { outline: 3px solid var(--px-cyan); outline-offset: 2px; }
@media (min-width: 641px) { .dm-sheet-overlay { justify-content: center; } .dm-sheet { border-radius: 8px; padding-bottom: 1.6rem; } }
@media (prefers-reduced-motion: reduce) { .dm-alert { animation: none; } .dm-task-card, .dm-widget-card, .dm-btn, .dm-fab { transition: none; } }
</style>



<div class="dm-app">
  <div class="dm-container" id="dm-main-content">
    
  </div>
</div>

<button class="dm-fab" onclick="dmOpenAddModal()" title="新規タスク追加">＋</button>


<div id="dm-task-modal" class="dm-sheet-overlay" onclick="if(event.target===this)dmCloseTaskModal()">
  <div class="dm-sheet">
    <div class="dm-sheet-bar"><i></i>TASK WINDOW</div>
    <h3 id="dm-modal-title" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; text-align: center;">新規タスク</h3>
    <form onsubmit="dmTaskSubmit(event)" style="display: flex; flex-direction: column; gap: 1rem;">
      <input type="hidden" id="dm-edit-id" />
      <div class="dm-form-group">
        <label class="dm-form-label">タイトル</label>
        <input type="text" id="dm-input-title" placeholder="例: レポート提出" class="dm-input-box" required />
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <div class="dm-form-group" style="flex:1;">
          <label class="dm-form-label">科目・カテゴリ</label>
          <input type="text" id="dm-input-course" placeholder="例: 物理学" class="dm-input-box" />
        </div>
        <div class="dm-form-group" style="flex:1;">
          <label class="dm-form-label">優先度</label>
          <select id="dm-input-priority" class="dm-input-box">
            <option value="high">高 (緊急)</option>
            <option value="mid" selected>普通</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <div class="dm-form-group" style="flex:1.5;">
          <label class="dm-form-label">締切日</label>
          <input type="date" id="dm-input-date" class="dm-input-box" required />
        </div>
        <div class="dm-form-group" style="flex:1;">
          <label class="dm-form-label">時刻 / 限目</label>
          <select id="dm-input-period" class="dm-input-box">
            <option value="end">23:59 (23:59)</option>
            <option value="1">1限開始 (08:50)</option>
            <option value="2">2限開始 (10:30)</option>
            <option value="3">3限開始 (13:00)</option>
            <option value="4">4限開始 (14:40)</option>
            <option value="5">5限開始 (16:20)</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
        <button type="button" id="dm-del-btn" class="dm-btn" style="color:var(--neon-pink);display:none;" onclick="dmDeleteCurrentTask()">削除</button>
        <button type="button" class="dm-btn" style="flex:1;" onclick="dmCloseTaskModal()">キャンセル</button>
        <button type="submit" class="dm-btn dm-btn-primary" style="flex:1.5;">保存</button>
      </div>
    </form>
  </div>
</div>


<div id="dm-config-modal" class="dm-sheet-overlay" onclick="if(event.target===this)dmCloseConfigModal()">
  <div class="dm-sheet">
    <div class="dm-sheet-bar"><i></i>SYSTEM</div>
    <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; text-align: center;">システム設定</h3>
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <div>
        <label style="font-size: 0.75rem; color: var(--apple-subtext); display: block; margin-bottom: 0.4rem; text-align: left;">D1同期状態</label>
        <div id="dm-config-blob-id" style="padding: 0.85rem; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--apple-border); font-family: monospace; font-size: 0.85rem;">未接続 (LOCAL)</div>
      </div>
      <button class="dm-btn" style="width: 100%;" onclick="dmCloseConfigModal()">閉じる</button>
    </div>
  </div>
</div>

<div id="dm-toast" class="dm-toast"></div>

<script>
(function() {
  const STORAGE_KEY = 'dt_deadline_v5';
  const DONE_KEY = 'dt_deadline_done_v5';
  const BLOB_KEY = 'dt_deadline_blob_id';

  const PERIOD_TIMES = {
    1: "08:50",
    2: "10:30",
    3: "13:00",
    4: "14:40",
    5: "16:20",
    "end": "23:59"
  };

  let tasks = [];
  let doneTasks = [];
  let blobId = localStorage.getItem(BLOB_KEY) || null;
  let syncStatus = blobId ? 'ok' : 'local';
  let activeTab = 'all'; 
  let toastTimer = null;

  function showToast(msg) {
    const el = document.getElementById('dm-toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  function getJbKey() {
    return window.PWAConfigSync ? window.PWAConfigSync.getApiKey() : '';
  }

  function loadLocalData() {
    try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { tasks = []; }
    try { doneTasks = JSON.parse(localStorage.getItem(DONE_KEY)) || []; } catch(e) { doneTasks = []; }

    if (tasks.length === 0 && doneTasks.length === 0 && !localStorage.getItem(STORAGE_KEY)) {
      const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
      tasks = [
        { id: 1, title: 'サンプル: 物理学レポート', course: '物理学', priority: 'high', date: tomorrow, period: 'end' }
      ];
    }
  }

  function saveAndSync() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      localStorage.setItem(DONE_KEY, JSON.stringify(doneTasks));
    } catch(e) {}
    renderApp();

    if (window.DTD1LegacySync?.isDisabled('deadline')) return;
    if (!blobId) return;
    fetch('https://api.jsonbin.io/v3/b/' + blobId, {
      method: 'PUT',
      headers: { 'X-Master-Key': getJbKey(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ tasks, doneTasks })
    }).then(res => {
      syncStatus = res.ok ? 'ok' : 'error';
      renderApp();
    }).catch(() => {
      syncStatus = 'error';
      renderApp();
    });
  }

  function calculateCountdown(dateStr, periodStr) {
    if (!dateStr) return { text: '期限未設定', diffMs: 999999999, state: 'safe' };
    const timeStr = PERIOD_TIMES[periodStr] || "23:59";
    const target = new Date(`${dateStr}T${timeStr}:00`).getTime();
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) return { text: '期限切れ', diffMs: diff, state: 'danger' };

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const days = Math.floor(hours / 24);

    let state = 'safe';
    if (hours <= 24) state = 'danger';
    else if (hours <= 72) state = 'warn';

    if (days >= 1) return { text: `残り ${days}日`, diffMs: diff, state };
    return { text: `残り ${hours}時間`, diffMs: diff, state };
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function gaugeCells(diffMs, state) {
    const TOTAL = 14;
    let filled = 0;
    if (diffMs > 0) {
      const frac = Math.min(diffMs / (7 * 24 * 60 * 60 * 1000), 1);
      filled = Math.max(1, Math.round(frac * TOTAL));
    }
    let out = '';
    for (let i = 0; i < TOTAL; i++) out += `<i class="${i < filled ? 'on' : ''}"></i>`;
    return out;
  }

  function priSquares(priority) {
    const level = priority === 'high' ? 3 : priority === 'low' ? 1 : 2;
    let out = '';
    for (let i = 0; i < 3; i++) out += `<span class="dm-pri-sq${i < level ? ' on-' + (priority || 'mid') : ''}"></span>`;
    return out;
  }

  function renderApp() {
    const container = document.getElementById('dm-main-content');
    if (!container) return;

    let displayTasks = [];
    if (activeTab === 'all') displayTasks = tasks;
    else if (activeTab === 'urgent') displayTasks = tasks.filter(t => calculateCountdown(t.date, t.period).state === 'danger');
    else if (activeTab === 'done') displayTasks = doneTasks;

    if (activeTab !== 'done') {
      displayTasks.sort((a, b) => calculateCountdown(a.date, a.period).diffMs - calculateCountdown(b.date, b.period).diffMs);
    }

    const urgentCount = tasks.filter(t => calculateCountdown(t.date, t.period).state === 'danger').length;

    let listHtml = '';
    if (displayTasks.length === 0) {
      listHtml = `<div class="dm-empty">▶ タスクはありません</div>`;
    } else {
      listHtml = displayTasks.map(task => {
        const isDone = activeTab === 'done';
        const cd = isDone ? { text: '完了', state: 'safe', diffMs: 0 } : calculateCountdown(task.date, task.period);

        return `
          <div class="dm-task-card ${isDone ? 'done' : cd.state}" onclick="dmOpenEditModal('${task.id}', ${isDone})">
            <div class="dm-task-top">
              <div class="dm-check ${isDone ? 'checked' : ''}" onclick="event.stopPropagation(); dmToggleTask('${task.id}', ${isDone})">${isDone ? '✓' : ''}</div>
              <div class="dm-task-title ${isDone ? 'done' : ''}">${escHtml(task.title)}</div>
              ${!isDone ? `<div class="dm-pri" title="優先度">${priSquares(task.priority)}</div>` : ''}
            </div>
            <div class="dm-task-meta">
              ${task.course ? `<span class="dm-course">${escHtml(task.course)}</span>` : ''}
              <span class="dm-date">${task.date || ''} ${PERIOD_TIMES[task.period] || '23:59'}</span>
              ${!isDone && cd.state === 'danger' ? '<span class="dm-alert" aria-hidden="true">!</span>' : ''}
            </div>
            <div class="dm-task-bottom">
              ${!isDone ? `<div class="dm-gauge ${cd.state}">${gaugeCells(cd.diffMs, cd.state)}</div><div class="dm-count ${cd.state}">${cd.text}</div>` : '<div class="dm-count done">CLEAR!</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    container.innerHTML = `
      <div class="dm-header">
        <div>
          <h1 class="dm-title">DEADLINE MANAGER</h1>
          <div class="dm-subtitle">▶ QUEST LOG — 課題締切管理</div>
        </div>
        <div class="dm-head-actions">
          <span class="dm-pill ${syncStatus}" onclick="dmSyncInfo()">
            ${syncStatus === 'ok' ? '● SYNCED' : syncStatus === 'busy' ? '◌ SYNCING' : '◌ LOCAL'}
          </span>
          <button class="dm-icon-btn" onclick="dmOpenConfigModal()" title="設定">⚙</button>
          <button class="dm-exit-btn" onclick="if(history.length>1){history.back();}else{location.href='/lab/';}" title="ポータルへ戻る">✕ EXIT</button>
        </div>
      </div>

      <div class="dm-widget-grid">
        <div class="dm-widget-card urgent" onclick="dmSwitchTab('urgent')">
          <div class="dm-widget-strip">ALERT</div>
          <div class="dm-widget-val">${urgentCount}</div>
          <div class="dm-widget-label">緊急 (24h以内)</div>
        </div>
        <div class="dm-widget-card all" onclick="dmSwitchTab('all')">
          <div class="dm-widget-strip">OPEN</div>
          <div class="dm-widget-val">${tasks.length}</div>
          <div class="dm-widget-label">未完了タスク</div>
        </div>
        <div class="dm-widget-card done" onclick="dmSwitchTab('done')">
          <div class="dm-widget-strip">CLEAR</div>
          <div class="dm-widget-val">${doneTasks.length}</div>
          <div class="dm-widget-label">完了済み</div>
        </div>
      </div>

      <div class="dm-segmented-control">
        <div class="dm-segment-btn ${activeTab === 'all' ? 'active' : ''}" onclick="dmSwitchTab('all')"><span class="dm-cursor">▶</span>全件</div>
        <div class="dm-segment-btn ${activeTab === 'urgent' ? 'active' : ''}" onclick="dmSwitchTab('urgent')"><span class="dm-cursor">▶</span>緊急 (${urgentCount})</div>
        <div class="dm-segment-btn ${activeTab === 'done' ? 'active' : ''}" onclick="dmSwitchTab('done')"><span class="dm-cursor">▶</span>完了 (${doneTasks.length})</div>
      </div>

      <div class="dm-list">
        ${listHtml}
      </div>
    `;
  }

  
  window.dmSyncInfo = function() { showToast('同期状態: ' + syncStatus); };
  window.dmSwitchTab = function(tab) {
    activeTab = tab;
    renderApp();
  };

  window.dmToggleTask = function(id, isDone) {
    if (isDone) {
      const idx = doneTasks.findIndex(t => String(t.id) === String(id));
      if (idx !== -1) {
        const item = doneTasks.splice(idx, 1)[0];
        tasks.push(item);
        showToast('タスクを未完了に戻しました');
      }
    } else {
      const idx = tasks.findIndex(t => String(t.id) === String(id));
      if (idx !== -1) {
        const item = tasks.splice(idx, 1)[0];
        doneTasks.push(item);
        showToast('タスクを完了しました');
      }
    }
    saveAndSync();
  };

  window.dmOpenAddModal = function() {
    document.getElementById('dm-modal-title').textContent = '新規タスク';
    document.getElementById('dm-edit-id').value = '';
    document.getElementById('dm-input-title').value = '';
    document.getElementById('dm-input-course').value = '';
    document.getElementById('dm-input-priority').value = 'mid';
    document.getElementById('dm-input-date').value = new Date(Date.now() + 86400000).toISOString().split('T')[0];
    document.getElementById('dm-input-period').value = 'end';
    document.getElementById('dm-del-btn').style.display = 'none';

    document.getElementById('dm-task-modal').classList.add('show');
  };

  window.dmOpenEditModal = function(id, isDone) {
    if (isDone) return;
    const target = tasks.find(t => String(t.id) === String(id));
    if (!target) return;

    document.getElementById('dm-modal-title').textContent = 'タスクの編集';
    document.getElementById('dm-edit-id').value = target.id;
    document.getElementById('dm-input-title').value = target.title;
    document.getElementById('dm-input-course').value = target.course || '';
    document.getElementById('dm-input-priority').value = target.priority || 'mid';
    document.getElementById('dm-input-date').value = target.date || '';
    document.getElementById('dm-input-period').value = target.period || 'end';
    document.getElementById('dm-del-btn').style.display = 'inline-flex';

    document.getElementById('dm-task-modal').classList.add('show');
  };

  window.dmCloseTaskModal = function() {
    document.getElementById('dm-task-modal').classList.remove('show');
  };

  window.dmTaskSubmit = function(e) {
    e.preventDefault();
    const editId = document.getElementById('dm-edit-id').value;
    const title = document.getElementById('dm-input-title').value.trim();
    const course = document.getElementById('dm-input-course').value.trim();
    const priority = document.getElementById('dm-input-priority').value;
    const date = document.getElementById('dm-input-date').value;
    const period = document.getElementById('dm-input-period').value;

    if (!title) return;

    if (editId) {
      tasks = tasks.map(t => String(t.id) === String(editId) ? { ...t, title, course, priority, date, period } : t);
      showToast('タスクを更新しました');
    } else {
      tasks.push({ id: Date.now(), title, course, priority, date, period });
      showToast('新規タスクを追加しました');
    }

    saveAndSync();
    dmCloseTaskModal();
  };

  window.dmDeleteCurrentTask = function() {
    const editId = document.getElementById('dm-edit-id').value;
    if (!editId) return;
    if (!confirm('このタスクを削除しますか？')) return;
    tasks = tasks.filter(t => String(t.id) !== String(editId));
    saveAndSync();
    dmCloseTaskModal();
    showToast('タスクを削除しました');
  };

  window.dmOpenConfigModal = function() {
    document.getElementById('dm-config-blob-id').textContent = blobId || '未接続 (LOCAL)';
    document.getElementById('dm-config-modal').classList.add('show');
  };
  window.dmCloseConfigModal = function() {
    document.getElementById('dm-config-modal').classList.remove('show');
  };

  
  document.addEventListener('DOMContentLoaded', () => {
    loadLocalData();
    renderApp();
  });
  loadLocalData();
  renderApp();
})();
</script>
