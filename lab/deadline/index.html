:root {
  --apple-bg: #000000;
  --apple-card: rgba(20, 20, 24, 0.8);
  --apple-border: rgba(255, 255, 255, 0.1);
  --apple-separator: rgba(255, 255, 255, 0.06);
  --apple-text: #f5f5f7;
  --apple-subtext: #86868b;
  
   
  --neon-cyan: #00f2fe;
  --neon-cyan-glow: rgba(0, 242, 254, 0.35);
  --neon-pink: #ff2d55;
  --neon-pink-glow: rgba(255, 45, 85, 0.35);
  --neon-green: #30d158;
  --neon-green-glow: rgba(48, 209, 88, 0.35);
  --neon-orange: #ff9f0a;
  --neon-orange-glow: rgba(255, 159, 10, 0.35);
  --neon-purple: #bf5af2;

  --apple-font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Zen Kaku Gothic New', sans-serif;
  --apple-spring: cubic-bezier(0.32, 0.72, 0, 1);
  --apple-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.dm-app, .dm-app * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

.dm-app {
  font-family: var(--apple-font);
  color: var(--apple-text);
  min-height: 100vh;
  width: 100%;
  padding: 5.5rem 1.25rem 6rem 1.25rem;
  background: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.06) 0%, rgba(0, 0, 0, 0) 65%), #000000;
  -webkit-font-smoothing: antialiased;
  position: relative;
  z-index: 10;
}

.dm-container {
  max-width: 780px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

 
.dm-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 0.4rem;
  padding: 0.5rem 0;
}
.dm-title {
  font-size: 2.1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #ffffff 30%, var(--neon-cyan) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
}
.dm-subtitle {
  font-size: 0.82rem;
  color: var(--apple-subtext);
  font-weight: 400;
  letter-spacing: 0.03em;
}

 
.dm-widget-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.85rem;
}
.dm-widget-card {
  background: var(--apple-card);
  border: 1px solid var(--apple-border);
  border-radius: 18px;
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  padding: 1.1rem 0.85rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  transition: transform 0.25s var(--apple-spring), border-color 0.25s ease, box-shadow 0.25s ease;
  cursor: pointer;
}
.dm-widget-card.urgent { border-color: rgba(255, 45, 85, 0.3); }
.dm-widget-card.urgent:hover { box-shadow: 0 0 25px var(--neon-pink-glow); }

.dm-widget-card.all { border-color: rgba(0, 242, 254, 0.3); }
.dm-widget-card.all:hover { box-shadow: 0 0 25px var(--neon-cyan-glow); }

.dm-widget-card.done { border-color: rgba(48, 209, 88, 0.3); }
.dm-widget-card.done:hover { box-shadow: 0 0 25px var(--neon-green-glow); }

.dm-widget-card:active {
  transform: scale(0.95);
}

.dm-widget-val {
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.dm-widget-label {
  font-size: 0.72rem;
  color: var(--apple-subtext);
  font-weight: 500;
  margin-top: 0.35rem;
  letter-spacing: 0.02em;
}

 
.dm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 0.6rem 1.1rem;
  cursor: pointer;
  border: 1px solid var(--apple-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--apple-text);
  transition: transform 0.15s var(--apple-bounce), background 0.2s ease;
  user-select: none;
  font-family: inherit;
}
.dm-btn:active {
  transform: scale(0.94);
  background: rgba(255, 255, 255, 0.12);
}
.dm-btn-primary {
  background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  color: #000000;
  border: none;
  font-weight: 700;
  box-shadow: 0 4px 18px var(--neon-cyan-glow);
}
.dm-btn-primary:active {
  background: #00c6ff;
}
.dm-btn-circle {
  width: 2.4rem;
  height: 2.4rem;
  padding: 0;
  border-radius: 50%;
}

 
.dm-fab {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  color: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.7rem;
  font-weight: 600;
  box-shadow: 0 8px 25px var(--neon-cyan-glow);
  border: none;
  cursor: pointer;
  z-index: 9999;
  transition: transform 0.15s var(--apple-bounce), box-shadow 0.2s ease;
}
.dm-fab:active {
  transform: scale(0.88);
  box-shadow: 0 4px 12px var(--neon-cyan-glow);
}

 
.dm-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.35rem 0.85rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid var(--apple-border);
  background: rgba(255, 255, 255, 0.04);
  cursor: pointer;
  transition: transform 0.15s var(--apple-bounce);
}
.dm-pill:active { transform: scale(0.94); }
.dm-pill.ok { color: var(--neon-green); border-color: rgba(48, 209, 88, 0.3); background: rgba(48, 209, 88, 0.1); box-shadow: 0 0 10px rgba(48, 209, 88, 0.15); }
.dm-pill.busy { color: var(--neon-orange); border-color: rgba(255, 159, 10, 0.3); background: rgba(255, 159, 10, 0.1); }

 
.dm-segmented-control {
  display: flex;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--apple-border);
  border-radius: 14px;
  padding: 3px;
}
.dm-segment-btn {
  flex: 1;
  text-align: center;
  padding: 0.55rem 0.25rem;
  font-size: 0.82rem;
  font-weight: 600;
  border-radius: 11px;
  cursor: pointer;
  color: var(--apple-subtext);
  transition: all 0.2s var(--apple-spring);
  user-select: none;
}
.dm-segment-btn.active {
  background: rgba(255, 255, 255, 0.14);
  color: #ffffff;
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.08);
}

 
.dm-task-card {
  background: var(--apple-card);
  border: 1px solid var(--apple-border);
  border-radius: 18px;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0.65rem;
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  transition: transform 0.2s var(--apple-spring), border-color 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  cursor: pointer;
}
.dm-task-card:active {
  transform: scale(0.985);
  background: rgba(30, 30, 35, 0.85);
}
.dm-task-card.danger {
  border-top: 3px solid var(--neon-pink);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(255, 45, 85, 0.08);
}
.dm-task-card.warn {
  border-top: 3px solid var(--neon-orange);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(255, 159, 10, 0.08);
}
.dm-task-card.safe {
  border-top: 3px solid var(--neon-green);
}
.dm-task-card.done {
  opacity: 0.45;
  border-top: 3px solid var(--apple-subtext);
}

 
.dm-check-circle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--apple-subtext);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s var(--apple-bounce);
  margin-bottom: 0.1rem;
}
.dm-check-circle.checked {
  background: var(--neon-green);
  border-color: var(--neon-green);
  color: #000000;
  font-weight: 800;
  font-size: 0.85rem;
  box-shadow: 0 0 12px var(--neon-green-glow);
}
.dm-check-circle:active {
  transform: scale(0.82);
}

.dm-task-title-text {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: #ffffff;
  text-align: center;
}
.dm-task-title-text.done {
  text-decoration: line-through !important;
  color: var(--apple-subtext);
}

.dm-task-submeta {
  display: flex;
  gap: 0.6rem;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  font-size: 0.78rem;
  color: var(--apple-subtext);
  font-weight: 400;
  text-align: center;
}

 
.dm-badge-tag {
  font-size: 0.72rem;
  padding: 0.22rem 0.7rem;
  border-radius: 999px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.dm-badge-tag.danger {
  color: var(--neon-pink);
  background: rgba(255, 45, 85, 0.15);
  border: 1px solid rgba(255, 45, 85, 0.3);
  box-shadow: 0 0 12px rgba(255, 45, 85, 0.2);
}
.dm-badge-tag.warn {
  color: var(--neon-orange);
  background: rgba(255, 159, 10, 0.15);
  border: 1px solid rgba(255, 159, 10, 0.3);
  box-shadow: 0 0 12px rgba(255, 159, 10, 0.18);
}
.dm-badge-tag.safe {
  color: var(--neon-green);
  background: rgba(48, 209, 88, 0.15);
  border: 1px solid rgba(48, 209, 88, 0.3);
}

 
.dm-sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  z-index: 9999999;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--apple-spring);
}
.dm-sheet-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.dm-sheet {
  width: 100%;
  max-width: 500px;
  background: #18181a;
  border: 1px solid var(--apple-border);
  border-radius: 26px 26px 0 0;
  padding: 1.5rem 1.75rem 2.5rem 1.75rem;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
  transform: translateY(100%);
  transition: transform 0.35s var(--apple-spring);
  text-align: center;
}
.dm-sheet-overlay.show .dm-sheet {
  transform: translateY(0);
}
.dm-sheet-handle {
  width: 36px; height: 5px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  margin: 0 auto 1.25rem auto;
}

.dm-form-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  text-align: left;
}
.dm-form-label {
  font-size: 0.75rem;
  color: var(--apple-subtext);
  font-weight: 500;
}
.dm-input-box {
  width: 100%;
  padding: 0.85rem 1.1rem;
  border-radius: 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--apple-border);
  color: #fff;
  font-size: 0.95rem;
  outline: none;
  font-family: inherit;
}
.dm-input-box:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px var(--neon-cyan-glow);
}
select option,
.dm-input-box option {
  background-color: #1c1c1e !important;
  color: #ffffff !important;
}

 
.dm-toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: rgba(30, 30, 35, 0.95);
  border: 1px solid var(--apple-border);
  backdrop-filter: blur(25px);
  padding: 0.75rem 1.35rem;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  color: #ffffff;
  box-shadow: 0 12px 36px rgba(0,0,0,0.6);
  opacity: 0;
  transition: transform 0.35s var(--apple-bounce), opacity 0.25s ease;
  z-index: 10000000;
  pointer-events: none;
  white-space: nowrap;
}
.dm-toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

@media (min-width: 641px) {
  .dm-sheet-overlay { align-items: center; }
  .dm-sheet { border-radius: 22px; padding-bottom: 1.75rem; }
  .dm-sheet-handle { display: none; }
}
</style>

<div class="dm-app">
  <div class="dm-container" id="dm-main-content">
    
  </div>
</div>

<button class="dm-fab" onclick="dmOpenAddModal()" title="新規タスク追加">＋</button>


<div id="dm-task-modal" class="dm-sheet-overlay" onclick="if(event.target===this)dmCloseTaskModal()">
  <div class="dm-sheet">
    <div class="dm-sheet-handle"></div>
    <h3 id="dm-modal-title" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; text-align: center;">新規タスク</h3>
    <form onsubmit="dmTaskSubmit(event)" style="display: flex; flex-direction: column; gap: 1rem;">
      <input type="hidden" id="dm-edit-id" />
      <div class="dm-form-group">
        <label class="dm-form-label">タイトル</label>
        <input type="text" id="dm-input-title" placeholder="例: レポート提出" class="dm-input-box" required />
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <div class="dm-form-group" style="flex:1;">
          <label class="dm-form-label">科目・カテゴリ</label>
          <input type="text" id="dm-input-course" placeholder="例: 物理学" class="dm-input-box" />
        </div>
        <div class="dm-form-group" style="flex:1;">
          <label class="dm-form-label">優先度</label>
          <select id="dm-input-priority" class="dm-input-box">
            <option value="high">高 (緊急)</option>
            <option value="mid" selected>普通</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <div class="dm-form-group" style="flex:1.5;">
          <label class="dm-form-label">締切日</label>
          <input type="date" id="dm-input-date" class="dm-input-box" required />
        </div>
        <div class="dm-form-group" style="flex:1;">
          <label class="dm-form-label">時刻 / 限目</label>
          <select id="dm-input-period" class="dm-input-box">
            <option value="end">23:59 (23:59)</option>
            <option value="1">1限開始 (08:50)</option>
            <option value="2">2限開始 (10:30)</option>
            <option value="3">3限開始 (13:00)</option>
            <option value="4">4限開始 (14:40)</option>
            <option value="5">5限開始 (16:20)</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
        <button type="button" id="dm-del-btn" class="dm-btn" style="color:var(--neon-pink);display:none;" onclick="dmDeleteCurrentTask()">削除</button>
        <button type="button" class="dm-btn" style="flex:1;" onclick="dmCloseTaskModal()">キャンセル</button>
        <button type="submit" class="dm-btn dm-btn-primary" style="flex:1.5;">保存</button>
      </div>
    </form>
  </div>
</div>


<div id="dm-config-modal" class="dm-sheet-overlay" onclick="if(event.target===this)dmCloseConfigModal()">
  <div class="dm-sheet">
    <div class="dm-sheet-handle"></div>
    <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; text-align: center;">システム設定</h3>
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <div>
        <label style="font-size: 0.75rem; color: var(--apple-subtext); display: block; margin-bottom: 0.4rem; text-align: left;">D1同期状態</label>
        <div id="dm-config-blob-id" style="padding: 0.85rem; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--apple-border); font-family: monospace; font-size: 0.85rem;">未接続 (LOCAL)</div>
      </div>
      <button class="dm-btn" style="width: 100%;" onclick="dmCloseConfigModal()">閉じる</button>
    </div>
  </div>
</div>

<div id="dm-toast" class="dm-toast"></div>

<script>
(function() {
  const STORAGE_KEY = 'dt_deadline_v5';
  const DONE_KEY = 'dt_deadline_done_v5';
  const BLOB_KEY = 'dt_deadline_blob_id';

  const PERIOD_TIMES = {
    1: "08:50",
    2: "10:30",
    3: "13:00",
    4: "14:40",
    5: "16:20",
    "end": "23:59"
  };

  let tasks = [];
  let doneTasks = [];
  let blobId = localStorage.getItem(BLOB_KEY) || null;
  let syncStatus = blobId ? 'ok' : 'local';
  let activeTab = 'all'; 
  let toastTimer = null;

  function showToast(msg) {
    const el = document.getElementById('dm-toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  function getJbKey() {
    return window.PWAConfigSync ? window.PWAConfigSync.getApiKey() : '';
  }

  function loadLocalData() {
    try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { tasks = []; }
    try { doneTasks = JSON.parse(localStorage.getItem(DONE_KEY)) || []; } catch(e) { doneTasks = []; }

    if (tasks.length === 0 && doneTasks.length === 0 && !localStorage.getItem(STORAGE_KEY)) {
      const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
      tasks = [
        { id: 1, title: 'サンプル: 物理学レポート', course: '物理学', priority: 'high', date: tomorrow, period: 'end' }
      ];
    }
  }

  function saveAndSync() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      localStorage.setItem(DONE_KEY, JSON.stringify(doneTasks));
    } catch(e) {}
    renderApp();

    if (window.DTD1LegacySync?.isDisabled('deadline')) return;
    if (!blobId) return;
    fetch('https://api.jsonbin.io/v3/b/' + blobId, {
      method: 'PUT',
      headers: { 'X-Master-Key': getJbKey(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ tasks, doneTasks })
    }).then(res => {
      syncStatus = res.ok ? 'ok' : 'error';
      renderApp();
    }).catch(() => {
      syncStatus = 'error';
      renderApp();
    });
  }

  function calculateCountdown(dateStr, periodStr) {
    if (!dateStr) return { text: '期限未設定', diffMs: 999999999, state: 'safe' };
    const timeStr = PERIOD_TIMES[periodStr] || "23:59";
    const target = new Date(`${dateStr}T${timeStr}:00`).getTime();
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) return { text: '期限切れ', diffMs: diff, state: 'danger' };

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const days = Math.floor(hours / 24);

    let state = 'safe';
    if (hours <= 24) state = 'danger';
    else if (hours <= 72) state = 'warn';

    if (days >= 1) return { text: `残り ${days}日`, diffMs: diff, state };
    return { text: `残り ${hours}時間`, diffMs: diff, state };
  }

  function renderApp() {
    const container = document.getElementById('dm-main-content');
    if (!container) return;

    let displayTasks = [];
    if (activeTab === 'all') displayTasks = tasks;
    else if (activeTab === 'urgent') displayTasks = tasks.filter(t => calculateCountdown(t.date, t.period).state === 'danger');
    else if (activeTab === 'done') displayTasks = doneTasks;

    if (activeTab !== 'done') {
      displayTasks.sort((a, b) => calculateCountdown(a.date, a.period).diffMs - calculateCountdown(b.date, b.period).diffMs);
    }

    const urgentCount = tasks.filter(t => calculateCountdown(t.date, t.period).state === 'danger').length;

    let listHtml = '';
    if (displayTasks.length === 0) {
      listHtml = `<div style="text-align:center;padding:3.5rem 1rem;color:var(--apple-subtext);font-size:0.9rem;">タスクはありません</div>`;
    } else {
      listHtml = displayTasks.map(task => {
        const isDone = activeTab === 'done';
        const cd = isDone ? { text: '完了', state: 'safe' } : calculateCountdown(task.date, task.period);

        return `
          <div class="dm-task-card ${cd.state}" onclick="dmOpenEditModal('${task.id}', ${isDone})">
            <div class="dm-check-circle ${isDone ? 'checked' : ''}" onclick="event.stopPropagation(); dmToggleTask('${task.id}', ${isDone})">
              ${isDone ? '✓' : ''}
            </div>
            <div class="dm-task-title-text ${isDone ? 'done' : ''}">${task.title}</div>
            <div class="dm-task-submeta">
              ${task.course ? `<span>${task.course}</span>` : ''}
              <span>${task.date || ''} (${PERIOD_TIMES[task.period] || '23:59'})</span>
            </div>
            ${!isDone ? `<div class="dm-badge-tag ${cd.state}">${cd.text}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    container.innerHTML = `
      <div class="dm-header">
        <h1 class="dm-title">Deadline Manager</h1>
        <div class="dm-subtitle">Task & Schedule Tracker</div>
        <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem;">
          <span class="dm-pill ${syncStatus}" onclick="showToast('同期状態: ' + syncStatus)">
            ${syncStatus === 'ok' ? '● SYNCED' : syncStatus === 'busy' ? '◌ SYNCING' : '◌ LOCAL'}
          </span>
          <button class="dm-btn dm-btn-circle" onclick="dmOpenConfigModal()" title="設定">⚙</button>
          <button class="dm-btn" style="color:var(--neon-pink); border-color:rgba(255,45,85,0.3); background:rgba(255,45,85,0.08);" onclick="if(history.length>1){history.back();}else{location.href='/lab/';}" title="ポータルへ戻る">✕ EXIT</button>
        </div>
      </div>

      \x3C!-- Chic Center Metric Cards with Neon Accent -->
      <div class="dm-widget-grid">
        <div class="dm-widget-card urgent" onclick="dmSwitchTab('urgent')">
          <div class="dm-widget-val" style="color:var(--neon-pink); text-shadow:0 0 15px var(--neon-pink-glow);">${urgentCount}</div>
          <div class="dm-widget-label">緊急 (24h以内)</div>
        </div>
        <div class="dm-widget-card all" onclick="dmSwitchTab('all')">
          <div class="dm-widget-val" style="color:var(--neon-cyan); text-shadow:0 0 15px var(--neon-cyan-glow);">${tasks.length}</div>
          <div class="dm-widget-label">未完了タスク</div>
        </div>
        <div class="dm-widget-card done" onclick="dmSwitchTab('done')">
          <div class="dm-widget-val" style="color:var(--neon-green); text-shadow:0 0 15px var(--neon-green-glow);">${doneTasks.length}</div>
          <div class="dm-widget-label">完了済み</div>
        </div>
      </div>

      \x3C!-- Chic Segment Control -->
      <div class="dm-segmented-control">
        <div class="dm-segment-btn ${activeTab === 'all' ? 'active' : ''}" onclick="dmSwitchTab('all')">全件</div>
        <div class="dm-segment-btn ${activeTab === 'urgent' ? 'active' : ''}" onclick="dmSwitchTab('urgent')">緊急 (${urgentCount})</div>
        <div class="dm-segment-btn ${activeTab === 'done' ? 'active' : ''}" onclick="dmSwitchTab('done')">完了 (${doneTasks.length})</div>
      </div>

      \x3C!-- Task Cards List -->
      <div style="display: flex; flex-direction: column; gap: 0.85rem;">
        ${listHtml}
      </div>
    `;
  }

  
  window.dmSwitchTab = function(tab) {
    activeTab = tab;
    renderApp();
  };

  window.dmToggleTask = function(id, isDone) {
    if (isDone) {
      const idx = doneTasks.findIndex(t => String(t.id) === String(id));
      if (idx !== -1) {
        const item = doneTasks.splice(idx, 1)[0];
        tasks.push(item);
        showToast('タスクを未完了に戻しました');
      }
    } else {
      const idx = tasks.findIndex(t => String(t.id) === String(id));
      if (idx !== -1) {
        const item = tasks.splice(idx, 1)[0];
        doneTasks.push(item);
        showToast('タスクを完了しました');
      }
    }
    saveAndSync();
  };

  window.dmOpenAddModal = function() {
    document.getElementById('dm-modal-title').textContent = '新規タスク';
    document.getElementById('dm-edit-id').value = '';
    document.getElementById('dm-input-title').value = '';
    document.getElementById('dm-input-course').value = '';
    document.getElementById('dm-input-priority').value = 'mid';
    document.getElementById('dm-input-date').value = new Date(Date.now() + 86400000).toISOString().split('T')[0];
    document.getElementById('dm-input-period').value = 'end';
    document.getElementById('dm-del-btn').style.display = 'none';

    document.getElementById('dm-task-modal').classList.add('show');
  };

  window.dmOpenEditModal = function(id, isDone) {
    if (isDone) return;
    const target = tasks.find(t => String(t.id) === String(id));
    if (!target) return;

    document.getElementById('dm-modal-title').textContent = 'タスクの編集';
    document.getElementById('dm-edit-id').value = target.id;
    document.getElementById('dm-input-title').value = target.title;
    document.getElementById('dm-input-course').value = target.course || '';
    document.getElementById('dm-input-priority').value = target.priority || 'mid';
    document.getElementById('dm-input-date').value = target.date || '';
    document.getElementById('dm-input-period').value = target.period || 'end';
    document.getElementById('dm-del-btn').style.display = 'inline-flex';

    document.getElementById('dm-task-modal').classList.add('show');
  };

  window.dmCloseTaskModal = function() {
    document.getElementById('dm-task-modal').classList.remove('show');
  };

  window.dmTaskSubmit = function(e) {
    e.preventDefault();
    const editId = document.getElementById('dm-edit-id').value;
    const title = document.getElementById('dm-input-title').value.trim();
    const course = document.getElementById('dm-input-course').value.trim();
    const priority = document.getElementById('dm-input-priority').value;
    const date = document.getElementById('dm-input-date').value;
    const period = document.getElementById('dm-input-period').value;

    if (!title) return;

    if (editId) {
      tasks = tasks.map(t => String(t.id) === String(editId) ? { ...t, title, course, priority, date, period } : t);
      showToast('タスクを更新しました');
    } else {
      tasks.push({ id: Date.now(), title, course, priority, date, period });
      showToast('新規タスクを追加しました');
    }

    saveAndSync();
    dmCloseTaskModal();
  };

  window.dmDeleteCurrentTask = function() {
    const editId = document.getElementById('dm-edit-id').value;
    if (!editId) return;
    if (!confirm('このタスクを削除しますか？')) return;
    tasks = tasks.filter(t => String(t.id) !== String(editId));
    saveAndSync();
    dmCloseTaskModal();
    showToast('タスクを削除しました');
  };

  window.dmOpenConfigModal = function() {
    document.getElementById('dm-config-blob-id').textContent = blobId || '未接続 (LOCAL)';
    document.getElementById('dm-config-modal').classList.add('show');
  };
  window.dmCloseConfigModal = function() {
    document.getElementById('dm-config-modal').classList.remove('show');
  };

  
  document.addEventListener('DOMContentLoaded', () => {
    loadLocalData();
    renderApp();
  });
  loadLocalData();
  renderApp();
})();
</script>

</div>
