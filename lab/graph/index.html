<script>
const graphApp = (function() {
    "use strict";

    const COLORS = ['#ff0055', '#00f3ff', '#00ff41', '#fcee0a', '#bf5af2'];
    const COLOR_NAMES = ['PINK', 'CYAN', 'GREEN', 'YELLOW', 'PURPLE'];
    const MAX_FUNCS = 5;

    let functions = [{ expr: '', color: COLORS[0] }];

    
    let viewX = -10, viewY = -7, viewW = 20, viewH = 14;
    let isDragging = false, dragStartX = 0, dragStartY = 0, dragViewX = 0, dragViewY = 0;

    
    let lastTouchDist = 0;
    let lastTouchMid = null;

    
    let canvas, ctx, wrap;

    function init() {
        canvas = document.getElementById('graphCanvas');
        ctx = canvas.getContext('2d');
        wrap = document.getElementById('canvasWrap');

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        
        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mouseleave', onMouseUp);
        canvas.addEventListener('wheel', onWheel, { passive: false });

        
        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd);

        
        document.getElementById('funcList').addEventListener('input', debounce(onInputChange, 300));
        document.getElementById('funcList').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); plot(); }
        });

        drawGrid();
        setupFocusToggle();
        log('System ready. Enter a function and click RENDER GRAPH.', 'info');
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = wrap.getBoundingClientRect();
        const w = rect.width;
        const h = Math.min(w * 0.62, 560);
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        const aspect = w / h;
        viewH = viewW / aspect;
        drawAll();
    }

    
    function toCanvasX(x) { return (x - viewX) / viewW * parseFloat(canvas.style.width); }
    function toCanvasY(y) { return (1 - (y - viewY) / viewH) * parseFloat(canvas.style.height); }
    function toMathX(cx) { return viewX + cx / parseFloat(canvas.style.width) * viewW; }
    function toMathY(cy) { return viewY + (1 - cy / parseFloat(canvas.style.height)) * viewH; }

    
    function drawAll() {
        const w = parseFloat(canvas.style.width);
        const h = parseFloat(canvas.style.height);
        ctx.clearRect(0, 0, w, h);
        drawGrid();
        functions.forEach((f, i) => {
            if (f.compiled) drawFunction(f.compiled, f.color, w);
        });
    }

    function drawGrid() {
        const w = parseFloat(canvas.style.width);
        const h = parseFloat(canvas.style.height);

        
        ctx.fillStyle = 'rgba(5, 5, 5, 0.95)';
        ctx.fillRect(0, 0, w, h);

        
        ctx.fillStyle = 'rgba(51, 51, 51, 0.4)';
        const dotSpacingPx = 20;
        for (let px = 0; px < w; px += dotSpacingPx) {
            for (let py = 0; py < h; py += dotSpacingPx) {
                ctx.fillRect(px, py, 1, 1);
            }
        }

        
        const gridStep = niceStep(viewW / 8);

        
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.06)';
        ctx.lineWidth = 0.5;
        const minorStep = gridStep / 5;
        drawGridLines(w, h, minorStep);

        
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
        ctx.lineWidth = 0.5;
        drawGridLines(w, h, gridStep);

        
        const ox = toCanvasX(0), oy = toCanvasY(0);

        
        if (oy >= 0 && oy <= h) {
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
        }
        
        if (ox >= 0 && ox <= w) {
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();
        }

        
        ctx.fillStyle = 'rgba(0, 243, 255, 0.5)';
        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        const startX = Math.ceil(viewX / gridStep) * gridStep;
        for (let gx = startX; gx < viewX + viewW; gx += gridStep) {
            if (Math.abs(gx) < gridStep * 0.01) continue;
            const cx = toCanvasX(gx);
            const labelY = oy >= 0 && oy <= h ? Math.min(oy + 4, h - 14) : h - 14;
            ctx.fillText(formatNum(gx), cx, labelY);
        }

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        const startY = Math.ceil(viewY / gridStep) * gridStep;
        for (let gy = startY; gy < viewY + viewH; gy += gridStep) {
            if (Math.abs(gy) < gridStep * 0.01) continue;
            const cy = toCanvasY(gy);
            const labelX = ox >= 0 && ox <= w ? Math.max(ox - 4, 30) : 30;
            ctx.fillText(formatNum(gy), labelX, cy);
        }

        
        if (ox >= 0 && ox <= w && oy >= 0 && oy <= h) {
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillText('0', ox - 4, oy + 4);
        }
    }

    function drawGridLines(w, h, step) {
        const startX = Math.floor(viewX / step) * step;
        for (let gx = startX; gx < viewX + viewW; gx += step) {
            const cx = toCanvasX(gx);
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
        }
        const startY = Math.floor(viewY / step) * step;
        for (let gy = startY; gy < viewY + viewH; gy += step) {
            const cy = toCanvasY(gy);
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
        }
    }

    function drawFunction(fn, color, w) {
        const h = parseFloat(canvas.style.height);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.shadowColor = color;
        ctx.shadowBlur = 6;
        ctx.beginPath();

        let started = false;
        const steps = Math.ceil(w * 1.5);
        let prevY = null;

        for (let i = 0; i <= steps; i++) {
            const cx = (i / steps) * w;
            const mx = toMathX(cx);
            try {
                const my = fn(mx);
                const cy = toCanvasY(my);

                if (!isFinite(my) || Math.abs(my) > 1e10) {
                    if (started) { ctx.stroke(); ctx.beginPath(); started = false; }
                    prevY = null;
                    continue;
                }

                
                if (prevY !== null && Math.abs(cy - prevY) > h * 0.8) {
                    ctx.stroke(); ctx.beginPath(); started = false;
                }

                if (!started) { ctx.moveTo(cx, cy); started = true; }
                else ctx.lineTo(cx, cy);

                prevY = cy;
            } catch (e) {
                if (started) { ctx.stroke(); ctx.beginPath(); started = false; }
                prevY = null;
            }
        }
        if (started) ctx.stroke();
        ctx.shadowBlur = 0;
    }

    
    function compileMathExpr(expr) {
        var s = expr.trim();
        if (!s) return null;

        
        var tks = [];
        var i = 0;
        while (i < s.length) {
            var ch = s[i];
            if (ch === ' ') { i++; continue; }
            if ((ch >= '0' && ch <= '9') || (ch === '.' && i + 1 < s.length && s[i+1] >= '0' && s[i+1] <= '9')) {
                var num = '';
                while (i < s.length && ((s[i] >= '0' && s[i] <= '9') || s[i] === '.')) { num += s[i]; i++; }
                tks.push({t:'n', v:num}); continue;
            }
            if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {
                var word = '';
                while (i < s.length && ((s[i] >= 'a' && s[i] <= 'z') || (s[i] >= 'A' && s[i] <= 'Z'))) { word += s[i]; i++; }
                tks.push({t:'w', v:word}); continue;
            }
            if (ch === '*' && i + 1 < s.length && s[i+1] === '*') { tks.push({t:'o', v:'**'}); i += 2; continue; }
            if (ch === '^') { tks.push({t:'o', v:'**'}); i++; continue; }
            tks.push({t:'o', v:ch}); i++;
        }

        var fMap = {
            'arcsin':'Math.asin','arccos':'Math.acos','arctan':'Math.atan',
            'asin':'Math.asin','acos':'Math.acos','atan':'Math.atan',
            'sinh':'Math.sinh','cosh':'Math.cosh','tanh':'Math.tanh',
            'sin':'Math.sin','cos':'Math.cos','tan':'Math.tan',
            'sqrt':'Math.sqrt','abs':'Math.abs','exp':'Math.exp',
            'ln':'Math.log','log':'Math.log',
            'ceil':'Math.ceil','floor':'Math.floor','sign':'Math.sign',
            'pi':'Math.PI','PI':'Math.PI'
        };

        var out = '';
        for (var j = 0; j < tks.length; j++) {
            var tk = tks[j];
            var prev = j > 0 ? tks[j-1] : null;
            if (prev) {
                var mul = false;
                if (prev.t === 'n' && tk.t === 'w') mul = true;
                if (prev.t === 'n' && tk.t === 'o' && tk.v === '(') mul = true;
                if (prev.t === 'o' && prev.v === ')' && tk.t === 'n') mul = true;
                if (prev.t === 'o' && prev.v === ')' && tk.t === 'w') mul = true;
                if (prev.t === 'o' && prev.v === ')' && tk.t === 'o' && tk.v === '(') mul = true;
                if (prev.t === 'w' && tk.t === 'o' && tk.v === '(') {
                    if (!fMap[prev.v] && prev.v !== 'Math') mul = true;
                }
                if (prev.t === 'w' && tk.t === 'n') mul = true;
                if (mul) out += '*';
            }
            if (tk.t === 'w') {
                if (fMap[tk.v]) out += fMap[tk.v];
                else if (tk.v === 'e' || tk.v === 'E') out += 'Math.E';
                else out += tk.v;
            } else {
                out += tk.v;
            }
        }

        try {
            var fn = new Function('x', '"use strict"; return (' + out + ');');
            fn(0); fn(1); fn(-1);
            return fn;
        } catch (err) {
            console.error('Parse: "' + expr + '" -> "' + out + '"', err.message);
            return null;
        }
    }

    function exprToLatex(expr) {
        let s = expr.trim();
        if (!s) return '';
        s = s.replace(/\*\*/g, '^');
        s = s.replace(/\bpi\b/gi, '\\pi');
        s = s.replace(/\bsqrt\(([^)]+)\)/g, '\\sqrt{$1}');
        s = s.replace(/\bsin\b/g, '\\sin');
        s = s.replace(/\bcos\b/g, '\\cos');
        s = s.replace(/\btan\b/g, '\\tan');
        s = s.replace(/\basin\b/g, '\\arcsin');
        s = s.replace(/\bacos\b/g, '\\arccos');
        s = s.replace(/\batan\b/g, '\\arctan');
        s = s.replace(/\bln\b/g, '\\ln');
        s = s.replace(/\blog\b/g, '\\log');
        s = s.replace(/\bexp\b/g, '\\exp');
        s = s.replace(/\babs\(([^)]+)\)/g, '|$1|');
        s = s.replace(/\*/g, '\\cdot ');
        
        s = s.replace(/\(([^)]+)\)\/\(([^)]+)\)/g, '\\frac{$1}{$2}');
        return s;
    }

    function renderKatex(elementId, latex) {
        const el = document.getElementById(elementId);
        if (!el || !latex) { if (el) el.innerHTML = ''; return; }
        try {
            if (typeof katex !== 'undefined') {
                katex.render(latex, el, { throwOnError: false, displayMode: false });
            }
        } catch (e) {
            el.innerHTML = '<span style="color:#f43f5e;font-size:10px;">PARSE ERR</span>';
        }
    }

    
    function showKatexOverlay(idx) {
        const expr = functions[idx] ? functions[idx].expr : '';
        const overlay = document.getElementById('katex-overlay-' + idx);
        const wrap = overlay ? overlay.parentElement : null;
        const input = wrap ? wrap.querySelector('.gp-func-input') : null;
        if (!overlay || !wrap || !input) return;

        if (expr.trim()) {
            const latex = exprToLatex(expr);
            const label = idx === 0 ? 'f(x)=' : 'f' + (idx + 1) + '(x)=';
            overlay.innerHTML = '<span class="gp-katex-prefix">' + label + '</span><span class="gp-katex-body" id="katex-body-' + idx + '"></span>';
            renderKatex('katex-body-' + idx, latex);
            overlay.style.display = 'flex';
            input.style.visibility = 'hidden';
            wrap.querySelector('.gp-func-prefix').style.visibility = 'hidden';
            wrap.classList.remove('gp-editing');
        } else {
            overlay.style.display = 'none';
            input.style.visibility = 'visible';
            wrap.querySelector('.gp-func-prefix').style.visibility = 'visible';
            wrap.classList.add('gp-editing');
        }
    }

    function enterEditMode(idx) {
        const overlay = document.getElementById('katex-overlay-' + idx);
        const wrap = overlay ? overlay.parentElement : null;
        const input = wrap ? wrap.querySelector('.gp-func-input') : null;
        if (!overlay || !wrap || !input) return;

        overlay.style.display = 'none';
        input.style.visibility = 'visible';
        wrap.querySelector('.gp-func-prefix').style.visibility = 'visible';
        wrap.classList.add('gp-editing');
        input.focus();
    }

    function setupFocusToggle() {
        const list = document.getElementById('funcList');

        
        list.addEventListener('click', function(e) {
            const overlay = e.target.closest('.gp-func-katex-overlay');
            if (overlay) {
                const wrap = overlay.parentElement;
                const idx = parseInt(wrap.dataset.idx);
                enterEditMode(idx);
                return;
            }
        });

        
        list.addEventListener('focusout', function(e) {
            if (!e.target.classList.contains('gp-func-input')) return;
            const idx = parseInt(e.target.dataset.idx);
            functions[idx].expr = e.target.value;
            setTimeout(function() { showKatexOverlay(idx); }, 150);
        });
    }

    
    function onInputChange(e) {
        if (!e.target.classList.contains('gp-func-input')) return;
        const idx = parseInt(e.target.dataset.idx);
        const expr = e.target.value;
        functions[idx].expr = expr;
    }

    function onMouseDown(e) {
        isDragging = true;
        const rect = canvas.getBoundingClientRect();
        dragStartX = e.clientX - rect.left;
        dragStartY = e.clientY - rect.top;
        dragViewX = viewX;
        dragViewY = viewY;
        canvas.style.cursor = 'grabbing';
    }

    function onMouseMove(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;

        
        const mx = toMathX(cx);
        const my = toMathY(cy);
        document.getElementById('coordsDisplay').textContent = `x: ${mx.toFixed(3)}, y: ${my.toFixed(3)}`;

        if (isDragging) {
            const dx = cx - dragStartX;
            const dy = cy - dragStartY;
            const w = parseFloat(canvas.style.width);
            const h = parseFloat(canvas.style.height);
            viewX = dragViewX - (dx / w) * viewW;
            viewY = dragViewY + (dy / h) * viewH;
            drawAll();
        }
    }

    function onMouseUp() {
        isDragging = false;
        canvas.style.cursor = 'crosshair';
    }

    function onWheel(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        const mx = toMathX(cx);
        const my = toMathY(cy);

        const factor = e.deltaY > 0 ? 1.15 : 0.87;
        zoom(mx, my, factor);
    }

    function onTouchStart(e) {
        if (e.touches.length === 1) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const t = e.touches[0];
            dragStartX = t.clientX - rect.left;
            dragStartY = t.clientY - rect.top;
            dragViewX = viewX;
            dragViewY = viewY;
            isDragging = true;

            
            const mx = toMathX(dragStartX);
            const my = toMathY(dragStartY);
            document.getElementById('coordsDisplay').textContent = `x: ${mx.toFixed(3)}, y: ${my.toFixed(3)}`;
        } else if (e.touches.length === 2) {
            e.preventDefault();
            isDragging = false;
            const t1 = e.touches[0], t2 = e.touches[1];
            lastTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            const rect = canvas.getBoundingClientRect();
            lastTouchMid = {
                x: (t1.clientX + t2.clientX) / 2 - rect.left,
                y: (t1.clientY + t2.clientY) / 2 - rect.top
            };
        }
    }

    function onTouchMove(e) {
        if (e.touches.length === 1 && isDragging) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const t = e.touches[0];
            const cx = t.clientX - rect.left;
            const cy = t.clientY - rect.top;
            const dx = cx - dragStartX;
            const dy = cy - dragStartY;
            const w = parseFloat(canvas.style.width);
            const h = parseFloat(canvas.style.height);
            viewX = dragViewX - (dx / w) * viewW;
            viewY = dragViewY + (dy / h) * viewH;
            drawAll();

            const mx = toMathX(cx);
            const my = toMathY(cy);
            document.getElementById('coordsDisplay').textContent = `x: ${mx.toFixed(3)}, y: ${my.toFixed(3)}`;
        } else if (e.touches.length === 2) {
            e.preventDefault();
            const t1 = e.touches[0], t2 = e.touches[1];
            const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            if (lastTouchDist > 0) {
                const factor = lastTouchDist / dist;
                const mx = toMathX(lastTouchMid.x);
                const my = toMathY(lastTouchMid.y);
                zoom(mx, my, factor);
            }
            lastTouchDist = dist;
        }
    }

    function onTouchEnd(e) {
        if (e.touches.length === 0) {
            isDragging = false;
            lastTouchDist = 0;
        }
    }

    function zoom(mx, my, factor) {
        const newW = viewW * factor;
        const newH = viewH * factor;
        
        if (newW < 0.001 || newW > 100000) return;

        viewX = mx - (mx - viewX) * factor;
        viewY = my - (my - viewY) * factor;
        viewW = newW;
        viewH = newH;
        drawAll();
        document.getElementById('zoomInfo').textContent = `ZOOM: ${(20 / viewW).toFixed(1)}x`;
    }

    
    function addFunction() {
        if (functions.length >= MAX_FUNCS) {
            log('Maximum function slot limit reached (5).', 'warn');
            return;
        }
        const idx = functions.length;
        const color = COLORS[idx % COLORS.length];
        functions.push({ expr: '', color: color });

        const list = document.getElementById('funcList');
        const row = document.createElement('div');
        row.className = 'gp-func-row';
        row.dataset.idx = idx;
        row.innerHTML = `
            <div class="gp-func-color" style="color:${color}; background:${color};"></div>
            <div class="gp-func-input-wrap gp-clip-top gp-editing" data-idx="${idx}">
                <span class="gp-func-prefix">f${idx + 1}(x)=</span>
                <input type="text" class="gp-func-input" placeholder="e.g. cos(x)" data-idx="${idx}" autocomplete="off">
                <div class="gp-func-katex-overlay" id="katex-overlay-${idx}" style="display:none;"></div>
            </div>
            <button class="gp-func-del" onclick="graphApp.removeFunction(${idx})">✕</button>
        `;
        list.appendChild(row);
        log(`Function slot f${idx + 1}(x) allocated [${COLOR_NAMES[idx % COLORS.length]}].`, 'info');
    }

    function removeFunction(idx) {
        if (functions.length <= 1) return;
        functions.splice(idx, 1);
        rebuildFuncList();
        drawAll();
        updateLegend();
        log(`Function slot removed. ${functions.length} active.`, 'info');
    }

    function rebuildFuncList() {
        const list = document.getElementById('funcList');
        list.innerHTML = '';
        functions.forEach((f, i) => {
            f.color = COLORS[i % COLORS.length];
            const row = document.createElement('div');
            row.className = 'gp-func-row';
            row.dataset.idx = i;
            const label = i === 0 ? 'f(x)=' : `f${i + 1}(x)=`;
            const delBtn = i === 0 && functions.length === 1 ? '' : `<button class="gp-func-del" onclick="graphApp.removeFunction(${i})">✕</button>`;
            row.innerHTML = `
                <div class="gp-func-color" style="color:${f.color}; background:${f.color};"></div>
                <div class="gp-func-input-wrap gp-clip-top gp-editing" data-idx="${i}">
                    <span class="gp-func-prefix">${label}</span>
                    <input type="text" class="gp-func-input" value="${f.expr}" placeholder="e.g. sin(x)" data-idx="${i}" autocomplete="off">
                    <div class="gp-func-katex-overlay" id="katex-overlay-${i}" style="display:none;"></div>
                </div>
                ${delBtn}
            `;
            list.appendChild(row);

            
            setTimeout(function() { showKatexOverlay(i); }, 50);
        });
    }

    function plot() {
        let success = 0;
        const inputs = document.querySelectorAll('.gp-func-input');
        inputs.forEach(function(inp) {
            const idx = parseInt(inp.dataset.idx);
            functions[idx].expr = inp.value;
        });

        functions.forEach(function(f, i) {
            if (!f.expr.trim()) { f.compiled = null; return; }
            const fn = compileMathExpr(f.expr);
            if (fn) {
                f.compiled = fn;
                success++;
                log(`f${i > 0 ? i + 1 : ''}(x) = ${f.expr} compiled. [${COLOR_NAMES[i % COLORS.length]}]`, 'success');
            } else {
                f.compiled = null;
                log(`f${i > 0 ? i + 1 : ''}(x) = "${f.expr}" — SYNTAX ERROR`, 'error');
            }

            
            showKatexOverlay(i);
        });

        if (success > 0) {
            setStatus('RENDERING', 'loading');
            drawAll();
            updateLegend();
            setStatus('PLOT ACTIVE', 'success');
            log(`Render complete. ${success} function(s) plotted.`, 'success');
        } else if (functions.some(f => f.expr.trim())) {
            setStatus('COMPILE ERROR', 'error');
        }
    }

    function updateLegend() {
        const legend = document.getElementById('gpLegend');
        legend.innerHTML = '';
        functions.forEach(function(f, i) {
            if (!f.expr.trim() || !f.compiled) return;
            const item = document.createElement('div');
            item.className = 'gp-legend-item';
            const latex = exprToLatex(f.expr);
            item.innerHTML = `<span class="gp-legend-dot" style="background:${f.color}; box-shadow: 0 0 6px ${f.color};"></span><span class="gp-legend-katex" id="legend-katex-${i}"></span>`;
            legend.appendChild(item);
            setTimeout(function() {
                const el = document.getElementById('legend-katex-' + i);
                if (el && typeof katex !== 'undefined') {
                    try { katex.render(latex, el, { throwOnError: false, displayMode: false }); }
                    catch (e) { el.textContent = f.expr; }
                }
            }, 50);
        });
    }

    function resetView() {
        viewX = -10; viewY = -7; viewW = 20;
        const w = parseFloat(canvas.style.width);
        const h = parseFloat(canvas.style.height);
        viewH = viewW / (w / h);
        drawAll();
        document.getElementById('zoomInfo').textContent = 'ZOOM: 1.0x';
        log('View reset to default range.', 'info');
    }

    
    function niceStep(roughStep) {
        const pow = Math.pow(10, Math.floor(Math.log10(roughStep)));
        const norm = roughStep / pow;
        let nice;
        if (norm <= 1) nice = 1;
        else if (norm <= 2) nice = 2;
        else if (norm <= 5) nice = 5;
        else nice = 10;
        return nice * pow;
    }

    function formatNum(n) {
        if (Math.abs(n) < 1e-10) return '0';
        if (Math.abs(n) >= 1000 || (Math.abs(n) < 0.01 && Math.abs(n) > 0)) return n.toExponential(1);
        const s = n.toFixed(6);
        return parseFloat(s).toString();
    }

    function setStatus(text, state) {
        const el = document.getElementById('gpStatus');
        if (!el) return;
        let icon = '●';
        let borderColor = 'rgba(0,255,65,0.3)';
        let textColor = '#4ade80';
        let shadow = 'rgba(0,255,65,0.2)';

        if (state === 'loading') {
            textColor = '#facc15'; borderColor = 'rgba(250,204,21,0.3)'; shadow = 'rgba(250,204,21,0.2)';
        } else if (state === 'error') {
            icon = '✖'; textColor = '#f43f5e'; borderColor = 'rgba(244,63,94,0.3)'; shadow = 'rgba(244,63,94,0.2)';
        }

        el.style.color = textColor;
        el.style.borderColor = borderColor;
        el.style.boxShadow = '0 0 10px ' + shadow;
        el.innerHTML = `<span class="${state !== 'error' ? 'gp-pulse' : ''}">${icon}</span> ${text}`;
    }

    function log(msg, type) {
        type = type || 'info';
        const term = document.getElementById('gpTerminal');
        if (!term) return;
        const div = document.createElement('div');
        div.className = 'gp-log-' + type;
        const time = new Date().toLocaleTimeString('en-US', { hour12: false });
        div.textContent = `[${time}] ${msg}`;
        term.appendChild(div);
        term.scrollTop = term.scrollHeight;
    }

    function debounce(fn, delay) {
        let timer;
        return function() {
            const args = arguments;
            clearTimeout(timer);
            timer = setTimeout(function() { fn.apply(null, args); }, delay);
        };
    }

    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        setTimeout(init, 100);
    }

    return { addFunction: addFunction, removeFunction: removeFunction, plot: plot, resetView: resetView };
})();
</script>
