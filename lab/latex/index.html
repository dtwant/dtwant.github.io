<script>
   
   
  (function() {
    const input = document.getElementById('latex-input');
    const preview = document.getElementById('latex-preview');
    const container = document.getElementById('latex-preview-container');
    const saveBtn = document.getElementById('save-btn');
    const badge = document.getElementById('resolution-badge');

    
    const manualControls = document.getElementById('manual-controls');
    const aspectControls = document.getElementById('aspect-controls');
    const sliderX = document.getElementById('slider-x');
    const sliderY = document.getElementById('slider-y');
    const valX = document.getElementById('val-x');
    const valY = document.getElementById('val-y');
    const sliderScale = document.getElementById('slider-scale');
    const valScale = document.getElementById('val-scale');

    
    const btnFree = document.getElementById('btn-free');
    const btnThumb = document.getElementById('btn-thumb');
    const btnSlide = document.getElementById('btn-slide');

    const OUTPUT_SCALE = 3;
    let currentAspect = null; 
    let preciseW = 0;
    let preciseH = 0;

    
    const statusEl = document.getElementById('lxStatus');
    function setStatus(text, color) {
      statusEl.innerHTML = '<span class="lx-pulse" style="color:' + color + '">●</span> ' + text;
    }

    

    const fitToContainer = () => {
      preview.style.transform = 'scale(1)';
      const containerWidth = container.clientWidth - 40;
      const contentWidth = preview.offsetWidth;
      
      if (contentWidth > containerWidth) {
        preview.style.transform = `scale(${containerWidth / contentWidth})`;
      } else {
        preview.style.transform = 'scale(1)';
      }
      setTimeout(updateResolution, 0);
    };

    const updateResolution = () => {
      const svgElement = preview.querySelector('svg');
      if (!svgElement) {
        badge.textContent = 'RENDERING...';
        return;
      }
      
      let finalW, finalH;
      
      if (currentAspect === null) {
        finalW = Math.round(preview.offsetWidth * OUTPUT_SCALE);
        finalH = Math.round(preview.offsetHeight * OUTPUT_SCALE);
      } else {
        finalW = Math.round(preciseW * OUTPUT_SCALE);
        finalH = Math.round(preciseH * OUTPUT_SCALE);
      }

      badge.textContent = `RES: ${finalW} x ${finalH} px`;
    };

    const applyPadding = () => {
      if (currentAspect === null) {
        const x = sliderX.value;
        const y = sliderY.value;
        valX.textContent = x;
        valY.textContent = y;
        preview.style.paddingLeft = x + "px";
        preview.style.paddingRight = x + "px";
        preview.style.paddingTop = y + "px";
        preview.style.paddingBottom = y + "px";
      } else {
        const svgElement = preview.querySelector('svg');
        if (!svgElement) return;

        const svgRect = svgElement.getBoundingClientRect();
        const parentScale = (preview.getBoundingClientRect().width / preview.offsetWidth) || 1;
        const w = svgRect.width / parentScale;
        const h = svgRect.height / parentScale;

        const scale = parseFloat(sliderScale.value);
        valScale.textContent = scale.toFixed(1) + "x";

        let baseW, baseH;
        if (w / h > currentAspect) {
          baseW = w;
          baseH = w / currentAspect;
        } else {
          baseH = h;
          baseW = h * currentAspect;
        }

        const targetW = baseW * scale;
        const targetH = baseH * scale;
        
        preciseW = targetW;
        preciseH = targetH;

        const px = Math.max(0, (targetW - w) / 2);
        const py = Math.max(0, (targetH - h) / 2);

        preview.style.paddingLeft = px + "px";
        preview.style.paddingRight = px + "px";
        preview.style.paddingTop = py + "px";
        preview.style.paddingBottom = py + "px";
      }
      fitToContainer();
    };

    const renderMath = () => {
      preview.innerHTML = '$$' + input.value + '$$';
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([preview]).then(() => {
          applyPadding();
          setStatus('RENDER COMPLETE', '#00ff41');
        }).catch(err => {
          console.log('MathJax typeset failed: ', err);
          setStatus('RENDER ERROR', '#ff0055');
        });
      }
    };

    const setMode = (mode, ratio) => {
      currentAspect = ratio;
      
      [btnFree, btnThumb, btnSlide].forEach(b => b.classList.remove('active'));
      
      if (mode === 'free') {
        btnFree.classList.add('active');
        manualControls.style.display = 'grid';
        aspectControls.style.display = 'none';
      } else {
        if (mode === 'thumb') btnThumb.classList.add('active');
        if (mode === 'slide') btnSlide.classList.add('active');
        manualControls.style.display = 'none';
        aspectControls.style.display = 'grid';
      }
      applyPadding();
    };

    
    input.addEventListener('input', renderMath);
    window.addEventListener('resize', fitToContainer);
    
    sliderX.addEventListener('input', applyPadding);
    sliderY.addEventListener('input', applyPadding);
    sliderScale.addEventListener('input', applyPadding);

    btnFree.addEventListener('click', () => setMode('free', null));
    btnThumb.addEventListener('click', () => setMode('thumb', 16/9));
    btnSlide.addEventListener('click', () => setMode('slide', 128/59));

    
    const init = () => {
      if (window.MathJax && window.MathJax.typesetPromise) {
        renderMath();
      } else {
        window.addEventListener('mathjax-ready', renderMath);
        const checkInterval = setInterval(() => {
          if (window.MathJax && window.MathJax.typesetPromise) {
            clearInterval(checkInterval);
            renderMath();
          }
        }, 500);
      }
    };

    init();

    
    saveBtn.addEventListener('click', () => {
      const svgElement = preview.querySelector('svg');
      if (!svgElement) {
        alert(">> ERROR: NO_RENDER_DATA");
        return;
      }

      let canvasW, canvasH;
      if (currentAspect === null) {
        canvasW = preview.offsetWidth * OUTPUT_SCALE;
        canvasH = preview.offsetHeight * OUTPUT_SCALE;
      } else {
        canvasW = preciseW * OUTPUT_SCALE;
        canvasH = preciseH * OUTPUT_SCALE;
      }

      const canvas = document.createElement('canvas');
      canvas.width = Math.round(canvasW);
      canvas.height = Math.round(canvasH);
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const svgRect = svgElement.getBoundingClientRect();
      const parentScale = (preview.getBoundingClientRect().width / preview.offsetWidth) || 1;
      const svgW = svgRect.width / parentScale;
      const svgH = svgRect.height / parentScale;

      const serializer = new XMLSerializer();
      const clonedSvg = svgElement.cloneNode(true);
      clonedSvg.setAttribute('width', svgW + "px");
      clonedSvg.setAttribute('height', svgH + "px");
      clonedSvg.style.color = "#000000";
      
      const svgString = serializer.serializeToString(clonedSvg);
      const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = function() {
        let dx, dy;
        const style = window.getComputedStyle(preview);
        
        if (currentAspect === null) {
           dx = (canvas.width - (svgW * OUTPUT_SCALE)) / 2;
           dy = (canvas.height - (svgH * OUTPUT_SCALE)) / 2;
        } else {
           dx = (canvas.width - (svgW * OUTPUT_SCALE)) / 2;
           dy = (canvas.height - (svgH * OUTPUT_SCALE)) / 2;
        }

        ctx.drawImage(img, dx, dy, svgW * OUTPUT_SCALE, svgH * OUTPUT_SCALE);
        URL.revokeObjectURL(url);
        
        try {
          const pngUrl = canvas.toDataURL("image/png");
          const downloadLink = document.createElement("a");
          downloadLink.href = pngUrl;
          downloadLink.download = "latex_formula.png";
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          setStatus('PNG EXPORTED', '#00ff41');
        } catch (e) {
          alert(">> ERROR: SAVE_FAILED");
          setStatus('EXPORT FAILED', '#ff0055');
        }
      };
      img.src = url;
    });

  })();
</script>
