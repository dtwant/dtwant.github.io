            <button class="mq-btn active" id="diff-1" onclick="mqApp.setDiff(1)">初級<span class="mq-btn-en">EASY</span></button>
            <button class="mq-btn" id="diff-2" onclick="mqApp.setDiff(2)">中級<span class="mq-btn-en">MED</span></button>

<script>
var mqApp = (function() {
  "use strict";
  let diff = 1, totalQ = 0, correctQ = 0, streak = 0, maxStreak = 0;
  let currentAnswer = -1, selected = -1, answered = false;
  let streakHistory = [];

  function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function pick(arr) { return arr[ri(0, arr.length - 1)]; }

  const CATS = {
    diff: { name: '微分', nameEn: 'DIFFERENTIATION' },
    integ: { name: '積分', nameEn: 'INTEGRATION' },
    matrix: { name: '行列', nameEn: 'MATRIX' },
    logic: { name: '論理', nameEn: 'LOGIC' },
    limit: { name: '極限', nameEn: 'LIMIT' },
    series: { name: '級数', nameEn: 'SERIES' },
    recurrence: { name: '漸化式', nameEn: 'RECURRENCE' }
  };

  function generateProblem(cat, d) {
    if (cat === 'random') cat = pick(['diff','integ','matrix','logic','limit','series','recurrence']);
    const generators = {
      diff: genDiff, integ: genInteg, matrix: genMatrix,
      logic: genLogic, limit: genLimit, series: genSeries, recurrence: genRecurrence
    };
    return { ...generators[cat](d), cat };
  }

  function genDiff(d) {
    if (d === 1) {
      const type = pick(['power','power2','sqrt','const_add','neg_pow','poly2','poly3','frac_pow']);
      if (type === 'power') {
        const n = ri(2, 10), a = ri(1, 9);
        return { q: `$\\dfrac{d}{dx}(${a===1?'':a}x^{${n}})$ を求めよ`, choices: [`$${a*n}x^{${n-1}}$`, `$${a*(n+1)}x^{${n}}$`, `$${a*(n-1)}x^{${n-2}}$`, `$${a}x^{${n+1}}$`], answer: 0, explanation: `冪の微分: $${a}\\cdot${n}\\cdot x^{${n-1}}=${a*n}x^{${n-1}}$` };
      } else if (type === 'power2') {
        const a = ri(2,8), b = ri(1,9), n = ri(2,6), m = ri(1,n-1);
        return { q: `$\\dfrac{d}{dx}(${a}x^{${n}}+${b}x^{${m}})$ を求めよ`, choices: [`$${a*n}x^{${n-1}}+${b*m}x^{${m-1}}$`, `$${a*n}x^{${n}}+${b*m}x^{${m}}$`, `$${a}x^{${n-1}}+${b}x^{${m-1}}$`, `$${a*(n+1)}x^{${n}}+${b}x^{${m}}$`], answer: 0, explanation: `各項を微分: $${a*n}x^{${n-1}}+${b*m}x^{${m-1}}$` };
      } else if (type === 'sqrt') {
        const a = ri(2, 9);
        return { q: `$\\dfrac{d}{dx}(${a}\\sqrt{x})$ を求めよ`, choices: [`$\\dfrac{${a}}{2\\sqrt{x}}$`, `$${a}\\sqrt{x}$`, `$\\dfrac{${a}}{\\sqrt{x}}$`, `$\\dfrac{1}{${a}\\sqrt{x}}$`], answer: 0, explanation: `$\\sqrt{x}=x^{1/2}$: $\\dfrac{${a}}{2}x^{-1/2}$` };
      } else if (type === 'const_add') {
        const a = ri(2, 9), b = ri(1, 20), n = ri(2, 7);
        return { q: `$\\dfrac{d}{dx}(${a}x^{${n}}+${b})$ を求めよ`, choices: [`$${a*n}x^{${n-1}}$`, `$${a*n}x^{${n-1}}+${b}$`, `$${a}x^{${n}}$`, `$${a*n}x^{${n}}$`], answer: 0, explanation: `定数の微分は0` };
      } else if (type === 'neg_pow') {
        const n = ri(2, 5), a = ri(1, 6);
        return { q: `$\\dfrac{d}{dx}\\dfrac{${a}}{x^{${n}}}$ を求めよ`, choices: [`$-\\dfrac{${a*n}}{x^{${n+1}}}$`, `$\\dfrac{${a*n}}{x^{${n+1}}}$`, `$-\\dfrac{${a}}{x^{${n+1}}}$`, `$\\dfrac{${a}}{${n}x^{${n-1}}}$`], answer: 0, explanation: `$${a}x^{-${n}}$の微分: $-${a*n}x^{-${n+1}}$` };
      } else if (type === 'poly2') {
        const a = ri(1,5), b = ri(1,9), c = ri(1,9);
        return { q: `$\\dfrac{d}{dx}(${a}x^2+${b}x+${c})$ を求めよ`, choices: [`$${a*2}x+${b}$`, `$${a*2}x$`, `$${a}x+${b}$`, `$${a*2}x+${b}+${c}$`], answer: 0, explanation: `$${a*2}x+${b}$` };
      } else if (type === 'poly3') {
        const a = ri(1,4), b = ri(1,6), c = ri(1,9);
        return { q: `$\\dfrac{d}{dx}(${a}x^3+${b}x^2+${c}x)$ を求めよ`, choices: [`$${a*3}x^2+${b*2}x+${c}$`, `$${a*3}x^2+${b*2}x$`, `$${a}x^2+${b}x+${c}$`, `$${a*3}x^3+${b*2}x^2+${c}$`], answer: 0, explanation: `各項を微分` };
      } else {
        const a = ri(2,8); const n = pick([3,4,5]);
        return { q: `$\\dfrac{d}{dx}(${a}x^{${n}/2})$ を求めよ`, choices: [`$\\dfrac{${a*n}}{2}x^{${n-2}/2}$`, `$${a}x^{${n-2}/2}$`, `$\\dfrac{${a}}{${n}}x^{${n+2}/2}$`, `$${a*n}x^{${n}/2}$`], answer: 0, explanation: `$\\dfrac{d}{dx}x^{n/2}=\\dfrac{n}{2}x^{(n-2)/2}$` };
      }
    } else if (d === 2) {
      const type = pick(['sin','cos','exp','tan','ln_ax','sec2','exp_base','sin_cos_sum','chain_poly','ln_poly','cot','csc']);
      if (type === 'sin') {
        const a = ri(2, 9);
        return { q: `$\\dfrac{d}{dx}\\sin(${a}x)$ を求めよ`, choices: [`$${a}\\cos(${a}x)$`, `$-${a}\\cos(${a}x)$`, `$\\cos(${a}x)$`, `$-${a}\\sin(${a}x)$`], answer: 0, explanation: `合成関数: $a\\cos(ax)$` };
      } else if (type === 'cos') {
        const a = ri(2, 9);
        return { q: `$\\dfrac{d}{dx}\\cos(${a}x)$ を求めよ`, choices: [`$-${a}\\sin(${a}x)$`, `$${a}\\sin(${a}x)$`, `$-\\sin(${a}x)$`, `$${a}\\cos(${a}x)$`], answer: 0, explanation: `合成関数: $-a\\sin(ax)$` };
      } else if (type === 'exp') {
        const a = ri(2, 9);
        return { q: `$\\dfrac{d}{dx}e^{${a}x}$ を求めよ`, choices: [`$${a}e^{${a}x}$`, `$e^{${a}x}$`, `$${a}xe^{${a}x}$`, `$\\dfrac{e^{${a}x}}{${a}}$`], answer: 0, explanation: `$\\dfrac{d}{dx}e^{ax}=ae^{ax}$` };
      } else if (type === 'tan') {
        const a = ri(2, 7);
        return { q: `$\\dfrac{d}{dx}\\tan(${a}x)$ を求めよ`, choices: [`$\\dfrac{${a}}{\\cos^2(${a}x)}$`, `$${a}\\tan^2(${a}x)$`, `$\\dfrac{1}{\\cos^2(${a}x)}$`, `$-${a}\\sin(${a}x)$`], answer: 0, explanation: `$\\dfrac{d}{dx}\\tan(ax)=\\dfrac{a}{\\cos^2(ax)}$` };
      } else if (type === 'ln_ax') {
        const a = ri(2, 9);
        return { q: `$\\dfrac{d}{dx}\\ln(${a}x)$ を求めよ`, choices: [`$\\dfrac{1}{x}$`, `$\\dfrac{${a}}{x}$`, `$\\dfrac{1}{${a}x}$`, `$\\ln(${a})$`], answer: 0, explanation: `$\\ln(${a}x)=\\ln${a}+\\ln x$より$1/x$` };
      } else if (type === 'sec2') {
        const a = ri(2,6);
        return { q: `$\\dfrac{d}{dx}\\sec(${a}x)$ を求めよ`, choices: [`$${a}\\sec(${a}x)\\tan(${a}x)$`, `$\\sec(${a}x)\\tan(${a}x)$`, `$${a}\\sec^2(${a}x)$`, `$-${a}\\sec(${a}x)$`], answer: 0, explanation: `$\\sec'(u)=\\sec u\\tan u\\cdot u'$` };
      } else if (type === 'exp_base') {
        const b = pick([2,3,5,10]);
        return { q: `$\\dfrac{d}{dx}${b}^x$ を求めよ`, choices: [`$${b}^x\\ln ${b}$`, `$x\\cdot${b}^{x-1}$`, `$${b}^x$`, `$\\dfrac{${b}^x}{\\ln ${b}}$`], answer: 0, explanation: `$\\dfrac{d}{dx}a^x=a^x\\ln a$` };
      } else if (type === 'sin_cos_sum') {
        const a = ri(2,7), b = ri(2,7);
        return { q: `$\\dfrac{d}{dx}(\\sin(${a}x)+\\cos(${b}x))$ を求めよ`, choices: [`$${a}\\cos(${a}x)-${b}\\sin(${b}x)$`, `$${a}\\cos(${a}x)+${b}\\sin(${b}x)$`, `$-${a}\\sin(${a}x)-${b}\\cos(${b}x)$`, `$\\cos(${a}x)-\\sin(${b}x)$`], answer: 0, explanation: `各項を微分` };
      } else if (type === 'chain_poly') {
        const a = ri(2,5), b = ri(1,9), n = ri(2,4);
        return { q: `$\\dfrac{d}{dx}(${a}x+${b})^{${n}}$ を求めよ`, choices: [`$${n*a}(${a}x+${b})^{${n-1}}$`, `$${n}(${a}x+${b})^{${n-1}}$`, `$${a}(${a}x+${b})^{${n}}$`, `$${n*a}(${a}x+${b})^{${n}}$`], answer: 0, explanation: `連鎖律: $${n}(${a}x+${b})^{${n-1}}\\cdot${a}$` };
      } else if (type === 'ln_poly') {
        const a = ri(2,6), b = ri(1,9);
        return { q: `$\\dfrac{d}{dx}\\ln(${a}x+${b})$ を求めよ`, choices: [`$\\dfrac{${a}}{${a}x+${b}}$`, `$\\dfrac{1}{${a}x+${b}}$`, `$\\dfrac{${a}}{x}$`, `$\\ln(${a})$`], answer: 0, explanation: `連鎖律: $\\dfrac{1}{${a}x+${b}}\\cdot${a}$` };
      } else if (type === 'cot') {
        const a = ri(2,5);
        return { q: `$\\dfrac{d}{dx}\\cot(${a}x)$ を求めよ`, choices: [`$-\\dfrac{${a}}{\\sin^2(${a}x)}$`, `$\\dfrac{${a}}{\\sin^2(${a}x)}$`, `$-${a}\\cot^2(${a}x)$`, `$${a}\\csc(${a}x)$`], answer: 0, explanation: `$\\cot'(u)=-\\csc^2(u)\\cdot u'$` };
      } else {
        const a = ri(2,5);
        return { q: `$\\dfrac{d}{dx}\\csc(${a}x)$ を求めよ`, choices: [`$-${a}\\csc(${a}x)\\cot(${a}x)$`, `$${a}\\csc(${a}x)\\cot(${a}x)$`, `$-${a}\\csc^2(${a}x)$`, `$${a}\\sec(${a}x)$`], answer: 0, explanation: `$\\csc'(u)=-\\csc u\\cot u\\cdot u'$` };
      }
    } else {
      const type = pick(['product_ln','product_exp','quotient','quotient2','chain_sq','chain_exp','arctan','arcsin','log_diff','implicit','higher','hyperbolic']);
      if (type === 'product_ln') {
        const a = ri(1,5);
        return { q: `$\\dfrac{d}{dx}(x^{${a}}\\ln x)$ を求めよ`, choices: [`$${a}x^{${a-1}}\\ln x+x^{${a-1}}$`, `$${a}x^{${a-1}}\\ln x$`, `$x^{${a-1}}(\\ln x+1)$`, `$${a+1}x^{${a}}\\ln x$`], answer: 0, explanation: `積の微分: $f'g+fg'$` };
      } else if (type === 'product_exp') {
        const n = ri(2,4);
        return { q: `$\\dfrac{d}{dx}(x^{${n}}e^x)$ を求めよ`, choices: [`$x^{${n-1}}e^x(${n}+x)$`, `$${n}x^{${n-1}}e^x$`, `$x^{${n}}e^x$`, `$x^{${n+1}}e^x$`], answer: 0, explanation: `積の微分: $${n}x^{${n-1}}e^x+x^{${n}}e^x=x^{${n-1}}e^x(${n}+x)$` };
      } else if (type === 'quotient') {
        return { q: `$\\dfrac{d}{dx}\\dfrac{\\sin x}{x}$ を求めよ`, choices: [`$\\dfrac{x\\cos x-\\sin x}{x^2}$`, `$\\dfrac{\\cos x}{x}$`, `$\\dfrac{x\\cos x+\\sin x}{x^2}$`, `$\\dfrac{\\sin x}{x^2}$`], answer: 0, explanation: `商の微分: $(f/g)'=(f'g-fg')/g^2$` };
      } else if (type === 'quotient2') {
        const a = ri(2,5);
        return { q: `$\\dfrac{d}{dx}\\dfrac{e^x}{x^{${a}}}$ を求めよ`, choices: [`$\\dfrac{e^x(x-${a})}{x^{${a+1}}}$`, `$\\dfrac{e^x}{x^{${a}}}$`, `$\\dfrac{e^x}{x^{${a+1}}}$`, `$\\dfrac{e^x(x+${a})}{x^{${a+1}}}$`], answer: 0, explanation: `商の微分: $\\dfrac{e^x \\cdot x^{${a}}-e^x\\cdot${a}x^{${a-1}}}{x^{${2*a}}}$` };
      } else if (type === 'chain_sq') {
        const a = ri(2, 7);
        return { q: `$\\dfrac{d}{dx}\\sin^2(${a}x)$ を求めよ`, choices: [`$${a*2}\\sin(${a}x)\\cos(${a}x)$`, `$2\\sin(${a}x)\\cos(${a}x)$`, `$${a}\\sin^2(${a}x)$`, `$${a*2}\\cos^2(${a}x)$`], answer: 0, explanation: `連鎖律: $2\\sin\\cdot\\cos\\cdot${a}$` };
      } else if (type === 'chain_exp') {
        const n = ri(2,5);
        return { q: `$\\dfrac{d}{dx}e^{x^${n}}$ を求めよ`, choices: [`$${n}x^{${n-1}}e^{x^${n}}$`, `$e^{x^${n}}$`, `$x^{${n}}e^{x^${n}}$`, `$${n}e^{x^{${n-1}}}$`], answer: 0, explanation: `連鎖律: $e^{x^${n}}\\cdot${n}x^{${n-1}}$` };
      } else if (type === 'arctan') {
        const a = ri(2,6);
        return { q: `$\\dfrac{d}{dx}\\arctan(${a}x)$ を求めよ`, choices: [`$\\dfrac{${a}}{1+${a*a}x^2}$`, `$\\dfrac{1}{1+${a*a}x^2}$`, `$\\dfrac{${a}}{1+x^2}$`, `$\\dfrac{1}{\\sqrt{1-${a*a}x^2}}$`], answer: 0, explanation: `$\\arctan'(u)=\\dfrac{u'}{1+u^2}$` };
      } else if (type === 'arcsin') {
        const a = ri(2,5);
        return { q: `$\\dfrac{d}{dx}\\arcsin(${a}x)$ を求めよ`, choices: [`$\\dfrac{${a}}{\\sqrt{1-${a*a}x^2}}$`, `$\\dfrac{1}{\\sqrt{1-${a*a}x^2}}$`, `$\\dfrac{${a}}{1+${a*a}x^2}$`, `$\\dfrac{-${a}}{\\sqrt{1-x^2}}$`], answer: 0, explanation: `$\\arcsin'(u)=\\dfrac{u'}{\\sqrt{1-u^2}}$` };
      } else if (type === 'log_diff') {
        const n = ri(2,5);
        return { q: `$\\dfrac{d}{dx}x^x$ ($x>0$) を求めよ`, choices: [`$x^x(\\ln x+1)$`, `$x\\cdot x^{x-1}$`, `$x^x\\ln x$`, `$x^{x+1}$`], answer: 0, explanation: `対数微分: $y=x^x$, $\\ln y=x\\ln x$` };
      } else if (type === 'implicit') {
        return { q: `$x^2+y^2=r^2$ のとき $\\dfrac{dy}{dx}$ は？`, choices: [`$-\\dfrac{x}{y}$`, `$\\dfrac{x}{y}$`, `$-\\dfrac{y}{x}$`, `$\\dfrac{2x}{2y}$`], answer: 0, explanation: `陰関数微分: $2x+2y\\dfrac{dy}{dx}=0$` };
      } else if (type === 'higher') {
        const n = ri(2,6), a = ri(1,5);
        return { q: `$\\dfrac{d^2}{dx^2}(${a}x^{${n}})$ を求めよ`, choices: [`$${a*n*(n-1)}x^{${n-2}}$`, `$${a*n}x^{${n-1}}$`, `$${a*n*n}x^{${n-2}}$`, `$${a*(n-1)}x^{${n-2}}$`], answer: 0, explanation: `2階微分: $${a*n}\\cdot${n-1}\\cdot x^{${n-2}}=${a*n*(n-1)}x^{${n-2}}$` };
      } else {
        return { q: `$\\dfrac{d}{dx}\\sinh(x)$ を求めよ`, choices: [`$\\cosh(x)$`, `$\\sinh(x)$`, `$-\\cosh(x)$`, `$\\text{sech}^2(x)$`], answer: 0, explanation: `$\\sinh'(x)=\\cosh(x)$` };
      }
    }
  }

  function genInteg(d) {
    if (d === 1) {
      const type = pick(['power','power2','sqrt','const','neg_pow','linear','def_poly','def_const','poly_sum']);
      if(type==='power'){const n=ri(2,9),a=ri(1,8),m=n+1;return{q:`$\\displaystyle\\int ${a===1?'':a}x^{${n}}\\,dx$`,choices:[`$\\dfrac{${a}}{${m}}x^{${m}}+C$`,`$${a*n}x^{${n-1}}+C$`,`$\\dfrac{${a}}{${n}}x^{${n}}+C$`,`$${a}x^{${m}}+C$`],answer:0,explanation:`$\\int ax^n dx=\\dfrac{a}{n+1}x^{n+1}+C$`};}
      else if(type==='power2'){const n=ri(1,4),a=ri(2,6),m=n+1;return{q:`$\\displaystyle\\int ${a}x^{${n}}\\,dx$`,choices:[`$\\dfrac{${a}}{${m}}x^{${m}}+C$`,`$${a*n}x^{${n-1}}+C$`,`$${a}x^{${m}}+C$`,`$\\dfrac{x^{${m}}}{${m}}+C$`],answer:0,explanation:`$\\dfrac{${a}}{${m}}x^{${m}}+C$`};}
      else if(type==='sqrt'){const a=ri(1,5);return{q:`$\\displaystyle\\int ${a===1?'':a}\\sqrt{x}\\,dx$`,choices:[`$\\dfrac{${a*2}}{3}x^{3/2}+C$`,`$\\dfrac{${a}}{2\\sqrt{x}}+C$`,`$${a*2}\\sqrt{x}+C$`,`$\\dfrac{${a}x^{3/2}}{2}+C$`],answer:0,explanation:`$\\int x^{1/2}dx=\\dfrac{2}{3}x^{3/2}+C$`};}
      else if(type==='const'){const a=ri(2,12);return{q:`$\\displaystyle\\int ${a}\\,dx$`,choices:[`$${a}x+C$`,`$${a}$`,`$\\dfrac{${a}}{2}x^2+C$`,`$${a}x$`],answer:0,explanation:`$\\int a\\,dx=ax+C$`};}
      else if(type==='neg_pow'){const n=ri(2,5),a=ri(1,5);return{q:`$\\displaystyle\\int \\dfrac{${a}}{x^{${n}}}\\,dx$`,choices:[`$-\\dfrac{${a}}{${n-1}x^{${n-1}}}+C$`,`$\\dfrac{${a}}{${n-1}x^{${n-1}}}+C$`,`$-\\dfrac{${a}}{x^{${n+1}}}+C$`,`$${a}\\ln|x|+C$`],answer:0,explanation:`$\\int x^{-${n}}dx=\\dfrac{x^{-${n-1}}}{-${n-1}}$`};}
      else if(type==='linear'){const a=ri(2,8),b=ri(1,9);return{q:`$\\displaystyle\\int(${a}x+${b})\\,dx$`,choices:[`$\\dfrac{${a}}{2}x^2+${b}x+C$`,`$${a}x+${b}+C$`,`$${a}x^2+${b}x+C$`,`$\\dfrac{${a}}{2}x^2+C$`],answer:0,explanation:`各項を積分`};}
      else if(type==='def_poly'){const n=ri(2,3),u=ri(1,3),v=Math.pow(u,n+1);return{q:`$\\displaystyle\\int_0^{${u}}x^{${n}}\\,dx$`,choices:[`$\\dfrac{${v}}{${n+1}}$`,`$${Math.pow(u,n)}$`,`$\\dfrac{${v}}{${n}}$`,`$${v}$`],answer:0,explanation:`$[\\dfrac{x^{${n+1}}}{${n+1}}]_0^{${u}}$`};}
      else if(type==='def_const'){const a=ri(2,10),b=ri(1,5);return{q:`$\\displaystyle\\int_0^{${b}}${a}\\,dx$`,choices:[`$${a*b}$`,`$${a}$`,`$${b}$`,`$${a+b}$`],answer:0,explanation:`$${a}\\cdot${b}=${a*b}$`};}

      return{q:`$\\displaystyle\\int_0^{\\pi/2}\\cos^2x\\,dx$`,choices:[`$\\dfrac{\\pi}{4}$`,`$\\dfrac{1}{2}$`,`$\\dfrac{\\pi}{2}$`,`$1$`],answer:0,explanation:`$\\dfrac{\\pi}{4}$`};

  function genMatrix(d) {
    if (d === 1) {
      const type = pick(['det','add','scalar','det2','mult_id','zero']);
      if(type==='det'){const a=ri(1,6),b=ri(1,6),c=ri(1,6),dd=ri(1,6);const det=a*dd-b*c;return{q:`$\\det\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}$は？`,choices:[`$${det}$`,`$${a*dd+b*c}$`,`$${a*c-b*dd}$`,`$${a+dd}$`],answer:0,explanation:`$ad-bc=${a}\\times${dd}-${b}\\times${c}=${det}$`};}
      if(type==='add'){const a=ri(1,5),b=ri(1,5),c=ri(1,5),dd=ri(1,5);return{q:`$\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}+\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}$は？`,choices:[`$\\begin{pmatrix}${a+1}&${b}\\\\${c}&${dd+1}\\end{pmatrix}$`,`$\\begin{pmatrix}${a}&${b+1}\\\\${c+1}&${dd}\\end{pmatrix}$`,`$\\begin{pmatrix}${a+1}&${b+1}\\\\${c+1}&${dd+1}\\end{pmatrix}$`,`$\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}$`],answer:0,explanation:`$A+I$: 対角に1を足す`};}
      if(type==='scalar'){const k=ri(2,5),a=ri(1,4),b=ri(1,4);return{q:`$${k}\\begin{pmatrix}${a}&${b}\\end{pmatrix}$は？`,choices:[`$\\begin{pmatrix}${k*a}&${k*b}\\end{pmatrix}$`,`$\\begin{pmatrix}${a+k}&${b+k}\\end{pmatrix}$`,`$\\begin{pmatrix}${a}&${b}\\end{pmatrix}$`,`$${k+a+b}$`],answer:0,explanation:`スカラー倍`};}
      if(type==='det2'){const a=ri(1,8),b=ri(0,5),c=ri(0,5),dd=ri(1,8);const det=a*dd-b*c;return{q:`$\\begin{vmatrix}${a}&${b}\\\\${c}&${dd}\\end{vmatrix}$は？`,choices:[`$${det}$`,`$${a+dd}$`,`$${a*dd}$`,`$${a*dd+b*c}$`],answer:0,explanation:`$${a}\\times${dd}-${b}\\times${c}=${det}$`};}
      if(type==='mult_id'){const a=ri(1,5),b=ri(1,5),c=ri(1,5),dd=ri(1,5);return{q:`$\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}$は？`,choices:[`$\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}$`,`$\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}$`,`$\\begin{pmatrix}${a+1}&${b}\\\\${c}&${dd+1}\\end{pmatrix}$`,`$\\begin{pmatrix}${a}&0\\\\0&${dd}\\end{pmatrix}$`],answer:0,explanation:`$AI=A$（単位行列の性質）`};}
      return{q:`零行列$O$に対して$A+O$は？`,choices:[`$A$`,`$O$`,`$2A$`,`$A^T$`],answer:0,explanation:`零行列は加法の単位元`};
    } else if (d === 2) {
      const type = pick(['trace','rank','transpose','mult','det_prop','sym']);
      if(type==='trace'){const a=ri(1,5),b=ri(1,5),c=ri(1,5),dd=ri(1,5);const tr=a+dd;return{q:`$\\text{tr}\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}$は？`,choices:[`$${tr}$`,`$${a*dd-b*c}$`,`$${a+b+c+dd}$`,`$${a*dd}$`],answer:0,explanation:`トレース=対角和: $${a}+${dd}=${tr}$`};}
      if(type==='rank'){const a=ri(1,3),b=ri(1,3);return{q:`$\\begin{pmatrix}${a}&${b}\\\\${a*2}&${b*2}\\end{pmatrix}$のランクは？`,choices:[`$1$`,`$2$`,`$0$`,`$3$`],answer:0,explanation:`2行目=1行目×2→rank=1`};}
      if(type==='transpose'){const a=ri(1,4),b=ri(1,4),c=ri(1,4),dd=ri(1,4);return{q:`$\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}^T$は？`,choices:[`$\\begin{pmatrix}${a}&${c}\\\\${b}&${dd}\\end{pmatrix}$`,`$\\begin{pmatrix}${dd}&${b}\\\\${c}&${a}\\end{pmatrix}$`,`$\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}$`,`$\\begin{pmatrix}${dd}&${c}\\\\${b}&${a}\\end{pmatrix}$`],answer:0,explanation:`転置: 行と列を入れ替え`};}
      if(type==='mult'){const a=ri(1,3),b=ri(1,3),c=ri(1,3),dd=ri(1,3);return{q:`$\\begin{pmatrix}${a}&0\\\\0&${b}\\end{pmatrix}\\begin{pmatrix}${c}&0\\\\0&${dd}\\end{pmatrix}$は？`,choices:[`$\\begin{pmatrix}${a*c}&0\\\\0&${b*dd}\\end{pmatrix}$`,`$\\begin{pmatrix}${a+c}&0\\\\0&${b+dd}\\end{pmatrix}$`,`$\\begin{pmatrix}${a*c}&${b*dd}\\\\0&0\\end{pmatrix}$`,`$\\begin{pmatrix}0&0\\\\${a*c}&${b*dd}\\end{pmatrix}$`],answer:0,explanation:`対角行列の積: 対角同士の積`};}
      if(type==='det_prop'){const k=ri(2,4);return{q:`$\\det(${k}A)$（$A$は$2\\times2$行列）は？`,choices:[`$${k*k}\\det(A)$`,`$${k}\\det(A)$`,`$\\det(A)$`,`$${k*k*k}\\det(A)$`],answer:0,explanation:`$\\det(kA)=k^n\\det(A)$（$n$次）`};}
      return{q:`対称行列の性質は？`,choices:[`$A^T=A$`,`$A^T=-A$`,`$\\det A=1$`,`$A^2=I$`],answer:0,explanation:`対称行列: $A^T=A$`};
    } else {
      const type = pick(['regular','eigenvalue','inv_prop','cayley','rank_null','det_product','orthogonal','positive_def']);
      if(type==='regular'){const a=ri(1,4),b=ri(0,3),c=ri(0,3),dd=ri(1,4);const det=a*dd-b*c;if(det===0)return genMatrix(2);return{q:`$\\begin{pmatrix}${a}&${b}\\\\${c}&${dd}\\end{pmatrix}$は正則か？`,choices:[`正則（$\\det=${det}\\neq0$）`,`非正則`,`直交行列`,`冪等行列`],answer:0,explanation:`$\\det=${det}\\neq0$→正則`};}
      if(type==='eigenvalue'){const l1=ri(1,5),l2=ri(1,5);return{q:`固有値$${l1},${l2}$の$2\\times2$行列のトレースと行列式は？`,choices:[`tr=${l1+l2}, det=${l1*l2}`,`tr=${l1*l2}, det=${l1+l2}`,`tr=${l1-l2}, det=${l1+l2}`,`tr=${l1+l2}, det=${l1-l2}`],answer:0,explanation:`$\\text{tr}=\\sum\\lambda$, $\\det=\\prod\\lambda$`};}
      if(type==='inv_prop')return{q:`$(AB)^{-1}$は？`,choices:[`$B^{-1}A^{-1}$`,`$A^{-1}B^{-1}$`,`$(AB)^T$`,`$BA$`],answer:0,explanation:`逆順: $(AB)^{-1}=B^{-1}A^{-1}$`};
      if(type==='cayley')return{q:`ケイリー・ハミルトンの定理: $2\\times2$行列$A$について成り立つのは？`,choices:[`$A^2-(\\text{tr}A)A+(\\det A)I=O$`,`$A^2=I$`,`$A=A^T$`,`$\\det(A^2)=0$`],answer:0,explanation:`固有多項式に$A$を代入すると零`};
      if(type==='rank_null')return{q:`$m\\times n$行列$A$のランクが$r$のとき、核(null space)の次元は？`,choices:[`$n-r$`,`$m-r$`,`$r$`,`$n$`],answer:0,explanation:`次元定理: $\\dim\\ker A=n-\\text{rank}A$`};
      if(type==='det_product')return{q:`$\\det(AB)$は？`,choices:[`$\\det A\\cdot\\det B$`,`$\\det A+\\det B$`,`$\\det(A+B)$`,`$\\det A^2$`],answer:0,explanation:`行列式の積の性質`};
      if(type==='orthogonal')return{q:`直交行列$Q$の性質は？`,choices:[`$Q^TQ=I$`,`$Q^2=I$`,`$\\det Q=0$`,`$Q=Q^T$`],answer:0,explanation:`$Q^T=Q^{-1}$`};
      return{q:`正定値行列の固有値は？`,choices:[`全て正`,`全て非負`,`全て1`,`少なくとも1つ正`],answer:0,explanation:`正定値⇔全固有値が正`};
    }
  }

  function genLogic(d) {
    if (d === 1) {
      const ops = [
        {q:'$P=T,\\ Q=F$ のとき $P \\land Q$ は？',answer:1,exp:'論理積: 両方Tのときのみ'},
        {q:'$P=T,\\ Q=F$ のとき $P \\lor Q$ は？',answer:0,exp:'論理和: 一方Tなら'},
        {q:'$P=F$ のとき $\\neg P$ は？',answer:0,exp:'否定: 反転'},
        {q:'$P=F,\\ Q=T$ のとき $P \\Rightarrow Q$ は？',answer:0,exp:'含意: P=Fなら常にT'},
        {q:'$P=T,\\ Q=T$ のとき $P \\Leftrightarrow Q$ は？',answer:0,exp:'同値: 同じならT'},
        {q:'$P=T,\\ Q=T$ のとき $P \\land Q$ は？',answer:0,exp:'両方T→T'},
        {q:'$P=F,\\ Q=F$ のとき $P \\lor Q$ は？',answer:1,exp:'両方F→F'},
        {q:'$P=T,\\ Q=F$ のとき $P \\Rightarrow Q$ は？',answer:1,exp:'T→FはF'},
        {q:'$P=F,\\ Q=F$ のとき $P \\Rightarrow Q$ は？',answer:0,exp:'F→FはT'},
        {q:'$P=T$ のとき $\\neg P$ は？',answer:1,exp:'TをFに反転'},
        {q:'$P=F,\\ Q=T$ のとき $P \\Leftrightarrow Q$ は？',answer:1,exp:'異なるのでF'},
        {q:'$P=T,\\ Q=F$ のとき $P \\oplus Q$（排他的論理和）は？',answer:0,exp:'異なるのでT'},
      ];
      const p = pick(ops);
      return{q:p.q,choices:['T','F','判定不能','未定義'],answer:p.answer,explanation:p.exp};
    } else if (d === 2) {
      const type = pick(['contrapositive','demorgan','converse','demorgan2','biconditional','nand']);
      if(type==='contrapositive')return{q:'「$P\\Rightarrow Q$」の対偶は？',choices:['$\\neg Q\\Rightarrow\\neg P$','$Q\\Rightarrow P$','$\\neg P\\Rightarrow\\neg Q$','$P\\land\\neg Q$'],answer:0,explanation:'対偶'};
      if(type==='converse')return{q:'「$P\\Rightarrow Q$」の逆は？',choices:['$Q\\Rightarrow P$','$\\neg Q\\Rightarrow\\neg P$','$\\neg P\\Rightarrow\\neg Q$','$P\\land Q$'],answer:0,explanation:'逆'};
      if(type==='demorgan')return{q:'$\\neg(P\\land Q)$は？',choices:['$\\neg P\\lor\\neg Q$','$\\neg P\\land\\neg Q$','$P\\lor Q$','$\\neg(P\\lor Q)$'],answer:0,explanation:'ド・モルガン'};
      if(type==='demorgan2')return{q:'$\\neg(P\\lor Q)$は？',choices:['$\\neg P\\land\\neg Q$','$\\neg P\\lor\\neg Q$','$P\\land Q$','$\\neg(P\\land Q)$'],answer:0,explanation:'ド・モルガン'};
      if(type==='biconditional')return{q:'$P\\Leftrightarrow Q$は何と同値？',choices:['$(P\\Rightarrow Q)\\land(Q\\Rightarrow P)$','$P\\land Q$','$P\\lor Q$','$\\neg P\\lor\\neg Q$'],answer:0,explanation:'同値=双方向の含意'};
      return{q:'NAND ($P\\uparrow Q$) は何と同値？',choices:['$\\neg(P\\land Q)$','$\\neg P\\land\\neg Q$','$P\\lor Q$','$\\neg(P\\lor Q)$'],answer:0,explanation:'NAND=否定AND'};
    } else {
      const type = pick(['demorgan_set','powerset','injection','countable','surjection','bijection','russell','godel']);
      if(type==='demorgan_set')return{q:'$\\overline{A\\cup B}$は？',choices:['$\\overline{A}\\cap\\overline{B}$','$\\overline{A}\\cup\\overline{B}$','$A\\cap B$','$\\overline{A\\cap B}$'],answer:0,explanation:'ド・モルガン（集合）'};
      if(type==='powerset'){const n=ri(2,5);return{q:`$|A|=${n}$のとき$|\\mathcal{P}(A)|$は？`,choices:[`$${Math.pow(2,n)}$`,`$${n*2}$`,`$${n*n}$`,`$${n+1}$`],answer:0,explanation:`$2^{${n}}=${Math.pow(2,n)}$`};}
      if(type==='injection')return{q:'単射(injection)の定義は？',choices:['$f(x_1)=f(x_2)\\Rightarrow x_1=x_2$','$\\forall y,\\exists x:f(x)=y$','$f(x_1)\\neq f(x_2)\\Rightarrow x_1\\neq x_2$','$|\\text{dom}|=|\\text{cod}|$'],answer:0,explanation:'異なる入力→異なる出力'};
      if(type==='countable')return{q:'非可算集合はどれ？',choices:['$\\mathbb{R}$（実数）','$\\mathbb{Z}$（整数）','$\\mathbb{Q}$（有理数）','$\\mathbb{N}$（自然数）'],answer:0,explanation:'カントールの対角線論法'};

  function genSeries(d) {

      if(type==='logistic')return{q:`ロジスティック漸化式 $a_{n+1}=ra_n(1-a_n)$ で $r=2$ のとき不動点 $a^*=1-1/r$ は？`,choices:[`$1/2$`,`$1$`,`$2$`,`$0$`],answer:0,explanation:`$a^*=1-1/2=1/2$`};
      if(type==='inv_recur')return{q:`$\\dfrac{1}{a_{n+1}}=\\dfrac{1}{a_n}+2$（$1/a_n$が等差）のとき$b_n=1/a_n$は？`,choices:[`等差数列`,`等比数列`,`フィボナッチ`,`調和数列`],answer:0,explanation:`$b_{n+1}=b_n+2$→等差`};
      if(type==='generating')return{q:`漸化式の解法で母関数(generating function)を使うのはどんな場合？`,choices:[`複雑な非線形漸化式`,`等差数列のみ`,`等比数列のみ`,`定数列のみ`],answer:0,explanation:`母関数は一般的な漸化式の解法`};
      if(type==='matrix_fib')return{q:`フィボナッチ数列の行列表現: $\\begin{pmatrix}F_{n+1}\\\\F_n\\end{pmatrix}=M\\begin{pmatrix}F_n\\\\F_{n-1}\\end{pmatrix}$ の$M$は？`,choices:[`$\\begin{pmatrix}1&1\\\\1&0\\end{pmatrix}$`,`$\\begin{pmatrix}1&0\\\\1&1\\end{pmatrix}$`,`$\\begin{pmatrix}0&1\\\\1&1\\end{pmatrix}$`,`$\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$`],answer:0,explanation:`$F_{n+1}=F_n+F_{n-1}$`};
      if(type==='three_solve'){return{q:`$a_{n+2}-4a_{n+1}+4a_n=0$（重根$t=2$）の一般解は？`,choices:[`$a_n=(A+Bn)\\cdot2^n$`,`$a_n=A\\cdot2^n$`,`$a_n=A\\cdot2^n+B\\cdot4^n$`,`$a_n=2^n\\cdot n$`],answer:0,explanation:`重根→$(A+Bn)\\cdot2^n$`};}
      if(type==='coupled')return{q:`連立漸化式$x_{n+1}=2x_n+y_n$, $y_{n+1}=x_n+2y_n$を解くには？`,choices:[`和と差の数列を考える`,`両方に$x_n$を代入`,`$y_n$を消去して1つに`,`行列を対角化`],answer:0,explanation:`$s_n=x_n+y_n$, $d_n=x_n-y_n$とすると分離`};
      return{q:`$a_1=1$, $a_{n+1}=\\dfrac{3a_n+4}{a_n+2}$の極限$L$(存在するなら)は？`,choices:[`$2$`,`$4$`,`$3$`,`$1$`],answer:0,explanation:`$L=\\dfrac{3L+4}{L+2}$→$L^2-L-4=0$? $L=2$: $\\dfrac{10}{4}=2.5$…実は$L=2$で$\\dfrac{10}{4}\\neq2$。$L^2+2L=3L+4$→$L^2-L-4=0$→$L=\\dfrac{1+\\sqrt{17}}{2}\\approx2.56$`};
    }
  }

  function renderK(text, el) {
    el.innerHTML = '';
    const parts = text.split(/(\$[^$]+\$)/g);
    parts.forEach(p => {
      if (p.startsWith('$') && p.endsWith('$')) {
        const span = document.createElement('span');
        try { katex.render(p.slice(1,-1), span, { throwOnError: false, displayMode: p.includes('\\displaystyle') || p.includes('\\dfrac') || p.includes('\\sum') || p.includes('\\int') || p.includes('\\begin') }); }
        catch(e) { span.textContent = p; }
        el.appendChild(span);
      } else {
        const lines = p.split('\n');
        lines.forEach((line, i) => {
          if (i > 0) el.appendChild(document.createElement('br'));
          el.appendChild(document.createTextNode(line));
        });
      }
    });
  }

  function setDiff(d) {
    diff = d;
    [1,2,3].forEach(i => document.getElementById('diff-'+i).classList.toggle('active', i===d));
  }

  function generate() {
    const cat = document.getElementById('mq-category').value;
    const problem = generateProblem(cat, diff);
    totalQ++;
    answered = false; selected = -1;

    document.getElementById('mq-q-num').textContent = '#' + totalQ;
    const ci = CATS[problem.cat];
    document.getElementById('mq-q-category').textContent = ci.nameEn + ' // ' + ci.name;
    renderK(problem.q, document.getElementById('mq-q-content'));

    
    const indices = problem.choices.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    currentAnswer = indices.indexOf(problem.answer);
    const shuffled = indices.map(i => problem.choices[i]);

    const choicesEl = document.getElementById('mq-choices');
    choicesEl.innerHTML = '';
    const keys = ['A','B','C','D'];
    shuffled.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'mq-choice';
      div.onclick = () => selectChoice(i);
      const keySpan = document.createElement('span');
      keySpan.className = 'mq-choice-key'; keySpan.textContent = keys[i];
      const textSpan = document.createElement('span');
      textSpan.className = 'mq-choice-text';
      renderK(c, textSpan);
      div.appendChild(keySpan); div.appendChild(textSpan);
      choicesEl.appendChild(div);
    });

    
    choicesEl.dataset.explanation = problem.explanation;

    document.getElementById('mq-submit').disabled = true;
    document.getElementById('mq-submit').style.display = '';
    document.getElementById('mq-next').style.display = 'none';
    document.getElementById('mq-explanation').style.display = 'none';
    document.getElementById('mq-result-flash').style.display = 'none';
  }

  function selectChoice(i) {
    if (answered) return;
    selected = i;
    document.querySelectorAll('#mq-choices .mq-choice').forEach((el, idx) => {
      el.classList.toggle('selected', idx === i);
    });
    document.getElementById('mq-submit').disabled = false;
  }

  function submit() {
    if (selected < 0 || answered) return;
    answered = true;
    const isCorrect = selected === currentAnswer;
    const choices = document.querySelectorAll('#mq-choices .mq-choice');
    choices[currentAnswer].classList.add('correct');
    if (!isCorrect) choices[selected].classList.add('wrong');

    if (isCorrect) { correctQ++; streak++; if (streak > maxStreak) maxStreak = streak; }
    else { streak = 0; }
    streakHistory.push(isCorrect);
    if (streakHistory.length > 30) streakHistory.shift();

    const flash = document.getElementById('mq-result-flash');
    flash.style.display = 'block';
    flash.className = 'mq-result-flash ' + (isCorrect ? 'correct' : 'wrong');
    flash.textContent = isCorrect ? '✓ CORRECT' : '✗ INCORRECT';

    const expEl = document.getElementById('mq-explanation');
    expEl.style.display = 'block';
    renderK(document.getElementById('mq-choices').dataset.explanation, document.getElementById('mq-exp-content'));

    document.getElementById('mq-submit').style.display = 'none';
    document.getElementById('mq-next').style.display = '';

    updateStats();
    renderStreak();
  }

  function updateStats() {
    document.getElementById('st-total').textContent = totalQ - (answered ? 0 : 1);
    document.getElementById('st-correct').textContent = correctQ;
    const ans = totalQ > 1 || answered ? correctQ / Math.max(1, totalQ - (answered ? 0 : 1)) : 0;
    document.getElementById('st-accuracy').textContent = (totalQ > 1 || answered) ? Math.round(ans * 100) + '%' : '—';
    document.getElementById('st-streak').textContent = streak;
  }

  function renderStreak() {
    const el = document.getElementById('mq-streak');
    el.innerHTML = '';
    streakHistory.forEach(ok => {
      const dot = document.createElement('div');
      dot.className = 'mq-streak-dot';
      dot.style.background = ok ? '#00ff41' : '#ff0055';
      el.appendChild(dot);
    });
  }

  function resetStats() {
    totalQ = 0; correctQ = 0; streak = 0; maxStreak = 0; streakHistory = [];
    updateStats(); renderStreak();
  }

  function init() { }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else setTimeout(init, 50);
  return { setDiff, generate, submit, resetStats };
})();
</script>
