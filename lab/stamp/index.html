  <filter id="liquid-refract">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" />

<script>
  document.addEventListener('DOMContentLoaded', function() { setupCalculator(); });
  if (window.swup) { window.swup.hooks.on('page:view', () => { setupCalculator(); }); }

  function setupCalculator() {
    var btn = document.getElementById('calcBtn');
    if (btn) {
      var newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      newBtn.addEventListener('click', runCalculation);
      var input = document.getElementById('targetPrice');
      if(input) {
        input.addEventListener('keydown', function(e) { if(e.key === 'Enter') runCalculation(); });
      }
    }
  }

  function runCalculation() {
    var stamps = [1, 2, 5, 10, 20, 50, 85, 100, 110, 140, 180, 260, 300, 500];
    var targetInput = document.getElementById('targetPrice');
    var resultArea = document.getElementById('resultArea');
    var listElement = document.getElementById('stampList');
    var totalElement = document.getElementById('totalCount');

    if (!targetInput) return;
    var target = parseInt(targetInput.value);

    if (isNaN(target) || target <= 0) { alert("正しい金額を入力してください"); return; }

    var dp = new Array(target + 1).fill(Infinity);
    var parent = new Array(target + 1).fill(0);
    dp[0] = 0;

    for (var i = 1; i <= target; i++) {
      for (var j = 0; j < stamps.length; j++) {
        var s = stamps[j];
        if (i - s >= 0 && dp[i - s] + 1 < dp[i]) {
          dp[i] = dp[i - s] + 1;
          parent[i] = s;
        }
      }
    }

    if (dp[target] === Infinity) { alert("この金額は作れません"); return; }

    listElement.innerHTML = '';
    var current = target;
    var resultStamps = {};
    while (current > 0) {
      var s = parent[current];
      resultStamps[s] = (resultStamps[s] || 0) + 1;
      current -= s;
    }

    Object.keys(resultStamps).map(Number).sort((a,b)=>b-a).forEach(function(val) {
      var div = document.createElement('div');
      div.className = 'stamp-card';
      div.innerHTML = '<div class="stamp-value">' + val + '<span class="stamp-yen">円</span></div>' +
                      '<div class="stamp-badge">× ' + resultStamps[val] + '枚</div>';
      listElement.appendChild(div);
    });

    totalElement.textContent = dp[target];
    resultArea.style.display = 'block';
  }
</script>
