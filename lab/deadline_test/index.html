<section class="dmt-app" data-dmt-root aria-label="締切管理">
  <div class="dmt-wrap">
    <header class="dmt-mast">
      <div class="dmt-mast-copy">
        <p class="dmt-kicker">Task &amp; Schedule Tracker</p>
        <h1>Deadline<br><span class="dmt-thin">Manager</span></h1>
        <p class="dmt-subtitle">課題締切管理 — 出発案内板</p>
      </div>
      <div class="dmt-mast-status">
        <div>
          <time id="dmt-clock" class="dmt-clock">--:--:--</time>
          <span id="dmt-clock-date" class="dmt-clock-date">----</span>
        </div>
        <div class="dmt-mast-actions">
          <button class="dm-pill" type="button" data-dt-four-edge aria-label="締切データを同期">LOCAL</button>
          <button id="dmt-settings" class="dmt-icon-button" type="button" data-dt-four-edge aria-label="システム設定">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <section class="dmt-board" aria-labelledby="dmt-board-heading">
      <div class="dmt-board-head">
        <span id="dmt-board-heading">Next Departure — 次の締切</span>
        <span class="dmt-live"><i aria-hidden="true"></i>LIVE</span>
      </div>
      <div id="dmt-board-body" class="dmt-board-body" aria-live="polite"></div>
    </section>

    <nav class="dmt-stats" aria-label="締切の絞り込み" data-dt-four-edge>
      <button type="button" class="dmt-stat" data-dmt-tab="all">
        <strong id="dmt-count-all" class="dmt-n">0</strong><span class="dmt-l">未完了</span><small class="dmt-en">REMAINING</small>
      </button>
      <button type="button" class="dmt-stat dmt-stat-urgent" data-dmt-tab="urgent">
        <strong id="dmt-count-urgent" class="dmt-n">0</strong><span class="dmt-l">緊急・期限切れ</span><small class="dmt-en">URGENT + OVERDUE</small>
      </button>
      <button type="button" class="dmt-stat dmt-stat-done" data-dmt-tab="done">
        <strong id="dmt-count-done" class="dmt-n">0</strong><span class="dmt-l">完了</span><small class="dmt-en">DONE</small>
      </button>
    </nav>

    <div class="dmt-tabs" role="tablist" aria-label="タスク表示">
      <button type="button" class="dmt-tab" role="tab" data-dmt-tab="all">未完了 <span id="dmt-tab-all" class="dmt-cnt">0</span></button>
      <button type="button" class="dmt-tab" role="tab" data-dmt-tab="urgent">緊急 <span id="dmt-tab-urgent" class="dmt-cnt">0</span></button>
      <button type="button" class="dmt-tab" role="tab" data-dmt-tab="done">完了 <span id="dmt-tab-done" class="dmt-cnt">0</span></button>
    </div>
    <div class="dmt-list-note"><span>SORT — 締切が近い順</span><span id="dmt-list-summary"></span></div>
    <div id="dmt-list" class="dmt-list" aria-live="polite"></div>
  </div>

  <button id="dmt-fab" class="dmt-fab" type="button" data-dt-four-edge><span aria-hidden="true">＋</span>新規タスク</button>

  <dialog id="dmt-task-dialog" class="dmt-dialog">
    <form id="dmt-form" method="dialog" class="dmt-sheet">
      <div class="dmt-sheet-handle" aria-hidden="true"></div>
      <div class="dmt-sheet-title">
        <h2><span id="dmt-dialog-title">新規タスク</span><span class="dmt-en">NEW TASK</span></h2>
        <button id="dmt-dialog-close" class="dmt-close" type="button" data-dt-four-edge aria-label="閉じる">閉じる</button>
      </div>
      <input id="dmt-id" type="hidden">
      <input id="dmt-source" type="hidden">
      <div class="dmt-field">
        <label for="dmt-title">タイトル <b>必須</b></label>
        <input class="dmt-input" id="dmt-title" type="text" required autocomplete="off" placeholder="例: レポート提出" data-dt-four-edge>
      </div>
      <div class="dmt-form-row">
        <div class="dmt-field">
          <label for="dmt-course">科目・カテゴリ</label>
          <input class="dmt-input" id="dmt-course" type="text" autocomplete="off" placeholder="例: 物理学" data-dt-four-edge>
        </div>
        <div class="dmt-field">
          <label for="dmt-priority">優先度</label>
          <select class="dmt-input" id="dmt-priority" data-dt-four-edge>
            <option value="high">高（緊急）</option>
            <option value="mid" selected>普通</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
      <div class="dmt-form-row">
        <div class="dmt-field dmt-field-date">
          <label for="dmt-date">締切日 <b>必須</b></label>
          <input class="dmt-input" id="dmt-date" type="date" required data-dt-four-edge>
        </div>
        <div class="dmt-field">
          <label for="dmt-period">時刻 / 限目</label>
          <select class="dmt-input" id="dmt-period" data-dt-four-edge>
            <option value="end">23:59（当日中）</option>
            <option value="1">1限 08:50</option>
            <option value="2">2限 10:30</option>
            <option value="3">3限 13:00</option>
            <option value="4">4限 14:40</option>
            <option value="5">5限 16:20</option>
          </select>
        </div>
      </div>
      <div class="dmt-sheet-actions">
        <button id="dmt-delete" class="dmt-button dmt-button-delete" type="button" data-dt-four-edge hidden>削除</button>
        <button id="dmt-cancel" class="dmt-button" type="button" data-dt-four-edge>キャンセル</button>
        <button id="dmt-save" class="dmt-button dmt-button-primary" type="submit" data-dt-four-edge>保存する</button>
      </div>
    </form>
  </dialog>

  <dialog id="dmt-config-dialog" class="dmt-dialog dmt-config-dialog">
    <section class="dmt-sheet" aria-labelledby="dmt-config-title">
      <div class="dmt-sheet-handle" aria-hidden="true"></div>
      <div class="dmt-sheet-title">
        <h2 id="dmt-config-title">同期設定</h2>
        <button id="dmt-config-close" class="dmt-close" type="button" data-dt-four-edge aria-label="閉じる">閉じる</button>
      </div>
      <div class="dmt-config-status" data-dt-four-edge>
        <span>現在の状態</span>
        <strong id="dmt-config-status">ローカルのみ</strong>
      </div>
      <p>この画面は既存のDeadline Managerと同じデータを使います。端末間同期の接続・解除はSync Settingsで管理されます。</p>
      <a class="dmt-button dmt-button-primary" href="/project-x/sync-settings/" data-dt-four-edge>Sync Settingsを開く</a>
      <a class="dmt-button" href="/lab/" data-dt-four-edge>LABへ戻る</a>
    </section>
  </dialog>

  <div id="dmt-toast" class="dmt-toast" role="status" aria-live="polite"></div>
</section>
