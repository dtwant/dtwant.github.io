<!doctype html>
<html lang="ja" data-dt-private-shell="v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>Protected Area · dt's world</title>
  <style>
    :root {
      color-scheme: dark;
      --pv-bg: #050508;
      --pv-surface: rgba(20, 20, 27, .78);
      --pv-border: rgba(255, 255, 255, .09);
      --pv-text: #f5f5f7;
      --pv-muted: rgba(245, 245, 247, .58);
      --pv-subtle: rgba(245, 245, 247, .36);
      --pv-accent: 192 92% 61%;
      --pv-danger: 354 78% 67%;
      --pv-ease: cubic-bezier(.25, .46, .45, .94);
      --pv-spring: cubic-bezier(.34, 1.56, .64, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--pv-bg); }
    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 16% 10%, hsl(var(--pv-accent) / .13), transparent 34rem),
        radial-gradient(circle at 88% 88%, rgba(160, 92, 255, .11), transparent 30rem),
        linear-gradient(145deg, #07070c, #020204 70%);
      color: var(--pv-text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body::before {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black, transparent 82%);
      content: "";
      pointer-events: none;
    }
    .pv-shell {
      position: relative;
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    .pv-card {
      width: min(100%, 420px);
      padding: clamp(24px, 6vw, 38px);
      overflow: hidden;
      border-top: 1px solid var(--pv-border) !important;
      border-right: 1px solid var(--pv-border) !important;
      border-bottom: 1px solid var(--pv-border) !important;
      border-left: 1px solid var(--pv-border) !important;
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)), var(--pv-surface);
      box-shadow: 0 2px 5px rgba(0,0,0,.18), 0 18px 48px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.07);
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
    }
    .pv-mark {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 26px;
      place-items: center;
      border-top: 1px solid hsl(var(--pv-accent) / .28) !important;
      border-right: 1px solid hsl(var(--pv-accent) / .28) !important;
      border-bottom: 1px solid hsl(var(--pv-accent) / .28) !important;
      border-left: 1px solid hsl(var(--pv-accent) / .28) !important;
      border-radius: 18px;
      background: hsl(var(--pv-accent) / .09);
      box-shadow: inset 0 1px 0 hsl(var(--pv-accent) / .12), 0 12px 30px hsl(var(--pv-accent) / .08);
      color: hsl(var(--pv-accent));
    }
    .pv-mark svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.75; }
    .pv-eyebrow {
      margin: 0 0 8px;
      color: hsl(var(--pv-accent));
      font-size: 12px;
      font-weight: 720;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--pv-text);
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 720;
      letter-spacing: -.035em;
      line-height: 1.14;
    }
    .pv-copy { margin: 12px 0 28px; color: var(--pv-muted); font-size: 14px; line-height: 1.75; }
    .pv-field { display: grid; gap: 9px; }
    .pv-field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .pv-field-head label { color: var(--pv-text); font-size: 13px; font-weight: 700; letter-spacing: .01em; }
    .pv-field-hint { color: var(--pv-subtle); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
    .pv-input-wrap { position: relative; }
    .pv-input-wrap::after { position: absolute; right: 57px; bottom: 7px; left: 45px; height: 1px; background: linear-gradient(90deg, transparent, hsl(var(--pv-accent) / .22), transparent); content: ""; opacity: 0; pointer-events: none; transition: opacity .2s var(--pv-ease); }
    .pv-input-wrap:focus-within::after,
    .pv-input-wrap[data-state="ready"]::after { opacity: 1; }
    .pv-input-icon { position: absolute; top: 50%; left: 14px; display: grid; width: 20px; height: 20px; place-items: center; color: var(--pv-subtle); pointer-events: none; transform: translateY(-50%); transition: color .2s var(--pv-ease); }
    .pv-input-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .pv-input {
      width: 100%;
      min-height: 52px;
      padding: 0 54px 0 46px;
      border-top: 1px solid rgba(255,255,255,.11) !important;
      border-right: 1px solid rgba(255,255,255,.11) !important;
      border-bottom: 1px solid rgba(255,255,255,.11) !important;
      border-left: 1px solid rgba(255,255,255,.11) !important;
      border-radius: 14px;
      outline: 0;
      background: rgba(4,4,8,.64);
      color: var(--pv-text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: .055em;
      line-height: 1.3;
      transition: border-color .2s var(--pv-ease), box-shadow .2s var(--pv-ease), background .2s var(--pv-ease);
    }
    .pv-input:hover { background: rgba(8,8,13,.82); }
    .pv-input:focus { border-color: hsl(var(--pv-accent) / .64) !important; box-shadow: 0 0 0 4px hsl(var(--pv-accent) / .11), 0 10px 28px hsl(var(--pv-accent) / .08); }
    .pv-input-wrap:focus-within .pv-input-icon,
    .pv-input-wrap[data-state="ready"] .pv-input-icon { color: hsl(var(--pv-accent)); }
    .pv-input-wrap[data-state="invalid"] .pv-input { border-color: hsl(var(--pv-danger) / .64) !important; }
    .pv-input-wrap[data-state="invalid"] .pv-input-icon { color: hsl(var(--pv-danger)); }
    .pv-input-meta { display: flex; min-height: 18px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 3px; color: var(--pv-subtle); font-size: 11px; line-height: 1.45; }
    .pv-input-help { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv-input-count { flex: 0 0 auto; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    .pv-input-wrap[data-state="ready"] + .pv-input-meta .pv-input-help { color: hsl(var(--pv-accent) / .86); }
    .pv-input-wrap[data-state="invalid"] + .pv-input-meta .pv-input-help { color: hsl(var(--pv-danger)); }
    .pv-reveal {
      position: absolute;
      top: 4px;
      right: 4px;
      display: grid;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      border: 0 transparent none !important;
      border-radius: 11px;
      background: transparent;
      color: var(--pv-muted);
      cursor: pointer;
      text-decoration: none !important;
      transition: color .2s var(--pv-ease), background .2s var(--pv-ease), transform 80ms ease-out;
    }
    .pv-reveal:hover { background: rgba(255,255,255,.055); color: var(--pv-text); }
    .pv-reveal:active { transform: scale(.92); }
    .pv-reveal svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .pv-remember { display: flex; min-height: 44px; margin: 7px 0 12px; align-items: center; gap: 10px; padding: 0 11px; border-top: 1px solid rgba(255,255,255,.06) !important; border-right: 1px solid rgba(255,255,255,.06) !important; border-bottom: 1px solid rgba(255,255,255,.06) !important; border-left: 1px solid rgba(255,255,255,.06) !important; border-radius: 12px; background: rgba(255,255,255,.025); color: var(--pv-muted); cursor: pointer; font-size: 12px; line-height: 1.4; transition: border-color .2s var(--pv-ease), background .2s var(--pv-ease), color .2s var(--pv-ease); }
    .pv-remember:hover { border-color: hsl(var(--pv-accent) / .24) !important; background: hsl(var(--pv-accent) / .055); color: var(--pv-text); }
    .pv-remember input { width: 18px; height: 18px; margin: 0; accent-color: hsl(var(--pv-accent)); }
    .pv-submit {
      display: flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      border-top: 1px solid hsl(var(--pv-accent) / .46) !important;
      border-right: 1px solid hsl(var(--pv-accent) / .46) !important;
      border-bottom: 1px solid hsl(var(--pv-accent) / .46) !important;
      border-left: 1px solid hsl(var(--pv-accent) / .46) !important;
      border-radius: 14px;
      background: linear-gradient(180deg, hsl(var(--pv-accent) / .24), hsl(var(--pv-accent) / .14));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.11), 0 10px 28px hsl(var(--pv-accent) / .10);
      color: #f8fdff;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none !important;
      transition: transform 80ms ease-out, border-color .2s var(--pv-ease), background .2s var(--pv-ease), opacity .2s var(--pv-ease);
    }
    .pv-submit:hover { border-color: hsl(var(--pv-accent) / .72) !important; background: linear-gradient(180deg, hsl(var(--pv-accent) / .31), hsl(var(--pv-accent) / .18)); }
    .pv-submit:active { transform: scale(.97); }
    .pv-submit:disabled { cursor: wait; opacity: .62; }
    .pv-spinner { display: none; width: 17px; height: 17px; border: 2px solid rgba(255,255,255,.24); border-top-color: white; border-radius: 50%; animation: pv-spin .7s linear infinite; }
    .pv-submit[aria-busy="true"] .pv-spinner { display: block; }
    .pv-status { min-height: 22px; margin: 14px 2px 0; color: var(--pv-subtle); font-size: 12px; line-height: 1.55; }
    .pv-status[data-state="error"] { color: hsl(var(--pv-danger)); }
    .pv-meta { display: flex; margin-top: 24px; align-items: center; gap: 8px; color: var(--pv-subtle); font-size: 11px; line-height: 1.5; }
    .pv-meta svg { width: 14px; height: 14px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; }
    noscript { display: block; margin-top: 16px; color: hsl(var(--pv-danger)); font-size: 13px; line-height: 1.6; }
    @keyframes pv-spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .pv-shell { align-items: end; padding-right: 0; padding-bottom: 0; padding-left: 0; }
      .pv-card { width: 100%; border-right: 0 transparent none !important; border-bottom: 0 transparent none !important; border-left: 0 transparent none !important; border-radius: 26px 26px 0 0; padding-bottom: max(28px, calc(18px + env(safe-area-inset-bottom))); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

    <section class="pv-card" aria-labelledby="pv-title">
      <div class="pv-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      </div>
      <p class="pv-eyebrow">Encrypted area</p>
      <h1 id="pv-title">保護されたエリア</h1>

      <form id="pv-form" novalidate>
        <div class="pv-field">
          <div class="pv-field-head">
            <label for="pv-passphrase">パスフレーズ</label>
            <span class="pv-field-hint">4〜24文字</span>
          </div>
          <div class="pv-input-wrap">
            <span class="pv-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15.5" r="1.2"></circle></svg></span>
            <input class="pv-input" id="pv-passphrase" name="passphrase" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" autocapitalize="none" spellcheck="false" minlength="4" maxlength="24" aria-describedby="pv-passphrase-help pv-passphrase-count" placeholder="パスフレーズを入力" required autofocus>
            <button class="pv-reveal" id="pv-reveal" type="button" aria-label="パスフレーズを表示" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </button>
          </div>
          <div class="pv-input-meta">
            <span class="pv-input-help" id="pv-passphrase-help">4〜24文字で入力してください</span>

          <label class="pv-remember"><input id="pv-remember" type="checkbox"><span id="pv-remember-label">このタブで30分間保持する</span></label>

        <button class="pv-submit" id="pv-submit" type="submit">
          <span class="pv-spinner" aria-hidden="true"></span>
          <span id="pv-submit-label">復号して開く</span>
        </button>
        <p class="pv-status" id="pv-status" role="status" aria-live="polite"></p>
      </form>
      <div class="pv-meta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span>AES-256-GCM · PBKDF2-SHA-256 · 端末内復号</span>
      </div>
      <noscript>復号にはJavaScriptとWeb Crypto APIが必要です。</noscript>
    </section>

  <script>
    (() => {
      'use strict';
      const SESSION_KEY = "dtw-private-passphrase-v1";
      const PROJECT_X_SESSION_KEY = "dtw-private-passphrase-project-x-v1";
      const SESSION_TTL = 1800000;
      const form = document.getElementById('pv-form');
      const input = document.getElementById('pv-passphrase');
      const inputWrap = document.querySelector('.pv-input-wrap');
      const inputHelp = document.getElementById('pv-passphrase-help');
      const inputCount = document.getElementById('pv-passphrase-count');
      const remember = document.getElementById('pv-remember');
      const rememberLabel = document.getElementById('pv-remember-label');
      const submit = document.getElementById('pv-submit');
      const submitLabel = document.getElementById('pv-submit-label');
      const status = document.getElementById('pv-status');
      const reveal = document.getElementById('pv-reveal');
      const payload = JSON.parse(document.getElementById('pv-payload').textContent);
      const shares0723Session = /^\/0723(?:\/|$)/.test(payload.path);
      // 0723配下だけは入口の解除状態を共有する。Project Xは独立した領域なので、
      // 0723の解除状態だけで復号画面を自動スキップしない。
      const sessionKey = shares0723Session ? SESSION_KEY : PROJECT_X_SESSION_KEY;
      const encoder = new TextEncoder();
      const decoder = new TextDecoder('utf-8', { fatal: true });
      let attempts = 0;

      const fromBase64 = (value) => {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return bytes;
      };

      const setBusy = (busy) => {
        submit.disabled = busy;
        submit.setAttribute('aria-busy', String(busy));
        submitLabel.textContent = busy ? '復号しています…' : '復号して開く';
        input.readOnly = busy;
      };

      const setStatus = (message, state = '') => {
        status.textContent = message;
        status.dataset.state = state;
      };

      const clearRemembered = () => {
        try { sessionStorage.removeItem(sessionKey); } catch (_) { /* fail closed */ }
      };

      const readRemembered = () => {
        try {
          const stored = JSON.parse(sessionStorage.getItem(sessionKey) || 'null');
          if (!stored || typeof stored.value !== 'string' || stored.expiresAt <= Date.now()) {
            clearRemembered();
            return null;
          }
          return stored.value;
        } catch (_) {
          clearRemembered();
          return null;
        }
      };

      const storeRemembered = (value) => {
        try {
          sessionStorage.setItem(sessionKey, JSON.stringify({ value, expiresAt: Date.now() + SESSION_TTL }));
        } catch (_) { /* unlocking must still work when storage is disabled */ }
      };

      const updatePassphraseMeta = () => {
        const length = Array.from(input.value).length;
        const valid = length >= 4 && length <= 24;
        inputCount.textContent = String(length) + ' / ' + 24;
        inputWrap.dataset.state = length === 0 ? 'empty' : valid ? 'ready' : 'invalid';
        input.setAttribute('aria-invalid', String(length > 0 && !valid));
        if (length === 0) inputHelp.textContent = '4〜24文字で入力してください';
        else if (length < 4) inputHelp.textContent = 'あと' + String(4 - length) + '文字以上入力してください';
        else if (valid) inputHelp.textContent = '入力内容を確認して復号します';
        else inputHelp.textContent = '24文字以内で入力してください';
      };

      const unlock = async (passphrase, auto = false) => {
        if (!window.crypto?.subtle) {
          setStatus('このブラウザーは安全な復号機能に対応していません。最新版へ更新してください。', 'error');
          return;
        }
        const passphraseLength = typeof passphrase === 'string' ? Array.from(passphrase).length : 0;
        if (passphraseLength < 4 || passphraseLength > 24) {
          setStatus('4〜24文字で入力してください。', 'error');
          input.focus();
          return;
        }

        setBusy(true);
        setStatus(auto ? 'このタブの解除状態を確認しています…' : '暗号化された本文を検証しています…');
        try {
          const expectedPath = payload.path.endsWith('/') ? payload.path : payload.path + '/';
          const currentPath = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
          if (expectedPath !== currentPath) throw new Error('path mismatch');

          const material = await crypto.subtle.importKey(
            'raw', encoder.encode(passphrase), 'PBKDF2', false, ['deriveKey']
          );
          const key = await crypto.subtle.deriveKey(
            {
              name: 'PBKDF2',
              hash: 'SHA-256',
              salt: fromBase64(payload.salt),
              iterations: payload.iterations,
            },
            material,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );
          const plaintextBuffer = await crypto.subtle.decrypt(
            {
              name: 'AES-GCM',
              iv: fromBase64(payload.iv),
              additionalData: fromBase64(payload.aad),
              tagLength: 128,
            },
            key,
            fromBase64(payload.data)
          );
          const plaintext = decoder.decode(plaintextBuffer);
          if (!/^<!doctype html>/i.test(plaintext)) throw new Error('invalid document');

          if (remember.checked) storeRemembered(passphrase);
          else clearRemembered();
          input.value = '';
          setStatus('確認できました。ページを開いています…');
          const authenticatedPlaintext = plaintext.replace(
            /<html\b/i,
            '<html data-dt-private-unlocked="true"'
          );
          document.open();
          document.write(authenticatedPlaintext);
          document.close();
        } catch (_) {
          attempts += 1;
          clearRemembered();
          const delay = Math.min(2600, 280 * (2 ** Math.min(attempts - 1, 4)));
          await new Promise((resolve) => setTimeout(resolve, delay));
          setBusy(false);
          setStatus('開けませんでした。パスフレーズを確認して、もう一度お試しください。', 'error');
          input.select();
        }
      };

      reveal.addEventListener('click', () => {
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        reveal.setAttribute('aria-pressed', String(!visible));
        reveal.setAttribute('aria-label', visible ? 'パスフレーズを表示' : 'パスフレーズを隠す');
        input.focus({ preventScroll: true });
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        unlock(input.value);
      });
      input.addEventListener('input', updatePassphraseMeta);
      updatePassphraseMeta();

      const remembered = readRemembered();
      if (shares0723Session) {
        remember.checked = true;
        rememberLabel.textContent = 'このタブで30分間保持する（0723内のツールで共有）';
      }
      if (remembered) {
        remember.checked = true;
        unlock(remembered, true);
      }
    })();
  </script>
</body>
</html>
